<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ISP MAP — Gerenciamento de Rede</title>
<style>
:root{
  --bg-app:#0a0d12;
  --bg-panel:#11151c;
  --bg-panel-alt:#161b23;
  --bg-input:#0d1117;
  --border:#232a35;
  --border-soft:#1a1f28;
  --text:#c7d1dc;
  --text-dim:#7c8798;
  --text-faint:#4d5666;
  --accent:#4fd1c5;
  --accent-dim:#2a6e68;
  --green:#3fb950;
  --yellow:#d29922;
  --red:#f85149;
  --gray:#6e7681;
  --font-ui: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-mono: "SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;background:var(--bg-app);color:var(--text);font-family:var(--font-ui);font-size:12.5px;overflow:hidden;}
button{font-family:inherit;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#2a3140;border-radius:4px;}

#app{display:grid;grid-template-rows:40px 1fr;height:100vh;width:100vw;}

/* ===== TOPBAR ===== */
#topbar{
  display:flex;align-items:center;gap:14px;
  background:var(--bg-panel);border-bottom:1px solid var(--border);
  padding:0 12px;position:relative;z-index:1200;
}
.brand{display:flex;align-items:center;gap:7px;font-weight:700;letter-spacing:.4px;font-size:13px;color:#e6edf3;white-space:nowrap;}
.brand .dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green);}
.kpis{display:flex;gap:2px;align-items:center;}
.kpi{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:2px 10px;border-right:1px solid var(--border-soft);min-width:52px;cursor:default;
}
.kpi:last-child{border-right:none;}
.kpi b{font-size:13px;font-weight:700;color:#e6edf3;line-height:1.1;font-family:var(--font-mono);}
.kpi span{font-size:9px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.5px;}
.kpi.alert b{color:var(--yellow);}
.topbar-search{position:relative;flex:1;max-width:320px;margin-left:auto;}
.topbar-search input{
  width:100%;background:var(--bg-input);border:1px solid var(--border);color:var(--text);
  padding:6px 10px 6px 26px;border-radius:4px;font-size:12px;outline:none;
}
.topbar-search input:focus{border-color:var(--accent-dim);}
.topbar-search svg{position:absolute;left:7px;top:50%;transform:translateY(-50%);width:13px;height:13px;stroke:var(--text-dim);pointer-events:none;}
.search-results{
  position:absolute;top:32px;left:0;right:0;background:var(--bg-panel-alt);border:1px solid var(--border);
  border-radius:4px;max-height:260px;overflow-y:auto;display:none;box-shadow:0 8px 24px rgba(0,0,0,.5);
}
.search-results.show{display:block;}
.search-item{padding:7px 10px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--border-soft);}
.search-item:hover{background:#1c232e;}
.search-item small{color:var(--text-dim);font-family:var(--font-mono);}

.btn{
  background:var(--bg-input);border:1px solid var(--border);color:var(--text);
  padding:6px 11px;border-radius:4px;cursor:pointer;font-size:11.5px;font-weight:600;
  display:flex;align-items:center;gap:6px;white-space:nowrap;transition:border-color .1s;
}
.btn:hover{border-color:#3a4354;}
.btn-accent{background:var(--accent);border-color:var(--accent);color:#04211f;}
.btn-accent:hover{background:#66d9cf;}
.btn-danger{color:var(--red);}
.btn-ghost{background:transparent;border-color:transparent;}
.btn-ghost:hover{background:var(--bg-panel-alt);}
.btn-sm{padding:4px 8px;font-size:10.5px;}
.btn:disabled{opacity:.4;cursor:not-allowed;}

/* ===== BODY LAYOUT ===== */
#body{display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:1fr;height:100%;min-height:0;position:relative;}

/* ===== LEFT SIDEBAR ===== */
#sidebar-left{
  width:190px;background:var(--bg-panel);border-right:1px solid var(--border);
  display:flex;flex-direction:column;transition:width .15s;overflow:hidden;
}
#sidebar-left.collapsed{width:34px;}
.sb-header{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-bottom:1px solid var(--border-soft);flex-shrink:0;}
.sb-header span{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--text-dim);font-weight:700;}
#sidebar-left.collapsed .sb-header span,
#sidebar-left.collapsed .sb-section{display:none;}
.sb-toggle{cursor:pointer;color:var(--text-dim);background:none;border:none;padding:4px;display:flex;}
.sb-toggle:hover{color:var(--text);}
.sb-content{overflow-y:auto;flex:1;padding:6px 0;}
.sb-section{padding:4px 10px 12px;border-bottom:1px solid var(--border-soft);}
.sb-section h4{margin:2px 0 6px;font-size:9.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--text-faint);font-weight:700;}
.layer-row{display:flex;align-items:center;gap:7px;padding:4px 2px;border-radius:3px;cursor:pointer;user-select:none;}
.layer-row:hover{background:var(--bg-panel-alt);}
.layer-row input{accent-color:var(--accent);width:12px;height:12px;}
.layer-row .swatch{width:9px;height:9px;border-radius:2px;flex-shrink:0;}
.layer-row label{flex:1;cursor:pointer;font-size:11.5px;color:var(--text);}
.layer-row .count{font-family:var(--font-mono);color:var(--text-faint);font-size:10px;}

/* ===== MAP ===== */
#map-wrap{position:relative;min-width:0;height:100%;min-height:0;}
#map{width:100%;height:100%;background:#0b0e13;}
#map{position:relative;overflow:hidden;cursor:grab;
  background:
    linear-gradient(rgba(79,209,197,.045) 1px,transparent 1px) 0 0/34px 34px,
    linear-gradient(90deg,rgba(79,209,197,.045) 1px,transparent 1px) 0 0/34px 34px,
    #0b0e13;
}
#map.panning{cursor:grabbing;}
#map.crosshair{cursor:crosshair;}
#map svg{display:block;user-select:none;}
.mlink{stroke-linecap:round;cursor:pointer;}
.mlink-hit{stroke:transparent;stroke-width:14;fill:none;cursor:pointer;}
.mnode{cursor:pointer;}
.mnode-hit{fill:transparent;}
.mlabel{fill:#dbe4ee;font-size:9.5px;font-family:var(--font-mono);pointer-events:none;}
.mlabel.dim{opacity:.15;}
.mhandle{fill:#4fd1c5;stroke:#04211f;stroke-width:2;cursor:crosshair;}
.mhandle:hover{fill:#8be9e0;}
.msnap{fill:none;stroke:#4fd1c5;stroke-width:3;}
.mtemp{stroke:#4fd1c5;stroke-width:2.5;stroke-dasharray:5,4;fill:none;pointer-events:none;}
.map-zoom{position:absolute;right:10px;bottom:36px;z-index:700;display:flex;flex-direction:column;gap:4px;}
.map-zoom button{
  width:30px;height:30px;border-radius:5px;border:1px solid var(--border);
  background:rgba(17,21,28,.94);color:var(--text);font-size:16px;font-weight:700;cursor:pointer;line-height:1;
}
.map-zoom button:hover{border-color:var(--accent-dim);color:#fff;}

#mode-banner{
  position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:900;
  background:var(--accent);color:#04211f;padding:6px 14px;border-radius:5px;font-weight:700;font-size:11.5px;
  display:none;align-items:center;gap:10px;box-shadow:0 4px 14px rgba(0,0,0,.4);
}
#mode-banner.show{display:flex;}
#mode-banner button{background:rgba(0,0,0,.15);border:none;color:#04211f;border-radius:3px;padding:2px 8px;cursor:pointer;font-weight:700;font-size:10.5px;}

.map-legend{
  position:absolute;bottom:10px;left:10px;z-index:600;background:rgba(17,21,28,.92);border:1px solid var(--border);
  border-radius:5px;padding:8px 10px;font-size:10.5px;color:var(--text-dim);display:flex;gap:12px;
}
.map-legend .lg-item{display:flex;align-items:center;gap:5px;}
.map-legend .lg-dot{width:8px;height:8px;border-radius:50%;}

.map-attrib{position:absolute;bottom:10px;right:10px;z-index:600;font-size:9.5px;color:var(--text-faint);background:rgba(17,21,28,.7);padding:2px 6px;border-radius:3px;}
.map-fit-btn{position:absolute;top:10px;right:10px;z-index:700;background:rgba(17,21,28,.94);}
.map-basemap{position:absolute;top:10px;right:150px;z-index:700;}
.map-basemap select{
  background:rgba(17,21,28,.94);border:1px solid var(--border);color:var(--text);
  border-radius:4px;padding:6px 8px;font-size:11.5px;font-family:inherit;outline:none;cursor:pointer;
}
.map-basemap select:focus{border-color:var(--accent-dim);}
.mtile{image-rendering:auto;}
#map.has-tiles{background:#0b0e13;}
.tile-warning{
  position:absolute;bottom:34px;left:50%;transform:translateX(-50%);z-index:700;
  background:rgba(210,153,34,.14);border:1px solid rgba(210,153,34,.35);color:#e8c874;
  padding:6px 12px;border-radius:5px;font-size:11px;display:none;max-width:420px;text-align:center;line-height:1.45;
}
.tile-warning.show{display:block;}

/* custom leaflet icon wrapper */
.node-icon{display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--bg-panel);cursor:pointer;transition:transform .1s;}
.node-icon:hover{transform:scale(1.12);}
.node-icon.dimmed{opacity:.18;}
.node-icon.selected{box-shadow:0 0 0 3px rgba(79,209,197,.55);}
.node-icon svg{width:62%;height:62%;}
.node-label{
  font-size:9.5px;color:#dbe4ee;background:rgba(10,13,18,.72);padding:0 4px;border-radius:2px;
  white-space:nowrap;font-family:var(--font-mono);pointer-events:none;
}
.node-label.dimmed{opacity:.15;}

/* ===== CONNECTOR HANDLES (drag-to-link) ===== */
.connector-handle{
  position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;
  background:var(--accent);border:2px solid #04211f;cursor:crosshair;z-index:750;
  box-shadow:0 0 0 3px rgba(79,209,197,.25);pointer-events:auto;
}
.connector-handle:hover{background:#8be9e0;transform:scale(1.15);}
#connector-drag-svg{position:absolute;inset:0;pointer-events:none;z-index:740;display:none;}
#connector-drag-svg.active{display:block;}
#connector-drag-svg line{stroke:var(--accent);stroke-width:2.5;stroke-dasharray:5,4;}
.node-icon.snap-target{box-shadow:0 0 0 4px rgba(79,209,197,.85),0 0 16px 4px rgba(79,209,197,.6)!important;transform:scale(1.2);}
.connect-hint{
  position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:900;
  background:#04211f;color:var(--accent);border:1px solid var(--accent-dim);padding:4px 12px;
  border-radius:5px;font-size:10.5px;font-weight:600;display:none;pointer-events:none;
}
.connect-hint.show{display:block;}

/* ===== DIAGRAMA UNIFILAR (nível 2) ===== */
.diagram-overlay{position:fixed;inset:0;background:var(--bg-app);z-index:2500;display:none;flex-direction:column;}
.diagram-overlay.show{display:flex;}
.diagram-head{
  display:flex;align-items:center;justify-content:space-between;padding:10px 16px;
  border-bottom:1px solid var(--border);background:var(--bg-panel);flex-shrink:0;
}
.diagram-eyebrow{font-size:9.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--accent);font-weight:700;}
.diagram-title{font-size:15px;font-weight:700;color:#eef2f6;}
.diagram-grid{flex:1;display:grid;grid-template-columns:220px 1fr 260px;min-height:0;}
.diagram-col{overflow-y:auto;padding:12px;}
.diagram-col-cables{border-right:1px solid var(--border-soft);background:var(--bg-panel);}
.diagram-col-info{border-left:1px solid var(--border-soft);background:var(--bg-panel);}
.diagram-col-canvas{padding:0;background:
  linear-gradient(var(--border-soft) 1px,transparent 1px) 0 0/100% 28px,
  linear-gradient(90deg,var(--border-soft) 1px,transparent 1px) 0 0/28px 100%,
  var(--bg-app);display:flex;align-items:center;justify-content:center;}
.diagram-col-canvas svg{width:100%;height:100%;}
.cable-block{margin-bottom:14px;}
.cable-block h5{margin:0 0 2px;font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--text-faint);font-weight:700;}
.cable-meta{font-size:9.5px;color:var(--text-faint);font-family:var(--font-mono);margin-bottom:6px;}
.tube-head{display:flex;align-items:center;gap:6px;margin:7px 0 3px;font-size:9.5px;text-transform:uppercase;
  letter-spacing:.4px;color:var(--text-dim);font-weight:700;border-top:1px solid var(--border-soft);padding-top:6px;}
.fiber-row{display:flex;align-items:center;gap:7px;padding:3px 5px;border-radius:3px;cursor:pointer;font-size:11px;}
.fiber-row:hover{background:var(--bg-panel-alt);}
.fiber-row.selected{background:rgba(79,209,197,.14);}
.fiber-swatch{width:10px;height:10px;border-radius:50%;border:1px solid rgba(255,255,255,.25);flex-shrink:0;}
.fiber-row .fn{font-family:var(--font-mono);color:var(--text-faint);width:16px;}
.fiber-row .fs{margin-left:auto;font-size:9px;color:var(--text-faint);text-transform:uppercase;}
.diagram-empty{padding:40px 16px;text-align:center;color:var(--text-faint);font-size:11.5px;line-height:1.6;}
.diagram-tools{display:flex;align-items:center;gap:6px;}
.dg-joinsel{display:flex;align-items:center;gap:4px;margin-right:6px;}
.dg-joinsel label{font-size:9.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--text-faint);font-weight:700;}
.dg-joinsel .btn.active{background:var(--accent);border-color:var(--accent);color:#04211f;}
.diagram-hint{
  padding:5px 16px;font-size:11px;border-bottom:1px solid var(--border-soft);
  background:var(--bg-panel-alt);color:var(--text-dim);display:none;
}
.diagram-hint.show{display:block;}
.diagram-hint b{color:var(--accent);}
.diagram-hint.locked{color:var(--yellow);background:rgba(210,153,34,.08);}
.diagram-col-canvas{overflow:auto;align-items:flex-start;}
/* ---- editor: blocos de cabo, pinos de fibra, splitters ---- */
.cbox{fill:var(--bg-panel-alt);stroke:var(--border);stroke-width:1.5;}
.cbox-title{fill:#eef2f6;font-size:11.5px;font-weight:700;font-family:var(--font-ui);}
.cbox-sub{fill:var(--text-faint);font-size:9.5px;font-family:var(--font-mono);}
.fpin{cursor:pointer;}
.fpin-ring{stroke-width:2;}
.fpin-num{font-size:8.5px;font-weight:700;font-family:var(--font-mono);pointer-events:none;}
.fpin.sel .fpin-ring{stroke:#4fd1c5;stroke-width:3.5;}
.fpin-label{fill:var(--text-dim);font-size:9px;font-family:var(--font-mono);pointer-events:none;}
.dconn{fill:none;stroke-width:2.2;cursor:pointer;}
.dconn:hover{stroke-width:4;}
.dconn.sel{stroke:#4fd1c5!important;stroke-width:4;}
.dconn.dim{opacity:.12;}
.dconn.hl{stroke-width:4;filter:drop-shadow(0 0 3px rgba(79,209,197,.7));}
.spl{cursor:pointer;}
.spl-body{fill:#1b2430;stroke:#4fd1c5;stroke-width:1.6;}
.spl.sel .spl-body{stroke-width:3;}
.spl-label{font-size:10px;font-weight:700;font-family:var(--font-mono);pointer-events:none;}
.spl-kind{font-size:8px;font-weight:700;letter-spacing:.5px;font-family:var(--font-ui);pointer-events:none;opacity:.8;}
.emenda-lbl{fill:#c7d1dc;font-size:8.5px;font-family:var(--font-mono);pointer-events:none;}
.emenda-lbl.conn{fill:#e8c874;}
.emenda-lbl.pass{fill:#6e7681;font-style:italic;}
.fpin-label.nofeed{fill:#4d5666;font-style:italic;}
.dblock{cursor:grab;}
.dblock:active{cursor:grabbing;}
.diagram-col-canvas{position:relative;}
.dg-zoom{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:4px;z-index:5;}
.dg-zoom button{
  width:28px;height:28px;border-radius:5px;border:1px solid var(--border);
  background:rgba(17,21,28,.95);color:var(--text);font-size:14px;cursor:pointer;line-height:1;
}
.dg-zoom button:hover{border-color:var(--accent-dim);color:#fff;}
.pwr{fill:#7fd6cd;font-size:9px;font-family:var(--font-mono);pointer-events:none;}
.pwr.bad{fill:var(--yellow);}
.pwr.nosig{fill:#6e7681;font-style:italic;}
.legend-chip{display:inline-flex;align-items:center;gap:4px;margin-right:9px;font-size:10px;color:var(--text-dim);}
.legend-chip i{width:9px;height:9px;border-radius:50%;display:inline-block;}
.spl-preview{margin-top:8px;background:var(--bg-input);border:1px solid var(--border-soft);border-radius:5px;padding:8px 9px;}
.spl-preview .prev-title{font-size:9.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--text-faint);font-weight:700;margin-bottom:5px;}
.spl-preview .prev-row{display:flex;justify-content:space-between;font-size:11px;font-family:var(--font-mono);padding:1.5px 0;}
.spl-preview .prev-row b{color:#7fd6cd;}
.spl-preview .prev-row b.bad{color:var(--yellow);}
.spl-preview .prev-warn{margin-top:5px;font-size:10.5px;color:var(--yellow);}
.spl-preview .muted{font-size:10.5px;color:var(--text-faint);}
.diag-line{cursor:pointer;transition:opacity .15s;}
.diag-line.dim{opacity:.12;}
.diag-line.hl{stroke-width:4.5!important;filter:drop-shadow(0 0 3px rgba(79,209,197,.7));}
.diag-node-box{fill:var(--bg-panel-alt);stroke:var(--border);stroke-width:1.5;}
.diag-label{fill:#c7d1dc;font-size:10px;font-family:var(--font-ui);}
.diag-label-bold{fill:#eef2f6;font-size:11px;font-weight:700;font-family:var(--font-ui);}
.diag-plug{cursor:pointer;}
.diag-plug.selected{filter:drop-shadow(0 0 4px rgba(79,209,197,.9));}
@media (max-width:760px){
  .diagram-grid{grid-template-columns:1fr;grid-template-rows:auto 1fr auto;}
  .diagram-col-cables{border-right:none;border-bottom:1px solid var(--border-soft);max-height:120px;}
  .diagram-col-info{border-left:none;border-top:1px solid var(--border-soft);max-height:160px;}
  #panel-right{position:fixed;right:0;top:40px;bottom:0;z-index:1300;}
  #sidebar-left{position:fixed;left:0;top:40px;bottom:0;z-index:1300;}
}

/* ===== RIGHT PANEL ===== */
#panel-right{
  width:300px;background:var(--bg-panel);border-left:1px solid var(--border);
  display:none;flex-direction:column;overflow:hidden;
}
#panel-right.show{display:flex;}
.panel-head{padding:11px 12px 9px;border-bottom:1px solid var(--border-soft);flex-shrink:0;}
.panel-head-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.panel-type-tag{font-size:9.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--accent);font-weight:700;margin-bottom:3px;}
.panel-title{font-size:15px;font-weight:700;color:#eef2f6;line-height:1.25;}
.panel-close{background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:16px;padding:0 2px;line-height:1;}
.panel-close:hover{color:var(--text);}
.status-pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:20px;margin-top:7px;text-transform:uppercase;letter-spacing:.3px;}
.status-pill .d{width:6px;height:6px;border-radius:50%;}
.st-normal{background:rgba(63,185,80,.13);color:var(--green);}
.st-normal .d{background:var(--green);}
.st-alerta{background:rgba(210,153,34,.14);color:var(--yellow);}
.st-alerta .d{background:var(--yellow);}
.st-critico{background:rgba(248,81,73,.14);color:var(--red);}
.st-critico .d{background:var(--red);}
.st-offline{background:rgba(110,118,129,.16);color:var(--gray);}
.st-offline .d{background:var(--gray);}

.panel-body{flex:1;overflow-y:auto;padding:10px 12px 16px;}
.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px;margin-bottom:12px;}
.field{display:flex;flex-direction:column;gap:2px;}
.field.full{grid-column:1/-1;}
.field label{font-size:9px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-faint);font-weight:700;}
.field .val{font-size:12.5px;color:var(--text);font-family:var(--font-mono);}
.field .val.big{font-size:15px;font-weight:700;color:#eef2f6;}

.section-title{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-faint);font-weight:700;margin:14px 0 6px;padding-top:10px;border-top:1px solid var(--border-soft);}
.section-title:first-child{margin-top:0;padding-top:0;border-top:none;}

.port-list{display:flex;flex-direction:column;gap:3px;}
.port-row{
  display:flex;align-items:center;gap:8px;padding:5px 8px;background:var(--bg-input);border-radius:3px;border:1px solid var(--border-soft);
  cursor:default;
}
.port-row .pn{width:16px;text-align:center;font-family:var(--font-mono);color:var(--text-faint);font-size:10.5px;flex-shrink:0;}

/* ===== MODAL ===== */
.modal-overlay{

}

.modal-body{padding:14px 15px;}

.type-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;}
.type-opt{
  display:flex;flex-direction:column;align-items:center;gap:5px;padding:11px 4px;border:1px solid var(--border);

/* toast */
.ctxmenu{
  position:fixed;z-index:3600;min-width:200px;max-width:280px;background:var(--bg-panel-alt);
  border:1px solid var(--border);border-radius:6px;padding:5px;display:none;

.ctxmenu.show{display:block;}
.ctxmenu-item svg{width:14px;height:14px;flex-shrink:0;opacity:.85;}

.ctxmenu-item:hover{background:#1e2530;}
.ctxmenu-item.danger{color:var(--red);}

.ctxmenu-item kbd{margin-left:auto;font-size:9px;color:var(--text-faint);font-family:var(--font-mono);}

#toast{
  position:fixed;bottom:16px;left:50%;transform:translateX(-50%) translateY(20px);z-index:3400;

}

.add-menu{position:absolute;top:38px;right:12px;z-index:1500;background:var(--bg-panel-alt);border:1px solid var(--border);border-radius:6px;box-shadow:0 12px 30px rgba(0,0,0,.5);display:none;padding:6px;min-width:170px;}

.add-menu-item svg{width:15px;height:15px;flex-shrink:0;opacity:.8;}
/* ---- fase 1B: estado da carga e avisos de "não salvo" ---- */

</style>
</head>
<body>
<div id="app">

<script>
(function(){
"use strict";

/* ============================================================
   ICONS (SVG paths por tipo de elemento)
   ============================================================ */
const ICON_PATHS = {
  pop:      '<rect x="3" y="3" width="18" height="18" rx="1.5"/><rect x="6.5" y="6.5" width="4" height="4"/><rect x="13.5" y="6.5" width="4" height="4"/><rect x="6.5" y="13.5" width="4" height="4"/><rect x="13.5" y="13.5" width="4" height="4"/>',
  olt:      '<rect x="2" y="7" width="20" height="10" rx="1.5"/><circle cx="6.3" cy="12" r="1.3"/><circle cx="10.4" cy="12" r="1.3"/><circle cx="14.5" cy="12" r="1.3"/><circle cx="18.6" cy="12" r="1.3"/>',
  switch:   '<rect x="2" y="9" width="20" height="8" rx="1.5"/><line x1="5.5" y1="9" x2="5.5" y2="4"/><line x1="10" y1="9" x2="10" y2="4"/><line x1="14.5" y1="9" x2="14.5" y2="4"/><line x1="19" y1="9" x2="19" y2="4"/>',
  tower:    '<line x1="12" y1="1.5" x2="12" y2="22.5"/><line x1="6" y1="22.5" x2="12" y2="3.5"/><line x1="18" y1="22.5" x2="12" y2="3.5"/><line x1="8.3" y1="14.5" x2="15.7" y2="14.5"/><line x1="9.4" y1="9" x2="14.6" y2="9"/>',
  radio:    '<circle cx="12" cy="17" r="1.8"/><line x1="12" y1="15.2" x2="12" y2="7"/><path d="M8 10.3a5.6 5.6 0 0 1 8 0"/><path d="M5 6.6a10 10 0 0 1 14 0"/>',
  cto:      '<rect x="3.5" y="6" width="17" height="13" rx="1.5"/><line x1="3.5" y1="11" x2="20.5" y2="11"/><line x1="8" y1="11" x2="8" y2="19"/><line x1="12" y1="11" x2="12" y2="19"/><line x1="16" y1="11" x2="16" y2="19"/>',
  splitter: '<path d="M3 12h5.5L15 5.5"/><path d="M8.5 12L15 18.5"/><path d="M15 5.5h6"/><path d="M15 18.5h6"/>',
  client:   '<path d="M12 3 L21 10.5 V21 H3 V10.5 Z"/><rect x="9.7" y="13.5" width="4.6" height="7.5"/>',
  ceo:      '<rect x="2.5" y="8.5" width="19" height="7" rx="3.5"/><circle cx="7" cy="12" r="1.15"/><circle cx="12" cy="12" r="1.15"/><circle cx="17" cy="12" r="1.15"/>',
  router:   '<circle cx="12" cy="12" r="8.5"/><path d="M8 9h8M13.5 6.5L16 9l-2.5 2.5M16 15H8M10.5 12.5L8 15l2.5 2.5"/>',
  server:   '<rect x="4" y="3.5" width="16" height="7" rx="1.2"/><rect x="4" y="13.5" width="16" height="7" rx="1.2"/><circle cx="8" cy="7" r="1"/><circle cx="8" cy="17" r="1"/>',
  other:    '<rect x="4" y="6" width="16" height="12" rx="1.5"/><line x1="8" y1="12" x2="16" y2="12"/>'
};
const TYPE_LABEL = {pop:'POP',olt:'OLT',switch:'Switch',router:'Roteador',server:'Servidor',other:'Outro',tower:'Torre',radio:'Rádio/AP',cto:'CTO',splitter:'Splitter',client:'Cliente',ceo:'CEO'};
const TYPE_ORDER = ['pop','tower','olt','switch','router','radio','server','other','ceo','cto','splitter','client'];
/* Categorias (mesmas regras do servidor):
   contêiner (site) — pop, tower: ícone no mapa, coordenada própria; tower pode ficar dentro de um pop.
   equipamento — fica dentro de um contêiner, sem coordenada própria (usa a do site) e sem ícone próprio no mapa.
                 É onde as portas da fase 1G vão se pendurar (tipo rj45/sfp/pon/fibra, externa/interna).
   campo — ceo, cto: coordenada própria, sem pai. */
const CONTAINER_TYPES = ['pop','tower'];
const EQUIPMENT_TYPES = ['olt','switch','router','radio','server','other'];
const FIELD_TYPES = ['ceo','cto'];
const isContainer = n => !!n && CONTAINER_TYPES.includes(n.type);
const isEquipment = n => !!n && EQUIPMENT_TYPES.includes(n.type);
/* Nó que representa x no mapa: o próprio site para equipamentos. */
function siteOf(x){ return x && x.siteId ? (nodeById(x.siteId) || x) : x; }
function equipmentOf(site){ return nodes.filter(x=>x.siteId===site.id); }
/* Ligação interna: as duas pontas no mesmo site (equipamento↔equipamento ou site↔equipamento dele). */
function isInternalLink(l){
  const a = siteOf(nodeById(l.from)), b = siteOf(nodeById(l.to));
  return !!a && !!b && a.id===b.id;
}
const STATUS_COLOR = {normal:'#3fb950',alerta:'#d29922',critico:'#f85149',offline:'#6e7681',livre:'#3a4353'};
const STATUS_LABEL = {normal:'Online / Normal',alerta:'Atenção',critico:'Crítico',offline:'Offline',livre:'Livre'};
const ICON_SIZE = {pop:30,tower:30,olt:26,switch:24,router:24,radio:22,server:24,other:22,ceo:22,cto:20,splitter:16,client:17};
const FIBER_COLOR_HEX = {'Azul':'#3b82f6','Laranja':'#f97316','Verde':'#22c55e','Marrom':'#92400e','Cinza':'#9ca3af','Violeta':'#a855f7','Branco':'#f1f5f9','Vermelho':'#ef4444','Preto':'#111827','Amarelo':'#eab308','Rosa':'#ec4899','Aqua':'#06b6d4'};
// Sequência de cores padrão ABNT (usada no Brasil). A fibra 6 = Violeta bate com o
// exemplo que você descreveu, o que indica que sua rede segue esta sequência.
const FIBER_COLOR_ORDER = ['Verde','Amarelo','Branco','Azul','Vermelho','Violeta','Marrom','Rosa','Preto','Cinza','Laranja','Aqua'];
const FIBERS_PER_TUBE = 12;
function tubeOf(numero){ return Math.floor((numero-1)/FIBERS_PER_TUBE)+1; }
function tubeColor(numero){ return FIBER_COLOR_ORDER[(tubeOf(numero)-1)%FIBER_COLOR_ORDER.length]; }
function isCoarsePointer(){ return window.matchMedia && window.matchMedia('(pointer: coarse)').matches; }

const LINK_TYPE_LABEL = {backbone:'Backbone (fibra)',distribuicao:'Distribuição (fibra)',drop:'Drop (fibra)',ethernet:'Ethernet',wireless:'Enlace rádio'};
const LINK_TYPE_STYLE = {
  backbone:    {weight:4.5, dash:null,  color:'#5aa9ff'},
  distribuicao:{weight:2.6, dash:null,  color:'#4fd1c5'},
  drop:        {weight:1.6, dash:null,  color:'#7c8798'},
  ethernet:    {weight:2,   dash:'2,4', color:'#8a92a3'},
  wireless:    {weight:2,   dash:'6,5', color:'#c58cf2'}
};

function nodeIconSVG(type, color, size){
  return `<g transform="translate(${-size/2},${-size/2}) scale(${size/24})" fill="none" stroke="${color}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke">${ICON_PATHS[type]}</g>`;
}

/* ============================================================
   GERAÇÃO DE DADOS MOCK (nodes / ports / links)
   Estrutura estável: cada nó tem id único; portas referenciam nodeId;
   links referenciam nodeId + portId (nunca por nome).
   ============================================================ */
let nodes = [], ports = [], links = [];
let cables = [], fiberStrands = [], splitters = [], connections = [], measurements = [];
let _nid=1,_pid=1,_lid=1,_cid=1,_fid=1,_spid=1,_cnid=1,_mid=1;
const nid=()=> 'n'+(_nid++);
const pid=()=> 'p'+(_pid++);
const lid=()=> 'l'+(_lid++);
const cid=()=> 'cb'+(_cid++);
const fid=()=> 'fs'+(_fid++);
const spid=()=> 'sp'+(_spid++);
const cnid=()=> 'cn'+(_cnid++);
const mid=()=> 'ms'+(_mid++);

function addNode(type,name,lat,lng,status,extra){
  const n = Object.assign({id:nid(),type,name,lat,lng,status:status||'normal',parent:null,parentLink:null},extra||{});
  nodes.push(n);
  return n;
}
function addPort(nodeId,label,status,extra){
  const p = Object.assign({id:pid(),nodeId,label,status:status||'livre'},extra||{});
  ports.push(p);
  return p;
}

function addLink(type,fromNode,toNode,status,extra){
  extra = Object.assign({}, extra||{});
  const cableMeta = extra.cableMeta; delete extra.cableMeta;
  const l = Object.assign({id:lid(),type,from:fromNode.id,to:toNode.id,status:status||'normal'},extra);
  links.push(l);
  toNode.parent = fromNode.id;
  toNode.parentLink = l.id;
  if(cableMeta) addCable(l, cableMeta.nome, cableMeta.tipo, cableMeta.totalFibras, cableMeta.coresOcupadas);
  return l;
}

/* ---- infraestrutura óptica: CABLE / FIBER_STRAND / SPLITTER / CONNECTION / MEASUREMENT ---- */
function addCable(linkOrNull, nome, tipo, totalFibras, overrides){
  const codigo = 'CB-'+String(cables.length+1).padStart(3,'0');
  const c = {id:cid(), codigo, linkId: linkOrNull?linkOrNull.id:null, nome, tipo, totalFibras, localAtNode:null};
  cables.push(c);
  for(let i=1;i<=totalFibras;i++){
    // A cor se repete a cada tubo: a fibra 13 volta a ser Verde, no tubo 2.
    const corPadrao = FIBER_COLOR_ORDER[(i-1)%FIBERS_PER_TUBE%FIBER_COLOR_ORDER.length];
    const ov = (overrides||[]).find(o=>o.numero===i);
    fiberStrands.push({
      id:fid(), cableId:c.id, numero:i,
      cor: ov&&ov.cor?ov.cor:corPadrao,
      tubo: tubeOf(i), tuboCor: tubeColor(i),
      status: ov?(ov.status||'livre'):'livre'
    });
  }
  return c;
}
function fiberIn(cable, numero){ return fiberStrands.find(f=>f.cableId===cable.id && f.numero===numero); }
function cablesAtNode(nodeId){
  return cables.filter(c=>{
    if(c.localAtNode===nodeId) return true;
    const l = links.find(x=>x.id===c.linkId);
    return l && (l.from===nodeId || l.to===nodeId);
  });
}
// balanceado=false: saidas = percentuais (ex.: [10,90] num tap 10/90)
// balanceado=true:  saidas = quantidade de vias (ex.: 8 num 1x8)
function addSplitter(nodeId, razao, saidas, balanceado){
  const s = {id:spid(), nodeId, razao, balanceado:!!balanceado, ports:[]};
  s.ports.push({id:s.id+'-in', splitterId:s.id, papel:'entrada'});
  const lista = balanceado ? Array.from({length:saidas},(_,i)=>i+1) : saidas;
  lista.forEach((v,idx)=> s.ports.push({
    id:s.id+'-out'+v, splitterId:s.id, papel:'saida',
    percentual: balanceado?null:v, indice: idx+1
  }));
  splitters.push(s);
  return s;
}
function splitterOutLabel(p, s){ return s.balanceado ? ('S'+p.indice) : (p.percentual+'%'); }
function splitterPortById(portId){
  for(const s of splitters){ const p=s.ports.find(pp=>pp.id===portId); if(p) return {port:p, splitter:s}; }
  return null;
}
function addConnection(nodeId, tipo, origem, destino){
  const c = {id:cnid(), nodeId, tipo, origem, destino};
  connections.push(c);
  return c;
}
function addMeasurement(targetType, targetId, kind, valorDbm, extra){
  measurements.push(Object.assign({id:mid(), targetType, targetId, kind, valorDbm}, extra||{}));
  return measurements[measurements.length-1];
}
function measurementsFor(targetId){ return measurements.filter(m=>m.targetId===targetId); }

/* ---- carga dos dados reais (GET /api/mapa) ---- */
function setMapStatus(msg, isError){
  const el = document.getElementById('map-status');
  if(!el) return;
  el.textContent = msg || '';
  el.classList.toggle('show', !!msg);
  el.classList.toggle('error', !!isError);
}
function applyTopology(data){
  const rawNodes = Array.isArray(data.nodes) ? data.nodes : [];
  const rawPorts = Array.isArray(data.ports) ? data.ports : [];
  const rawLinks = Array.isArray(data.links) ? data.links : [];
  const byDb = {};
  rawNodes.forEach(r=>{
    const n = Object.assign({}, r.attrs_json||{}, {
      id:'n'+r.id, dbId:r.id, type:r.node_type, name:r.name, code:r.code, lat:r.lat, lng:r.lng,
      parentDbId:r.parent_node_id, _inherit:(r.lat==null || r.lng==null),
      status:r.status||'normal', lifecycle:r.lifecycle||'ativo', parent:null, parentLink:null, notes:r.notes, desc:r.notes||'',
      _attrs:Object.assign({}, r.attrs_json||{})
    });
    if(n.type==='olt') n.pons = [];
    if(n.type==='switch'){ n.ports24 = n.ports24||24; n.used = n.used||0; }
    nodes.push(n); byDb[r.id] = n;
  });
  // Sem coordenada própria: posição do contêiner (subindo a cadeia). Sem nenhuma na cadeia, não há onde desenhar.
  nodes.forEach(n=>{
    if(!n._inherit) return;
    let p = byDb[n.parentDbId], guard = 0;
    while(p && p._inherit && guard++ < 20) p = byDb[p.parentDbId];
    if(p && !p._inherit){ n.lat = p.lat; n.lng = p.lng; } else delete byDb[n.dbId];
  });
  nodes = nodes.filter(n=> byDb[n.dbId]===n);
  nodes.forEach(n=>{ if(isEquipment(n) && byDb[n.parentDbId]) n.siteId = byDb[n.parentDbId].id; });
  rawPorts.forEach(r=>{
    const n = byDb[r.node_id]; if(!n) return;
    const a = r.attrs_json||{};
    if(r.port_role==='pon' && n.type==='olt'){
      n.pons.push({ponId:r.label||('PON '+r.port_num), onus:a.onus||0, power:a.power==null?null:a.power, status:r.status||'livre'});
      return;
    }
    ports.push(Object.assign({}, a, {id:'p'+r.id, dbId:r.id, nodeId:n.id, label:r.label||('Porta '+r.port_num),
      status:r.status||'livre', role:r.port_role, num:r.port_num}));
  });
  rawLinks.forEach(r=>{
    const a = byDb[r.from_node_id], b = byDb[r.to_node_id]; if(!a || !b) return;
    const at = r.attrs_json||{};
    const extra = Object.assign({}, at, {dbId:r.id, lifecycle:r.lifecycle||'ativo', label:r.label, medium:r.medium, lengthM:r.length_m, fiberCount:r.fiber_count, path:r.path_json,
      _attrs:Object.assign({}, at)});
    if(r.length_m!=null) extra.km = +(r.length_m/1000).toFixed(3);
    if(r.fiber_count) extra.cableMeta = {nome:at.cabo_nome||('CABO '+r.id), tipo:at.cabo_tipo||(r.fiber_count+'FO'), totalFibras:r.fiber_count, construtivo:at.cabo_construtivo};
    const l = addLink(r.link_type, a, b, r.status||'normal', extra);
    const cbl = cables.find(x=>x.linkId===l.id);
    if(cbl){ cbl.construtivo = at.cabo_construtivo; if(extra.km!==undefined) cbl.km = extra.km; }
    if(r.link_type==='backbone'){ b.parent = null; b.parentLink = null; }   // backbone não define hierarquia
  });
  // contadores em memória não podem colidir com os ids vindos do banco
  _nid = Math.max(_nid, ...rawNodes.map(r=>r.id+1)); _pid = Math.max(_pid, ...rawPorts.map(r=>r.id+1)); _lid = Math.max(_lid, ...rawLinks.map(r=>r.id+1));
  setMapStatus(nodes.length ? '' : 'Nenhum elemento cadastrado');
  fitToNetwork();
}
function resetTopology(){
  nodes = []; ports = []; links = []; cables = []; fiberStrands = []; splitters = []; connections = []; measurements = [];
  selectedNodeId = null; selectedLinkId = null; pathHighlight = null;
}
/* Recarrega a topologia do servidor (fonte da verdade). onDone(): chamado após aplicar com sucesso. */
function loadNetwork(onDone){
  const cfg = window.ISP_MAP || {};
  const sessionMsg = 'Sessão expirada — faça login novamente';
  if(!nodes.length) setMapStatus('Carregando…');
  fetch(cfg.api || '/api/mapa', {credentials:'same-origin', headers:{'Accept':'application/json'}})
    .then(resp=>{
      const ct = resp.headers.get('content-type') || '';
      if(resp.redirected || !ct.includes('application/json')) throw new Error('session');
      return resp.json().then(body=>({status:resp.status, body}));
    })
    .then(({status, body})=>{
      if(status===403) throw new Error('forbidden');
      if(!body || body.ok!==true || !body.data) throw new Error('api');
      resetTopology();
      closePanel();
      applyTopology(body.data);
      if(typeof onDone==='function') onDone();
    })
    .catch(err=>{
      const m = err && err.message;
      setMapStatus(m==='session' ? sessionMsg : (m==='forbidden' ? 'Acesso negado ao mapa.' : 'Não foi possível carregar o mapa.'), true);
    });
}
/* Grava um nó: POST FormData + X-CSRF-Token. Resolve com data; rejeita com Error(mensagem do servidor). */
function mapPost(path, fields){
  const cfg = window.ISP_MAP || {};
  const fd = new FormData();
  Object.keys(fields).forEach(k=>{ if(fields[k]!==null && fields[k]!==undefined) fd.append(k, fields[k]); });
  return fetch((cfg.api || '/api/mapa') + path, {method:'POST', body:fd, credentials:'same-origin',
      headers:{'Accept':'application/json', 'X-CSRF-Token': cfg.csrf || ''}})
    .then(resp=>{
      const ct = resp.headers.get('content-type') || '';
      if(resp.redirected || !ct.includes('application/json')) throw new Error('Sessão expirada — faça login novamente');
      return resp.json().then(body=>{
        if(!resp.ok || !body || body.ok!==true) throw new Error((body && body.message) || 'Não foi possível gravar.');
        return body.data;
      });
    });
}
function nodeAttrsJson(n, overrides){
  return JSON.stringify(Object.assign({}, n && n._attrs || {}, overrides||{}));
}
loadNetwork();

/* ============================================================
   MAPA — renderizador SVG próprio (sem biblioteca externa)
   Projeção equiretangular simples. lat/lng continuam sendo a verdade dos dados;
   a projeção é só a forma de desenhar. Trocar por tiles reais depois é direto.
   ============================================================ */
const mapEl = document.getElementById('map');

/* --- Projeção Web Mercator (mesma dos tiles de OSM/Google/Esri) ---
   Mundo normalizado em [0,1]. view.scale = pixels por unidade de mundo,
   equivalente a 256 * 2^zoom. Isso permite casar os tiles pixel a pixel. */
function lngToWorldX(lng){ return (lng+180)/360; }
function latToWorldY(lat){
  const s = Math.sin(lat*Math.PI/180);
  return 0.5 - Math.log((1+s)/(1-s))/(4*Math.PI);
}
function worldXToLng(x){ return x*360-180; }
function worldYToLat(y){ return Math.atan(Math.sinh(Math.PI*(1-2*y)))*180/Math.PI; }

const MIN_SCALE = 256*Math.pow(2,3), MAX_SCALE = 256*Math.pow(2,20);
let view = {cx:0.5, cy:0.5, scale:256*Math.pow(2,13)};
let mapW = 900, mapH = 700;

function toScreen(lat,lng){
  return { x:(lngToWorldX(lng)-view.cx)*view.scale + mapW/2,
           y:(latToWorldY(lat)-view.cy)*view.scale + mapH/2 };
}
function toLatLng(sx,sy){
  const wx=(sx-mapW/2)/view.scale+view.cx, wy=(sy-mapH/2)/view.scale+view.cy;
  return { lat:worldYToLat(wy), lng:worldXToLng(wx) };
}
function measureMap(){
  const r = mapEl.getBoundingClientRect();
  if(r.width>0)  mapW = r.width;
  if(r.height>0) mapH = r.height;
}
function currentZoom(){ return Math.log(view.scale/256)/Math.LN2; }

/* --- Mapas base disponíveis ---
   Trocar de provedor é só acrescentar uma entrada aqui. O Google exige
   chave de API e contrato próprio, por isso fica registrado mas desativado. */
const BASEMAPS = {
  none:   {label:'Grade técnica (sem mapa)', url:null, attrib:'Protótipo — dados fictícios', dark:true},
  osm:    {label:'OpenStreetMap (ruas)',
           url:(z,x,y)=>`https://tile.openstreetmap.org/${z}/${x}/${y}.png`,
           attrib:'© OpenStreetMap contributors', maxNativeZoom:19, dim:0.72},
  dark:   {label:'Mapa escuro (OSM, filtro)',
           url:(z,x,y)=>`https://tile.openstreetmap.org/${z}/${x}/${y}.png`,
           attrib:'© OpenStreetMap contributors', maxNativeZoom:19, dim:1, dark:true,
           filter:'invert(1) hue-rotate(180deg) brightness(.9) contrast(.9)'},   // Carto passou a exigir chave de API
  sat:    {label:'Satélite (Esri)',
           url:(z,x,y)=>`https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${z}/${y}/${x}`,
           attrib:'© Esri, Maxar, Earthstar Geographics', maxNativeZoom:17, dim:0.85}
};
/* maxNativeZoom = último zoom em que a camada tem imagem real. Acima dele o mesmo tile do zoom máximo é ampliado
   (overzoom), em vez de pedir tiles que não existem. Esri: z18 é "Map data not yet available" em áreas rurais do
   Brasil (testado em MG, GO, MT, BA e AM; só cidades grandes têm z18); z17 existe em todos os pontos testados. OSM: z19; z20 dá HTTP 400. */
let basemap = 'osm';
let tileErrors = 0, tileTried = 0;

function renderTiles(parts){
  const bm = BASEMAPS[basemap];
  if(!bm || !bm.url) return;
  let z = Math.round(currentZoom());
  z = Math.max(0, Math.min(bm.maxNativeZoom||19, z));   // acima do zoom nativo: overzoom (tile ampliado)
  const n = Math.pow(2,z);
  const tileScreen = view.scale/n;                       // tamanho do tile na tela
  const x0 = Math.floor((view.cx - (mapW/2)/view.scale)*n);
  const x1 = Math.floor((view.cx + (mapW/2)/view.scale)*n);
  const y0 = Math.floor((view.cy - (mapH/2)/view.scale)*n);
  const y1 = Math.floor((view.cy + (mapH/2)/view.scale)*n);
  if((x1-x0+1)*(y1-y0+1) > 400) return;                  // proteção contra excesso
  parts.push(`<g opacity="${bm.dim||1}"${bm.filter?` style="filter:${bm.filter}"`:''}>`);
  for(let ty=y0; ty<=y1; ty++){
    if(ty<0||ty>=n) continue;
    for(let tx=x0; tx<=x1; tx++){
      const wx = ((tx%n)+n)%n;
      const sx = (tx/n - view.cx)*view.scale + mapW/2;
      const sy = (ty/n - view.cy)*view.scale + mapH/2;
      tileTried++;
      parts.push(`<image class="mtile" href="${bm.url(z,wx,ty)}" x="${sx}" y="${sy}" width="${tileScreen+1}" height="${tileScreen+1}" preserveAspectRatio="none" onerror="window.__tileFail&&window.__tileFail()"/>`);
    }
  }
  parts.push('</g>');
}

function setBasemap(key){
  basemap = key;
  tileErrors = 0; tileTried = 0;
  const bm = BASEMAPS[key];
  mapEl.classList.toggle('has-tiles', !!bm.url);
  const at = document.querySelector('.map-attrib');
  if(at) at.textContent = bm.url ? bm.attrib : 'Protótipo — dados fictícios';
  renderAll();
}

let searchPin = null;   // marcador temporário da busca por coordenada {lat,lng}
let selectedNodeId = null;
let selectedLinkId = null;
let linkPoint = null;   // {linkId, lat, lng} — marcador deixado por um clique esquerdo na fibra
let pathHighlight = null;
let activeTypeFilters = new Set(TYPE_ORDER);
let activeLinkFilters = new Set(Object.keys(LINK_TYPE_LABEL));
let activeLifecycleFilters = new Set(['projeto','ativo','desativado']);
let alertsOnly = false;
const LIFECYCLE_LABEL = {projeto:'Projeto', ativo:'Ativo', desativado:'Desativado'};
const lifecycleOf = x => (x && x.lifecycle) || 'ativo';

/* ---- estado de edição/criação ---- */
let mode = 'idle';     // idle | placing | linking-dest
let placingType = null;
let linkOrigin = null;

function nodeById(id){ return nodes.find(n=>n.id===id); }
function linkById(id){ return links.find(l=>l.id===id); }
function portsOf(nodeId){ return ports.filter(p=>p.nodeId===nodeId); }
function linksOfNode(nodeId){ return links.filter(l=>l.from===nodeId || l.to===nodeId); }

function nodeVisible(n){
  if(!activeLifecycleFilters.has(lifecycleOf(n))) return false;
  if(!activeTypeFilters.has(n.type)) return false;
  if(alertsOnly && !(n.status==='alerta'||n.status==='critico'||n.status==='offline')) return false;
  return true;
}
function linkVisible(l){
  if(!activeLifecycleFilters.has(lifecycleOf(l))) return false;
  if(!activeLinkFilters.has(l.type)) return false;
  const a=nodeById(l.from), b=nodeById(l.to);
  if(!a||!b) return false;
  if(!activeTypeFilters.has(a.type) || !activeTypeFilters.has(b.type)) return false;
  if(alertsOnly && !(l.status==='alerta'||l.status==='critico'||l.status==='offline')) return false;
  return true;
}

function fitToNetwork(){
  measureMap();
  let pts = nodes.filter(n=> n.type!=='client' && nodeVisible(n));
  if(!pts.length) pts = nodes.filter(nodeVisible);
  if(!pts.length) return;
  const xs = pts.map(n=>lngToWorldX(n.lng)), ys = pts.map(n=>latToWorldY(n.lat));
  const minX=Math.min.apply(null,xs), maxX=Math.max.apply(null,xs);
  const minY=Math.min.apply(null,ys), maxY=Math.max.apply(null,ys);
  view.cx=(minX+maxX)/2; view.cy=(minY+maxY)/2;
  const pad=70;
  const sx=(mapW-pad*2)/Math.max(1e-9,maxX-minX);
  const sy=(mapH-pad*2)/Math.max(1e-9,maxY-minY);
  let s=Math.min(sx,sy);
  if(!isFinite(s)||s<=0) s=256*Math.pow(2,13);
  view.scale=Math.max(MIN_SCALE, Math.min(MAX_SCALE, s));
  renderAll();
}
function zoomBy(factor, ax, ay){
  measureMap();
  if(ax===undefined) ax=mapW/2;
  if(ay===undefined) ay=mapH/2;
  const before = toLatLng(ax,ay);
  view.scale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, view.scale*factor));
  const after = toLatLng(ax,ay);
  view.cx += lngToWorldX(before.lng)-lngToWorldX(after.lng);
  view.cy += latToWorldY(before.lat)-latToWorldY(after.lat);
  renderAll();
}

/* ---- render ---- */
function renderAll(){
  measureMap();
  nodes.forEach(n=>{ if(n._inherit && n.siteId){ const st = nodeById(n.siteId); if(st){ n.lat = st.lat; n.lng = st.lng; } } });
  const parts = [];
  parts.push(`<svg id="map-svg" width="${mapW}" height="${mapH}" viewBox="0 0 ${mapW} ${mapH}">`);
  renderTiles(parts);

  // links (abaixo dos nós)
  links.forEach(l=>{
    if(!linkVisible(l)) return;
    if(isInternalLink(l)) return;                 // interna ao site: só aparece no painel do site
    const a=nodeById(l.from), b=nodeById(l.to);   // equipamento já está na posição do site
    const st = LINK_TYPE_STYLE[l.type];
    let color=st.color, opacity=.85, weight=st.weight;
    if(l.status==='offline') color=STATUS_COLOR.offline;
    if(l.status==='critico') color=STATUS_COLOR.critico;
    const lcl = lifecycleOf(l);
    if(pathHighlight){
      if(pathHighlight.linkIds.has(l.id)){ opacity=1; weight=st.weight+1.5; color='#4fd1c5'; }
      else opacity=.08;
    } else if(selectedLinkId){
      if(l.id===selectedLinkId){ opacity=1; weight=st.weight+1.5; color='#4fd1c5'; }
      else opacity=.12;
    }
    const p1=toScreen(a.lat,a.lng), p2=toScreen(b.lat,b.lng);
    if(lcl==='projeto') opacity *= .6; else if(lcl==='desativado') opacity *= .45;
    const dash = lcl==='projeto' ? 'stroke-dasharray="3,4"' : (st.dash ? `stroke-dasharray="${st.dash}"` : '');
    parts.push(`<line class="mlink-hit" data-link="${l.id}" x1="${p1.x}" y1="${p1.y}" x2="${p2.x}" y2="${p2.y}"/>`);
    parts.push(`<line class="mlink" data-link="${l.id}" x1="${p1.x}" y1="${p1.y}" x2="${p2.x}" y2="${p2.y}" stroke="${color}" stroke-width="${weight}" opacity="${opacity}" ${dash}/>`);
  });

  // nós
  nodes.forEach(n=>{
    if(!nodeVisible(n)) return;
    if(isEquipment(n)) return;                    // equipamento é desenhado pelo site (selo com a contagem)
    const p = toScreen(n.lat,n.lng);
    if(p.x<-120||p.x>mapW+120||p.y<-120||p.y>mapH+120) return;   // fora da tela: não desenha
    const dim = pathHighlight && !pathHighlight.nodeIds.has(n.id);
    const size = ICON_SIZE[n.type]||18;
    const r = size/2+5;
    const color = STATUS_COLOR[n.status]||'#8a92a3';
    const lc = lifecycleOf(n);
    const op = dim ? .18 : (lc==='projeto' ? .6 : (lc==='desativado' ? .45 : 1));
    parts.push(`<g class="mnode" data-node="${n.id}" transform="translate(${p.x},${p.y})" opacity="${op}">`);
    parts.push(`<circle class="mnode-hit" r="${r+8}"/>`);
    if(n.id===selectedNodeId) parts.push(`<circle r="${r+4}" fill="none" stroke="#4fd1c5" stroke-width="2.5" opacity=".75"/>`);
    parts.push(`<circle r="${r}" fill="#11151c" stroke="${color}" stroke-width="2"${lc==='projeto'?' stroke-dasharray="4,3"':''}/>`);
    parts.push(nodeIconSVG(n.type, color, size*0.62));
    if(isContainer(n)){
      const qtd = equipmentOf(n).length;
      if(qtd) parts.push(`<g class="msite-badge" transform="translate(${r-1},${-r+1})"><circle r="7.5" fill="#4fd1c5" stroke="#0a0d12" stroke-width="1.5"/><text text-anchor="middle" y="3.2" font-size="9" font-weight="700" fill="#04211f">${qtd}</text></g>`);
    }
    parts.push(`</g>`);
    if(['pop','olt','switch','tower','cto','ceo'].includes(n.type)){
      parts.push(`<text class="mlabel${dim?' dim':''}" x="${p.x+r+6}" y="${p.y+4}">${escapeHtml(n.name)}</text>`);
    }
  });

  // marcador temporário da busca por coordenada
  if(searchPin){
    const q = toScreen(searchPin.lat, searchPin.lng);
    parts.push(`<g class="search-pin" transform="translate(${q.x},${q.y})" pointer-events="none">
      <circle r="11" fill="none" stroke="#4fd1c5" stroke-width="2.5"/><circle r="3" fill="#4fd1c5"/>
      <line x1="-17" y1="0" x2="-7" y2="0" stroke="#4fd1c5" stroke-width="2"/><line x1="7" y1="0" x2="17" y2="0" stroke="#4fd1c5" stroke-width="2"/>
      <line x1="0" y1="-17" x2="0" y2="-7" stroke="#4fd1c5" stroke-width="2"/><line x1="0" y1="7" x2="0" y2="17" stroke="#4fd1c5" stroke-width="2"/></g>`);
  }

  // conectores visuais do nó selecionado (arrastar para criar link)
  if(mode==='idle' && selectedNodeId){
    const n = nodeById(selectedNodeId);
    if(n && nodeVisible(n)){
      const p = toScreen(n.lat,n.lng);
      [[0,-32],[32,0],[0,32],[-32,0]].forEach(o=>{
        parts.push(`<circle class="mhandle" data-handle="${n.id}" cx="${p.x+o[0]}" cy="${p.y+o[1]}" r="6"><title>Arraste até outro elemento para conectar</title></circle>`);
      });
    }
  }
  if(linkPoint){
    const lpL = linkById(linkPoint.linkId);
    if(lpL && linkVisible(lpL)){
      const pm = toScreen(linkPoint.lat, linkPoint.lng);
      parts.push(`<circle class="mlinkpoint" cx="${pm.x}" cy="${pm.y}" r="6" fill="#4fd1c5" stroke="#0b0e13" stroke-width="2"/>`);
    }
  }
  parts.push(`<g id="overlay-temp"></g>`);
  parts.push('</svg>');
  mapEl.innerHTML = parts.join('');
  updateKPIs();
  renderSidebar();
}

/* ---- interação (pointer events: funciona com mouse e toque) ---- */
let ptr = null;
function localPt(e){
  const r = mapEl.getBoundingClientRect();
  return {x:e.clientX-r.left, y:e.clientY-r.top};
}
function snapTargetAt(x,y,excludeId){
  let best=null, bestD=34;
  nodes.forEach(n=>{
    if(n.id===excludeId || !nodeVisible(n) || isEquipment(n)) return;
    const p=toScreen(n.lat,n.lng);
    const d=Math.hypot(p.x-x,p.y-y);
    if(d<bestD){ bestD=d; best=n.id; }
  });
  return best;
}
function drawTemp(html){
  const g = document.getElementById('overlay-temp');
  if(g) g.innerHTML = html;
}

mapEl.addEventListener('pointerdown', (e)=>{
  if(e.button===2 || e.button===1) return;   // direito/meio: não inicia pan, arraste nem seleção
  const t = e.target;
  const handle = t.closest ? t.closest('.mhandle') : null;
  const nodeG  = t.closest ? t.closest('.mnode') : null;
  const linkEl = t.closest ? t.closest('.mlink-hit, .mlink') : null;
  const p = localPt(e);
  if(handle){
    ptr = {kind:'connect', originId:handle.getAttribute('data-handle'), x0:p.x, y0:p.y, moved:false, snap:null};
  } else if(nodeG){
    ptr = {kind:'node', id:nodeG.getAttribute('data-node'), x0:p.x, y0:p.y, moved:false};
  } else if(linkEl){
    ptr = {kind:'link', id:linkEl.getAttribute('data-link'), x0:p.x, y0:p.y, moved:false, ll:toLatLng(p.x,p.y)};
  } else {
    ptr = {kind:'pan', x0:p.x, y0:p.y, cx0:view.cx, cy0:view.cy, moved:false};
  }
  try{ mapEl.setPointerCapture(e.pointerId); }catch(err){}
});

mapEl.addEventListener('pointermove', (e)=>{
  if(!ptr) return;
  const p = localPt(e);
  const dist = Math.hypot(p.x-ptr.x0, p.y-ptr.y0);
  if(dist>4) ptr.moved = true;
  if(ptr.kind==='pan' && ptr.moved){
    mapEl.classList.add('panning');
    view.cx = ptr.cx0 - (p.x-ptr.x0)/view.scale;
    view.cy = ptr.cy0 - (p.y-ptr.y0)/view.scale;
    renderAll();
  } else if(ptr.kind==='node' && ptr.moved && ptr.id===selectedNodeId){
    const ll = toLatLng(p.x,p.y);
    const n = nodeById(ptr.id);
    n.lat = ll.lat; n.lng = ll.lng;
    renderAll();
  } else if(ptr.kind==='connect'){
    const origin = nodeById(ptr.originId);
    const o = toScreen(origin.lat, origin.lng);
    ptr.snap = snapTargetAt(p.x, p.y, ptr.originId);
    let html = `<line class="mtemp" x1="${o.x}" y1="${o.y}" x2="${p.x}" y2="${p.y}"/>`;
    if(ptr.snap){
      const sn = nodeById(ptr.snap), sp = toScreen(sn.lat,sn.lng);
      const rr = (ICON_SIZE[sn.type]||18)/2+11;
      html += `<circle class="msnap" cx="${sp.x}" cy="${sp.y}" r="${rr}"/>`;
    }
    drawTemp(html);
    connectHint.classList.toggle('show', !!ptr.snap);
  }
});

mapEl.addEventListener('pointerup', (e)=>{
  if(!ptr) return;
  const p = localPt(e);
  const st = ptr; ptr = null;
  mapEl.classList.remove('panning');
  connectHint.classList.remove('show');
  try{ mapEl.releasePointerCapture(e.pointerId); }catch(err){}

  if(st.kind==='connect'){
    drawTemp('');
    if(st.snap) openLinkTypeModal(nodeById(st.originId), nodeById(st.snap));
    else renderAll();
    return;
  }
  if(st.moved){
    if(st.kind==='node'){
      const mv = nodeById(st.id);
      if(mv && mv.dbId){
        mapPost('/nos/editar', {id:mv.dbId, lat:mv.lat, lng:mv.lng})
          .then(()=>{ toast('Posição salva.'); })
          .catch(err=>{ toast(err.message); loadNetwork(); });   // recarrega para desfazer o arrasto
      }
    }
    return;
  }

  // clique simples
  clearSearchPin(true);
  if(mode==='placing'){
    openCreateModal(placingType, toLatLng(p.x,p.y));
    return;
  }
  if(st.kind==='node'){ onNodeClick(st.id); return; }
  if(mode==='linking-dest') return;
  if(st.kind==='link'){ onLinkPointClick(st.id, st.ll); return; }
  if(selectedNodeId||selectedLinkId||pathHighlight) closePanel();
});

mapEl.addEventListener('pointercancel', ()=>{ ptr=null; drawTemp(''); mapEl.classList.remove('panning'); });
mapEl.addEventListener('wheel', (e)=>{
  e.preventDefault();
  const p = localPt(e);
  zoomBy(e.deltaY<0 ? 1.18 : 1/1.18, p.x, p.y);
}, {passive:false});

function centerOn(n, targetScale){
  view.cx = lngToWorldX(n.lng); view.cy = latToWorldY(n.lat);
  if(targetScale) view.scale = targetScale;
  renderAll();
}

/* ============================================================
   KPIs / TOPBAR
   ============================================================ */
function updateKPIs(){
  // KPIs e alertas contam só o que está em operação (situação "ativo"); projeto e desativado ficam de fora
  const ativos = nodes.filter(n=>lifecycleOf(n)==='ativo');
  document.getElementById('kpi-pop').textContent = ativos.filter(n=>n.type==='pop').length;
  document.getElementById('kpi-cto').textContent = ativos.filter(n=>n.type==='cto').length;
  document.getElementById('kpi-clients').textContent = ativos.filter(n=>n.type==='client').length;
  document.getElementById('kpi-links').textContent = links.filter(l=>lifecycleOf(l)==='ativo').length;
  const alertCount = ativos.filter(n=> n.status==='alerta'||n.status==='critico'||n.status==='offline').length;
  document.getElementById('kpi-alerts').textContent = alertCount;
  const dot = document.getElementById('net-status-dot');
  dot.style.background = alertCount>0 ? 'var(--yellow)' : 'var(--green)';
  dot.style.boxShadow = alertCount>0 ? '0 0 6px var(--yellow)' : '0 0 6px var(--green)';
}

/* ============================================================
   SIDEBAR ESQUERDA — filtros / camadas
   ============================================================ */
function renderSidebar(){
  const c = document.getElementById('sb-content');
  const typeCounts = {};
  TYPE_ORDER.forEach(t=> typeCounts[t] = nodes.filter(n=>n.type===t).length);

  let html = '<div class="sb-section"><h4>Elementos</h4>';
  TYPE_ORDER.forEach(t=>{
    const checked = activeTypeFilters.has(t) ? 'checked' : '';
    html += `<div class="layer-row" data-type="${t}">
      <input type="checkbox" ${checked} data-filter-type="${t}">
      <div class="swatch" style="background:${STATUS_COLOR.normal}22;border:1.5px solid ${STATUS_COLOR.normal}"></div>
      <label>${TYPE_LABEL[t]}</label>
      <span class="count">${typeCounts[t]}</span>
    </div>`;
  });
  html += '</div>';

  html += '<div class="sb-section"><h4>Enlaces</h4>';
  Object.keys(LINK_TYPE_LABEL).forEach(t=>{
    const checked = activeLinkFilters.has(t) ? 'checked' : '';
    const cnt = links.filter(l=>l.type===t).length;
    html += `<div class="layer-row">
      <input type="checkbox" ${checked} data-filter-link="${t}">
      <div class="swatch" style="background:${LINK_TYPE_STYLE[t].color}"></div>
      <label>${LINK_TYPE_LABEL[t]}</label>
      <span class="count">${cnt}</span>
    </div>`;
  });
  html += '</div>';

  html += '<div class="sb-section"><h4>Situação</h4>';
  Object.keys(LIFECYCLE_LABEL).forEach(k=>{
    const cnt = nodes.filter(n=>lifecycleOf(n)===k).length + links.filter(l=>lifecycleOf(l)===k).length;
    html += `<div class="layer-row">
      <input type="checkbox" ${activeLifecycleFilters.has(k)?'checked':''} data-filter-lifecycle="${k}">
      <label>${LIFECYCLE_LABEL[k]}</label>
      <span class="count">${cnt}</span>
    </div>`;
  });
  html += '</div>';

  html += `<div class="sb-section"><h4>Estado</h4>
    <div class="layer-row"><input type="checkbox" id="chk-alerts-only" ${alertsOnly?'checked':''}>
      <div class="swatch" style="background:${STATUS_COLOR.alerta}"></div>
      <label for="chk-alerts-only">Somente alertas / offline</label>
    </div>
  </div>`;

  c.innerHTML = html;

  c.querySelectorAll('[data-filter-type]').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      const t = cb.getAttribute('data-filter-type');
      if(cb.checked) activeTypeFilters.add(t); else activeTypeFilters.delete(t);
      renderAll();
    });
  });
  c.querySelectorAll('[data-filter-link]').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      const t = cb.getAttribute('data-filter-link');
      if(cb.checked) activeLinkFilters.add(t); else activeLinkFilters.delete(t);
      renderAll();
    });
  });
  c.querySelectorAll('[data-filter-lifecycle]').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      const t = cb.getAttribute('data-filter-lifecycle');
      if(cb.checked) activeLifecycleFilters.add(t); else activeLifecycleFilters.delete(t);
      renderAll();
    });
  });
  const chkAlerts = document.getElementById('chk-alerts-only');
  if(chkAlerts) chkAlerts.addEventListener('change', ()=>{ alertsOnly = chkAlerts.checked; renderAll(); });
}

/* ============================================================
   PAINEL DIREITO — detalhes por tipo
   ============================================================ */
function lifecyclePill(x){
  const lc = lifecycleOf(x);
  return `<span class="status-pill lc-${lc}" style="margin-left:6px;opacity:.85"><span class="d"></span>Situação: ${LIFECYCLE_LABEL[lc]||escapeHtml(lc)}</span>`;
}
function statusPill(status){
  return `<span class="status-pill st-${status}"><span class="d"></span>${STATUS_LABEL[status]||status}</span>`;
}

function onNodeClick(nodeId, opts){
  if(mode==='placing') return; // ignora cliques em nós durante posicionamento
  const target = nodeById(nodeId);
  if(mode==='linking-dest'){
    if(nodeId===linkOrigin.id){ toast('Selecione um nó diferente da origem.'); return; }
    if(!(opts && opts.pick) && isContainer(target) && equipmentOf(target).some(e=>e.id!==linkOrigin.id)){
      openNodePanel(target.id, {picking:true});   // escolher o equipamento de destino (ou o próprio site)
      return;
    }
    openLinkTypeModal(linkOrigin, target);
    return;
  }
  if(isEquipment(target) && target.siteId){
    selectedLinkId = null; selectedNodeId = target.siteId; pathHighlight = null;
    renderAll();
    openNodePanel(target.siteId, {highlight:target.id});
    return;
  }
  selectedLinkId = null;
  selectedNodeId = nodeId;
  pathHighlight = null;
  renderAll();
  openNodePanel(nodeId);
}
function onLinkClick(linkId){
  if(mode!=='idle') return;
  selectedNodeId = null;
  selectedLinkId = linkId;
  pathHighlight = null;
  linkPoint = null;
  renderAll();
  openLinkPanel(linkId);
}

/* Clique esquerdo NUM PONTO da fibra: marca o ponto exato e mostra, no
   painel, a fibra e as distâncias até as duas pontas a partir dali — sem
   abrir modal. "Inserir caixa aqui" usa a mesma coordenada, sem perguntar
   posição. */
function onLinkPointClick(linkId, ll){
  if(mode!=='idle') return;
  const l = linkById(linkId); if(!l) return;
  selectedNodeId = null;
  selectedLinkId = linkId;
  pathHighlight = null;
  linkPoint = {linkId, lat:ll.lat, lng:ll.lng};
  renderAll();
  openLinkPointPanel(l, linkPoint);
}

function openLinkPointPanel(l, pt){
  const a = nodeById(l.from), b = nodeById(l.to);
  const cab = cables.find(x=>x.linkId===l.id);
  const dA = distanciaKm(a, {lat:pt.lat,lng:pt.lng});
  const dB = distanciaKm({lat:pt.lat,lng:pt.lng}, b);
  const panel = document.getElementById('panel-right');
  panel.classList.add('show');
  panel.innerHTML = `
    <div class="panel-head">
      <div class="panel-head-top">
        <div>
          <div class="panel-type-tag">Ponto na fibra</div>
          <div class="panel-title">${escapeHtml(l.label||'Trecho')}</div>
        </div>
        <button class="panel-close" id="panel-close-btn">✕</button>
      </div>
      ${statusPill(l.status)}
    </div>
    <div class="panel-body">
      ${fieldsHtml([
        {label:'Cabo', value: cab ? escapeHtml(cab.nome)+' · '+cab.tipo+' ('+cab.totalFibras+' fibras)' : 'sem cabo documentado', full:true},
        {label:'Até '+escapeHtml(a.name), value: dA.toFixed(3)+' km'},
        {label:'Até '+escapeHtml(b.name), value: dB.toFixed(3)+' km'}
      ])}
      <div class="cable-meta">Distância acumulada até a OLT de origem: ainda não calculada (pendente).</div>
      <div class="action-row">
        <button class="btn" id="btn-sangria-ponto" style="flex:1 1 100%;" disabled title="Disponível em breve">Inserir caixa aqui (sangria) — disponível em breve</button>
        <button class="btn" id="btn-ver-trecho" style="flex:1 1 100%;">Ver detalhes do trecho inteiro</button>
      </div>
    </div>
  `;
  document.getElementById('panel-close-btn').addEventListener('click', closePanel);
  document.getElementById('btn-ver-trecho').addEventListener('click', ()=> onLinkClick(l.id));
}

function closePanel(){
  selectedNodeId=null; selectedLinkId=null; pathHighlight=null; linkPoint=null;
  document.getElementById('panel-right').classList.remove('show');
  document.getElementById('panel-right').innerHTML='';
  renderAll();
}

function openNodePanel(nodeId, opts){
  const n = nodeById(nodeId);
  const panel = document.getElementById('panel-right');
  panel.classList.add('show');

  let body = '';
  if(n.type==='cto') body = renderCTOBody(n);
  else if(n.type==='ceo') body = renderCeoBody(n);
  else if(n.type==='olt') body = renderOLTBody(n);
  else if(n.type==='switch') body = renderSwitchBody(n);
  else if(isContainer(n)) body = renderSiteBody(n, opts||{});
  else if(n.type==='radio') body = renderRadioBody(n);
  else if(n.type==='splitter') body = renderSplitterBody(n);
  else if(n.type==='client') body = renderClientBody(n);

  panel.innerHTML = `
    <div class="panel-head">
      <div class="panel-head-top">
        <div>
          <div class="panel-type-tag">${TYPE_LABEL[n.type]}</div>
          <div class="panel-title">${escapeHtml(n.name)}</div>
        </div>
        <button class="panel-close" id="panel-close-btn">✕</button>
      </div>
      ${statusPill(n.status)}${lifecyclePill(n)}
    </div>
    <div class="panel-body">${body}</div>
  `;
  document.getElementById('panel-close-btn').addEventListener('click', closePanel);
  bindPanelActions(n);
  if(isContainer(n)) bindSitePanel(n, opts||{});
}

function fieldsHtml(fields){
  return '<div class="field-grid">' + fields.map(f=>{
    if(!f) return '';
    return `<div class="field${f.full?' full':''}"><label>${f.label}</label><div class="val${f.big?' big':''}">${f.value}</div></div>`;
  }).join('') + '</div>';
}

function renderOLTBody(n){
  return `
    ${fieldsHtml([
      {label:'IP', value:escapeHtml(n.ip||'—')},
      {label:'PONs ativas', value:n.pons.filter(p=>p.onus>0).length+' / '+n.pons.length}
    ])}
    <div class="section-title">Portas PON</div>
    ${n.pons.map(p=>{
      const pct = Math.min(100, ((Number(p.onus)||0)/32)*100);
      const barColor = p.status==='alerta' ? 'var(--yellow)' : (p.status==='livre' ? 'var(--text-faint)' : 'var(--green)');
      return `<div class="pon-card">
        <div class="pon-card-head"><b>${escapeHtml(p.ponId)}</b>${statusPill(p.status)}</div>
        <div class="field-grid" style="margin-bottom:0;">
          <div class="field"><label>ONUs</label><div class="val">${escapeHtml(p.onus)}</div></div>
          <div class="field"><label>Potência média</label><div class="val">${p.power!==null?escapeHtml(p.power)+' dBm':'—'}</div></div>
        </div>
        <div class="usage-bar"><div style="width:${pct}%;background:${barColor}"></div></div>
      </div>`;
    }).join('')}
    ${actionRow(n)}
  `;
}

function renderSwitchBody(n){
  const children = links.filter(l=>l.from===n.id);
  const pct = Math.round((n.used/n.ports24)*100);
  return `
    ${fieldsHtml([
      {label:'IP', value:escapeHtml(n.ip||'—')},
      {label:'Portas em uso', value:escapeHtml(n.used)+' / '+escapeHtml(n.ports24)}
    ])}
    <div class="usage-bar" style="margin-bottom:14px;"><div style="width:${pct}%;background:var(--accent)"></div></div>
    <div class="section-title">Conectados</div>
    <div class="port-list">
      ${children.map(l=>{
        const dst = nodeById(l.to);
        return `<div class="port-row"><span class="pd" style="background:${STATUS_COLOR[dst.status]}"></span><span class="pl">${escapeHtml(dst.name)}</span><span class="pf">${TYPE_LABEL[dst.type]}</span></div>`;
      }).join('') || '<div class="empty-state">Nenhum elemento conectado.</div>'}
    </div>
    ${actionRow(n)}
  `;
}

/* ---- visão do site (POP/Torre): equipamentos agrupados por tipo, com as ligações de cada um ---- */
function renderSiteBody(n, opts){
  const eqs = equipmentOf(n);
  const towers = nodes.filter(x=>x.type==='tower' && x.parentDbId===n.dbId);
  const picking = !!opts.picking;
  let h = fieldsHtml([
    n.type==='pop' ? {label:'IP de gerência', value:escapeHtml(n.ip||'—')} : {label:'Altura', value:escapeHtml(n.altura||'—')},
    {label:'Equipamentos', value:eqs.length},
    {label:'Observação', value:escapeHtml(n.desc||'—'), full:true}
  ]);
  if(picking) h += `<div class="site-pick">Destino da ligação a partir de <b>${escapeHtml(linkOrigin.name)}</b>: escolha um equipamento abaixo ou
      <button class="btn btn-sm" id="btn-pick-site">o próprio ${TYPE_LABEL[n.type]}</button></div>`;
  h += `<div class="section-title">Equipamentos (${eqs.length})</div>`;
  const grupos = EQUIPMENT_TYPES.map(t=>[t, eqs.filter(e=>e.type===t)]).filter(g=>g[1].length);
  if(!grupos.length) h += '<div class="empty-state">Nenhum equipamento cadastrado neste site.</div>';
  grupos.forEach(([t, lista])=>{
    h += `<div class="site-group"><div class="site-group-title">${TYPE_LABEL[t]} (${lista.length})</div>`;
    lista.forEach(e=>{
      const ls = links.filter(l=>l.from===e.id || l.to===e.id);
      const meta = [e.fabricante, e.modelo].filter(Boolean).join(' · ');
      h += `<div class="site-eq${opts.highlight===e.id?' hl':''}" data-eq="${e.id}">
        <div class="site-eq-head"><b>${escapeHtml(e.name)}</b>${statusPill(e.status)}${lifecyclePill(e)}</div>
        ${meta ? `<div class="site-eq-meta">${escapeHtml(meta)}</div>` : ''}
        <div class="site-eq-links">${ls.map(l=>{
          const o = nodeById(l.from===e.id ? l.to : l.from);
          const interna = isInternalLink(l);
          const onde = o && o.siteId && !interna ? ' ('+escapeHtml(siteOf(o).name)+')' : '';
          return `<div>${interna?'interna':'externa'} · ${escapeHtml(LINK_TYPE_LABEL[l.type]||l.type)} → ${escapeHtml(o?o.name:'?')}${onde}</div>`;
        }).join('') || '<div class="muted">sem ligações</div>'}</div>
        <div class="action-row">${picking
          ? (e.id!==linkOrigin.id ? `<button class="btn btn-sm btn-accent" data-eq-pick="${e.id}">Ligar a este</button>` : '<span class="muted">origem</span>')
          : `<button class="btn btn-sm" data-eq-edit="${e.id}">Editar</button><button class="btn btn-sm" data-eq-link="${e.id}">Conectar</button><button class="btn btn-sm btn-danger" data-eq-del="${e.id}">Excluir</button>`}</div>
      </div>`;
    });
    h += '</div>';
  });
  if(towers.length){
    h += `<div class="section-title">Torres neste POP</div><div class="port-list">${towers.map(t=>
      `<div class="port-row" data-open-node="${t.id}" style="cursor:pointer"><span class="pd" style="background:${STATUS_COLOR[t.status]||'#8a92a3'}"></span><span class="pl">${escapeHtml(t.name)}</span><span class="pf">${equipmentOf(t).length} equip.</span></div>`).join('')}</div>`;
  }
  if(!picking){
    const tipos = EQUIPMENT_TYPES.concat(n.type==='pop' ? ['tower'] : []);
    h += `<div class="site-add"><select id="site-add-type">${tipos.map(t=>`<option value="${t}">${TYPE_LABEL[t]}</option>`).join('')}</select>
      <button class="btn btn-accent btn-sm" id="btn-site-add">Adicionar equipamento aqui dentro</button></div>`;

/* ---- SANGRIA: inserir uma caixa no meio de um trecho existente ----
   O cabo é cortado em dois segmentos no ponto da caixa. Por padrão TODAS as
   fibras ficam passantes (o cabo apenas atravessa a caixa, sem ser tocado).
   Depois, no diagrama, o admin escolhe quais fibras sangrar. */
/* ll (lat/lng do clique) é opcional: quando vem do botão direito na linha, o ponto
   é o do próprio clique. Sem ll (ex.: botão do painel lateral), cai no meio do trecho. */
function abrirSangria(link, ll){
  const a=nodeById(link.from), b=nodeById(link.to);
  const cab = cables.find(x=>x.linkId===link.id);
  const pos = ll || {lat:(a.lat+b.lat)/2, lng:(a.lng+b.lng)/2};
  modalEl.innerHTML = `
    <div class="modal-head"><h3>Inserir caixa no trecho</h3><button class="panel-close" id="modal-x">✕</button></div>
    <div class="modal-body">
      ${fieldsHtml([
        {label:'Trecho', value:escapeHtml(a.name)+' → '+escapeHtml(b.name), full:true},
        {label:'Cabo', value: cab ? escapeHtml(cab.nome)+' · '+cab.tipo : 'sem cabo documentado', full:true},
        {label:'Posição', value: ll ? 'ponto clicado no mapa' : 'meio do trecho (sem ponto exato)', full:true}
      ])}
      <div class="form-field"><label>Tipo de caixa</label>
        <select id="f-sg-tipo"><option value="ceo">CEO (caixa de emenda)</option><option value="cto">CTO</option></select>
      </div>
      <div class="form-field"><label>Nome</label><input id="f-sg-nome" type="text" placeholder="CEO-SANGRIA"></div>
      <div class="form-field" id="f-sg-cap-wrap" style="display:none;"><label>Número de portas</label><input id="f-sg-cap" type="number" min="1" max="144" value="16"></div>
      <div class="form-field"><label>Como entram as fibras</label>
        <select id="f-sg-modo">
          <option value="passante">Passante — cabo só descascado, perda zero (padrão)</option>
          <option value="fusao_massa">Fusão em massa — simula rompimento, todas emendadas já</option>
        </select>
      </div>
      <div class="cable-meta" id="f-sg-modo-hint">Todas as fibras entram como <b>passantes</b>. No diagrama você escolhe quais sangrar — as demais seguem intactas.</div>
    </div>
    <div class="modal-foot"><button class="btn" id="modal-cancel">Cancelar</button>
      <button class="btn btn-accent" id="modal-save">Inserir caixa</button></div>`;
  overlay.classList.add('show');
  const capWrap = document.getElementById('f-sg-cap-wrap');
  const tipoSel = document.getElementById('f-sg-tipo');
  const syncCapField = ()=> capWrap.style.display = (tipoSel.value==='cto') ? '' : 'none';
  syncCapField();
  tipoSel.addEventListener('change', syncCapField);
  const modoSel = document.getElementById('f-sg-modo');
  const hint = document.getElementById('f-sg-modo-hint');
  modoSel.addEventListener('change', ()=>{
    hint.innerHTML = modoSel.value==='fusao_massa'
      ? 'Todas as fibras entram <b>já fusionadas</b> (perda de fusão em cada uma) — use pra registrar um reparo/rompimento já emendado.'
      : 'Todas as fibras entram como <b>passantes</b>. No diagrama você escolhe quais sangrar — as demais seguem intactas.';
  });
  document.getElementById('modal-x').addEventListener('click', closeModal);
  document.getElementById('modal-cancel').addEventListener('click', closeModal);
  document.getElementById('modal-save').addEventListener('click', ()=>{
    const tipo=tipoSel.value;
    const nome=document.getElementById('f-sg-nome').value.trim() ||
      (tipo==='ceo'?'CEO-SANGRIA-':'CTO-SANGRIA-')+(nodes.filter(n=>n.type===tipo).length+1);
    const cap = tipo==='cto' ? Math.max(1, Math.min(144, parseInt(document.getElementById('f-sg-cap').value,10)||16)) : null;
    executarSangria(link, tipo, nome, pos, cap, modoSel.value);
    closeModal();
  });
}

function executarSangria(link, tipoCaixa, nome, pos, capacidade, modoFibra){
  const a=nodeById(link.from), b=nodeById(link.to);
  const cabOrig = cables.find(x=>x.linkId===link.id);
  const lat = pos.lat, lng = pos.lng;

  const caixa = addNode(tipoCaixa, nome, lat, lng, 'normal', {desc:'Inserida por sangria no trecho '+a.name+' → '+b.name});
  if(tipoCaixa==='cto'){
    const cap = capacidade || 16;
    caixa.capacity=cap; caixa.powerIn=-20;
    for(let i=1;i<=cap;i++) addPort(caixa.id,'Porta '+i,'livre');
  }

  const fo = cabOrig ? cabOrig.totalFibras : 12;
  const meta = (sufixo)=> ({nome:(cabOrig?cabOrig.nome:'CABO')+' '+sufixo, tipo:fo+'FO', totalFibras:fo,
                            construtivo: cabOrig?cabOrig.construtivo:undefined});
  const km1 = distanciaKm(a,caixa), km2 = distanciaKm(caixa,b);

  const l1 = addLink(link.type, a, caixa, link.status, {label:a.name+' → '+nome, km:+km1.toFixed(3), cableMeta:meta('(trecho 1)')});
  const l2 = addLink(link.type, caixa, b, link.status, {label:nome+' → '+b.name, km:+km2.toFixed(3), cableMeta:meta('(trecho 2)')});
  const c1 = cables.find(x=>x.linkId===l1.id), c2 = cables.find(x=>x.linkId===l2.id);
  if(c1){ c1.km=+km1.toFixed(3); if(cabOrig) c1.construtivo=cabOrig.construtivo; }
  if(c2){ c2.km=+km2.toFixed(3); if(cabOrig) c2.construtivo=cabOrig.construtivo; }

  // 'passante' (padrão): fibra atravessa sem ser tocada, perda zero — você
  // escolhe depois quais sangrar. 'fusao_massa': simula rompimento — TODAS as
  // fibras já entram fusionadas (perda de fusão em cada uma), como um técnico
  // faria emendando o cabo inteiro de uma vez no reparo.
  const emendaMassa = modoFibra==='fusao_massa' ? 'fusao' : null;
  if(c1&&c2){
    for(let i=1;i<=fo;i++){
      const f1=fiberIn(c1,i), f2=fiberIn(c2,i);
      if(!f1||!f2) continue;
      const cn = addConnection(caixa.id,'passante',{type:'fiber',id:f1.id},{type:'fiber',id:f2.id});
      cn.emenda = emendaMassa;
      const orig = cabOrig ? fiberIn(cabOrig,i) : null;
      const st = orig ? orig.status : 'livre';
      f1.status = st; f2.status = st;
    }
  }

  // o trecho original deixa de existir; as fibras dele também
  if(cabOrig){
    const fids = fiberStrands.filter(f=>f.cableId===cabOrig.id).map(f=>f.id);
    connections = connections.filter(cn=>
      !(cn.origem.type==='fiber'&&fids.includes(cn.origem.id)) &&
      !(cn.destino.type==='fiber'&&fids.includes(cn.destino.id)));
    fiberStrands = fiberStrands.filter(f=>f.cableId!==cabOrig.id);
    cables = cables.filter(x=>x.id!==cabOrig.id);
  }
  links = links.filter(x=>x.id!==link.id);
  if(b.parentLink===link.id){ b.parent=caixa.id; b.parentLink=l2.id; }

  closePanel();
  renderAll();
  toast(nome+' inserida: '+fo+' fibras passantes. Abra o diagrama para sangrar as que precisar.');
  onNodeClick(caixa.id);
}

/* ---- caminho do cliente até a origem ---- */
function showPathForClient(clientNode){
  const nodeIds = new Set(); const linkIds = new Set();
  let cur = clientNode;
  nodeIds.add(cur.id);
  let guard=0;
  while(cur.parent && guard<30){
    linkIds.add(cur.parentLink);
    const parent = nodeById(cur.parent);
    if(!parent) break;
    nodeIds.add(parent.id);
    if(parent.type==='pop') break; // origem alcançada
    cur = parent;
    guard++;
  }
  pathHighlight = {nodeIds, linkIds};
  selectedLinkId = null;
  renderAll();
  toast('Caminho até a origem destacado no mapa.');
}

   EXCLUSÃO
   ============================================================ */
function deleteNode(nodeId){
  const n = nodeById(nodeId);
  if(!n) return;
  if(!n.dbId){   // elemento só em memória (ex.: caixa criada por sangria): comportamento antigo
    links = links.filter(l=> l.from!==nodeId && l.to!==nodeId);
    ports = ports.filter(p=> p.nodeId!==nodeId);
    nodes = nodes.filter(x=> x.id!==nodeId);
    closePanel(); toast('Elemento excluído.');
    return;
  }
  mapPost('/nos/excluir', {id:n.dbId})
    .then(()=>{ loadNetwork(()=> toast('Elemento excluído.')); })
    .catch(err=> toast(err.message));
}

/* ============================================================
   BUSCA
   ============================================================ */
const searchInput = document.getElementById('search-input');
const searchResults = document.getElementById('search-results');
/* ---- coordenadas na busca: decimal, graus/minutos/segundos e link do Google Maps ---- */
function coordInRange(lat, lng){
  return isFinite(lat) && isFinite(lng) && Math.abs(lat)<=90 && Math.abs(lng)<=180 ? {lat, lng} : null;
}
function parseCoords(raw){
  const q = String(raw||'').trim();
  if(!q) return null;
  // 1) link do Google Maps (ou texto com URL)
  if(/^https?:\/\//i.test(q) || /(google\.[a-z.]+\/maps|goo\.gl|maps\.app)/i.test(q)){
    let u = q; try{ u = decodeURIComponent(q); }catch(e){}
    const N = '(-?\\d{1,3}(?:\\.\\d+)?)';
    const pats = [new RegExp('!3d'+N+'!4d'+N), new RegExp('@'+N+',\\s*'+N), new RegExp('[?&](?:q|ll|query|center|destination)='+'\\+?'+N+',\\s*\\+?'+N)];
    for(const re of pats){ const m = u.match(re); if(m) return coordInRange(parseFloat(m[1]), parseFloat(m[2])); }
    return null;
  }
  // 2) graus/minutos/segundos com hemisfério (N/S/E/W; L = leste, O = oeste)
  const hasHemi = /[NSEWLO]\s*$/i.test(q) || /\d\s*[NSEWLO]\b/i.test(q);
  if(/[°º'′’"″”]/.test(q) || hasHemi){
    const comp = /(\d{1,3}(?:[.,]\d+)?)\s*[°º]?\s*(?:(\d{1,2}(?:[.,]\d+)?)\s*['′’]?\s*(?:(\d{1,2}(?:[.,]\d+)?)\s*(?:''|"|″|”|′′)?)?)?\s*([NSEWLO])(?![A-Za-z])/gi;
    const found = []; let m;
    while((m = comp.exec(q))) found.push(m);
    if(found.length!==2) return null;
    // o que sobra (fora dos dois componentes) só pode ser separador
    const rest = q.replace(comp,'').replace(/[\s,;]+/g,'');
    if(rest) return null;
    const vals = {};
    for(const f of found){
      const num = x=> x===undefined ? 0 : parseFloat(String(x).replace(',','.'));
      const d=num(f[1]), mi=num(f[2]), se=num(f[3]);
      if(mi>=60 || se>=60 || (f[2]!==undefined && /[.,]/.test(f[1]))) return null;
      let v = d + mi/60 + se/3600;
      const h = f[4].toUpperCase();
      const axis = (h==='N'||h==='S') ? 'lat' : 'lng';
      if(axis in vals) return null;
      if(h==='S' || h==='W' || h==='O') v = -v;
      vals[axis] = v;
    }
    return ('lat' in vals && 'lng' in vals) ? coordInRange(vals.lat, vals.lng) : null;
  }
  // 3) decimal
  const n = '[+-]?\\d+(?:[.,]\\d+)?', nd = '[+-]?\\d+(?:\\.\\d+)?';
  let m = q.match(new RegExp('^('+n+')\\s*;\\s*('+n+')$'))                // ponto e vírgula: vírgula decimal ok
       || q.match(new RegExp('^('+n+')\\s+('+n+')$'));                     // espaço: vírgula decimal ok
  if(!m){
    m = q.match(new RegExp('^('+nd+')\\s*,\\s*('+nd+')$'));               // vírgula separadora, ponto decimal
    if(m && !(/\./.test(q) || /,\s/.test(q))) m = null;                    // "-21,5" não é um par
    if(!m){
      m = q.match(/^([+-]?\d+,\d+)\s*,\s+([+-]?\d+,\d+)$/);               // "-21,0025, -42,8375" (decimal brasileiro)
    }
  }
  if(!m) return null;
  return coordInRange(parseFloat(m[1].replace(',','.')), parseFloat(m[2].replace(',','.')));
}

/* Próximo nome da sequência do tipo: PREFIXO-NNN, maior número existente + 1 (001 se não houver). */
function nextNodeName(type){
  const prefix = NAME_PREFIX[type] || String(type).toUpperCase();
  const re = new RegExp('^'+prefix+'-(\\d+)$', 'i');

  nodes.forEach(n=>{ if(n.type!==type) return; const m = String(n.name||'').match(re); if(m) max = Math.max(max, parseInt(m[1],10)); });
  return prefix+'-'+String(max+1).padStart(3,'0');
}

/* Distância em linha reta entre dois nós (km) — base para a perda por km.
   Quando existir rota com pontos intermediários, o comprimento vem da rota. */
function distanciaKm(a,b){
  const R=6371, rad=Math.PI/180;
  const dLat=(b.lat-a.lat)*rad, dLng=(b.lng-a.lng)*rad;
  const la1=a.lat*rad, la2=b.lat*rad;
  const h=Math.sin(dLat/2)**2 + Math.cos(la1)*Math.cos(la2)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
