/* ============================================================
   GERAÇÃO DE DADOS MOCK (nodes / ports / links)
   Estrutura estável: cada nó tem id único; portas referenciam nodeId;
   links referenciam nodeId + portId (nunca por nome).
   ============================================================ */
let nodes = [], ports = [], links = [];
let mapDefaults = {};   // data.defaults do GET /api/mapa (perdas, atenuação, sensibilidade da ONU)
let cables = [], fiberStrands = [], splitters = [], connections = [], measurements = [];
let _nid=1,_pid=1,_lid=1,_cid=1,_fid=1,_spid=1,_cnid=1,_mid=1;
const nid=()=> 'n'+(_nid++);
const pid=()=> 'p'+(_pid++);
const lid=()=> 'l'+(_lid++);
const cid=()=> 'cb'+(_cid++);
const fid=()=> 'fs'+(_fid++);
const spid=()=> 'sp'+(_spid++);
const cnid=()=> 'cn'+(_cnid++);
const mid=()=> 'ms'+(_mid++);

function addNode(type,name,lat,lng,status,extra){
  const n = Object.assign({id:nid(),type,name,lat,lng,status:status||'normal',parent:null,parentLink:null},extra||{});
  nodes.push(n);
  return n;
}
function addPort(nodeId,label,status,extra){
  const p = Object.assign({id:pid(),nodeId,label,status:status||'livre'},extra||{});
  ports.push(p);
  return p;
}

function addLink(type,fromNode,toNode,status,extra){
  extra = Object.assign({}, extra||{});
  const cableMeta = extra.cableMeta; delete extra.cableMeta;
  const l = Object.assign({id:lid(),type,from:fromNode.id,to:toNode.id,status:status||'normal'},extra);
  links.push(l);
  toNode.parent = fromNode.id;
  toNode.parentLink = l.id;
  if(cableMeta) addCable(l, cableMeta.nome, cableMeta.tipo, cableMeta.totalFibras, cableMeta.coresOcupadas);
  return l;
}

/* ---- infraestrutura óptica: CABLE / FIBER_STRAND / SPLITTER / CONNECTION / MEASUREMENT ---- */
function addCable(linkOrNull, nome, tipo, totalFibras, overrides){
  const codigo = 'CB-'+String(cables.length+1).padStart(3,'0');
  const c = {id:cid(), codigo, linkId: linkOrNull?linkOrNull.id:null, nome, tipo, totalFibras, localAtNode:null};
  cables.push(c);
  for(let i=1;i<=totalFibras;i++){
    // A cor se repete a cada tubo: a fibra 13 volta a ser Verde, no tubo 2.
    const corPadrao = FIBER_COLOR_ORDER[(i-1)%FIBERS_PER_TUBE%FIBER_COLOR_ORDER.length];
    const ov = (overrides||[]).find(o=>o.numero===i);
    fiberStrands.push({
      id:fid(), cableId:c.id, numero:i,
      cor: ov&&ov.cor?ov.cor:corPadrao,
      tubo: tubeOf(i), tuboCor: tubeColor(i),
      status: ov?(ov.status||'livre'):'livre'
    });
  }
  return c;
}
function fiberIn(cable, numero){ return fiberStrands.find(f=>f.cableId===cable.id && f.numero===numero); }
function cablesAtNode(nodeId){
  return cables.filter(c=>{
    if(c.localAtNode===nodeId) return true;
    const l = links.find(x=>x.id===c.linkId);
    return l && (l.from===nodeId || l.to===nodeId);
  });
}
// balanceado=false: saidas = percentuais (ex.: [10,90] num tap 10/90)
// balanceado=true:  saidas = quantidade de vias (ex.: 8 num 1x8)
function addSplitter(nodeId, razao, saidas, balanceado){
  const s = {id:spid(), nodeId, razao, balanceado:!!balanceado, ports:[]};
  s.ports.push({id:s.id+'-in', splitterId:s.id, papel:'entrada'});
  const lista = balanceado ? Array.from({length:saidas},(_,i)=>i+1) : saidas;
  lista.forEach((v,idx)=> s.ports.push({
    id:s.id+'-out'+v, splitterId:s.id, papel:'saida',
    percentual: balanceado?null:v, indice: idx+1
  }));
  splitters.push(s);
  return s;
}
function splitterOutLabel(p, s){ return s.balanceado ? ('S'+p.indice) : (p.percentual+'%'); }
function splitterPortById(portId){
  for(const s of splitters){ const p=s.ports.find(pp=>pp.id===portId); if(p) return {port:p, splitter:s}; }
  return null;
}
function addConnection(nodeId, tipo, origem, destino){
  const c = {id:cnid(), nodeId, tipo, origem, destino};
  connections.push(c);
  return c;
}
function addMeasurement(targetType, targetId, kind, valorDbm, extra){
  measurements.push(Object.assign({id:mid(), targetType, targetId, kind, valorDbm}, extra||{}));
  return measurements[measurements.length-1];
}
function measurementsFor(targetId){ return measurements.filter(m=>m.targetId===targetId); }

/* ---- carga dos dados reais (GET /api/mapa) ---- */
function setMapStatus(msg, isError){
  const el = document.getElementById('map-status');
  if(!el) return;
  el.textContent = msg || '';
  el.classList.toggle('show', !!msg);
  el.classList.toggle('error', !!isError);
}
function applyTopology(data){
  mapDefaults = data.defaults || {};
  const rawNodes = Array.isArray(data.nodes) ? data.nodes : [];
  const rawPorts = Array.isArray(data.ports) ? data.ports : [];
  const rawLinks = Array.isArray(data.links) ? data.links : [];
  const byDb = {};
  rawNodes.forEach(r=>{
    const n = Object.assign({}, r.attrs_json||{}, {
      id:'n'+r.id, dbId:r.id, type:r.node_type, name:r.name, code:r.code, lat:r.lat, lng:r.lng,
      parentDbId:r.parent_node_id, _inherit:(r.lat==null || r.lng==null),
      status:r.status||'normal', lifecycle:r.lifecycle||'ativo', parent:null, parentLink:null, notes:r.notes, desc:r.notes||'',
      _attrs:Object.assign({}, r.attrs_json||{})
    });
    if(n.type==='olt') n.pons = [];
    if(n.type==='switch'){ n.ports24 = n.ports24||24; n.used = n.used||0; }
    nodes.push(n); byDb[r.id] = n;
  });
  // Sem coordenada própria: posição do contêiner (subindo a cadeia). Sem nenhuma na cadeia, não há onde desenhar.
  nodes.forEach(n=>{
    if(!n._inherit) return;
    let p = byDb[n.parentDbId], guard = 0;
    while(p && p._inherit && guard++ < 20) p = byDb[p.parentDbId];
    if(p && !p._inherit){ n.lat = p.lat; n.lng = p.lng; } else delete byDb[n.dbId];
  });
  nodes = nodes.filter(n=> byDb[n.dbId]===n);
  nodes.forEach(n=>{ if(isEquipment(n) && byDb[n.parentDbId]) n.siteId = byDb[n.parentDbId].id; });
  nodes.forEach(n=>{ if(isPassive(n) && byDb[n.parentDbId]) n.boxId = byDb[n.parentDbId].id; });   // splitter/DIO: caixa ou site pai
  rawPorts.forEach(r=>{
    const n = byDb[r.node_id]; if(!n) return;
    const a = r.attrs_json||{};
    if(r.port_role==='pon' && n.type==='olt')
      n.pons.push({ponId:r.label||('PON '+r.port_num), onus:a.onus||0, power:a.power==null?null:a.power, status:r.status||'livre'});
    ports.push(Object.assign({}, a, {id:'p'+r.id, dbId:r.id, nodeId:n.id, label:r.label||('Porta '+r.port_num),
      status:r.status||'livre', role:r.port_role, num:r.port_num, media:r.media||PORT_MEDIA[r.port_role]||null, external:!!r.is_external}));
  });
  rawLinks.forEach(r=>{
    const a = byDb[r.from_node_id], b = byDb[r.to_node_id]; if(!a || !b) return;
    const at = r.attrs_json||{};
    const extra = Object.assign({}, at, {dbId:r.id, lifecycle:r.lifecycle||'ativo', label:r.label, medium:r.medium, lengthM:r.length_m, fiberCount:r.fiber_count, pathPts:normalizePath(r.path_json).pontos, reservas:normalizePath(r.path_json).reservas, folgaPct:normalizePath(r.path_json).folga_pct,
      fromPort:r.from_port_id ? 'p'+r.from_port_id : null, toPort:r.to_port_id ? 'p'+r.to_port_id : null,
      _attrs:Object.assign({}, at)});
    if(r.length_m!=null) extra.km = +(r.length_m/1000).toFixed(3);
    if(r.fiber_count) extra.cableMeta = {nome:at.cabo_nome||('CABO '+r.id), tipo:at.cabo_tipo||(r.fiber_count+'FO'), totalFibras:r.fiber_count, construtivo:at.cabo_construtivo};
    const l = addLink(r.link_type, a, b, r.status||'normal', extra);
    const cbl = cables.find(x=>x.linkId===l.id);
    if(cbl){ cbl.construtivo = at.cabo_construtivo; if(extra.km!==undefined) cbl.km = extra.km; }
    if(r.link_type==='backbone'){ b.parent = null; b.parentLink = null; }   // backbone não define hierarquia
  });
  // contadores em memória não podem colidir com os ids vindos do banco
  _nid = Math.max(_nid, ...rawNodes.map(r=>r.id+1)); _pid = Math.max(_pid, ...rawPorts.map(r=>r.id+1)); _lid = Math.max(_lid, ...rawLinks.map(r=>r.id+1));
  setMapStatus(nodes.length ? '' : 'Nenhum elemento cadastrado');
  fitToNetwork();
}
function resetTopology(){
  nodes = []; ports = []; links = []; cables = []; fiberStrands = []; splitters = []; connections = []; measurements = [];
  selectedNodeId = null; selectedLinkId = null; pathHighlight = null;
}
/* "Ver no mapa" das telas de rede: /mapa?no=ID centra e abre o painel do nó, uma única vez por carregamento da página. */
let focusDone = false;
function focusRequestedNode(){
  const want = (window.ISP_MAP || {}).focus;
  if(focusDone || !want) return;
  focusDone = true;
  const n = nodes.find(x=>x.dbId===want);
  if(!n || typeof n.lat!=='number' || typeof n.lng!=='number') return;
  measureMap();
  view.cx = lngToWorldX(n.lng); view.cy = latToWorldY(n.lat);
  view.scale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, Math.max(view.scale, 256*Math.pow(2,16))));
  renderAll();
  onNodeClick(n.id);
}
/* Recarrega a topologia do servidor (fonte da verdade). onDone(): chamado após aplicar com sucesso. */
function loadNetwork(onDone){
  const cfg = window.ISP_MAP || {};
  const sessionMsg = 'Sessão expirada — faça login novamente';
  if(!nodes.length) setMapStatus('Carregando…');
  fetch(cfg.api || '/api/mapa', {credentials:'same-origin', headers:{'Accept':'application/json'}})
    .then(resp=>{
      const ct = resp.headers.get('content-type') || '';
      if(resp.redirected || !ct.includes('application/json')) throw new Error('session');
      return resp.json().then(body=>({status:resp.status, body}));
    })
    .then(({status, body})=>{
      if(status===403) throw new Error('forbidden');
      if(!body || body.ok!==true || !body.data) throw new Error('api');
      resetTopology();
      closePanel();
      applyTopology(body.data);
      focusRequestedNode();
      if(typeof onDone==='function') onDone();
    })
    .catch(err=>{
      const m = err && err.message;
      setMapStatus(m==='session' ? sessionMsg : (m==='forbidden' ? 'Acesso negado ao mapa.' : 'Não foi possível carregar o mapa.'), true);
    });
}
/* Grava um nó: POST FormData + X-CSRF-Token. Resolve com data; rejeita com Error(mensagem do servidor). */
function mapPost(path, fields){
  const cfg = window.ISP_MAP || {};
  const fd = new FormData();
  Object.keys(fields).forEach(k=>{ if(fields[k]!==null && fields[k]!==undefined) fd.append(k, fields[k]); });
  return fetch((cfg.api || '/api/mapa') + path, {method:'POST', body:fd, credentials:'same-origin',
      headers:{'Accept':'application/json', 'X-CSRF-Token': cfg.csrf || ''}})
    .then(resp=>{
      const ct = resp.headers.get('content-type') || '';
      if(resp.redirected || !ct.includes('application/json')) throw new Error('Sessão expirada — faça login novamente');
      return resp.json().then(body=>{
        if(!resp.ok || !body || body.ok!==true) throw new Error((body && body.message) || 'Não foi possível gravar.');
        return body.data;
      });
    });
}
function nodeAttrsJson(n, overrides){
  return JSON.stringify(Object.assign({}, n && n._attrs || {}, overrides||{}));
}
loadNetwork();

/* ============================================================
   MAPA — renderizador SVG próprio (sem biblioteca externa)
   Projeção equiretangular simples. lat/lng continuam sendo a verdade dos dados;
   a projeção é só a forma de desenhar. Trocar por tiles reais depois é direto.
   ============================================================ */
const mapEl = document.getElementById('map');

/* --- Projeção Web Mercator (mesma dos tiles de OSM/Google/Esri) ---
   Mundo normalizado em [0,1]. view.scale = pixels por unidade de mundo,
   equivalente a 256 * 2^zoom. Isso permite casar os tiles pixel a pixel. */
function lngToWorldX(lng){ return (lng+180)/360; }
function latToWorldY(lat){
  const s = Math.sin(lat*Math.PI/180);
  return 0.5 - Math.log((1+s)/(1-s))/(4*Math.PI);
}
function worldXToLng(x){ return x*360-180; }
function worldYToLat(y){ return Math.atan(Math.sinh(Math.PI*(1-2*y)))*180/Math.PI; }

const MIN_SCALE = 256*Math.pow(2,3), MAX_SCALE = 256*Math.pow(2,20);
let view = {cx:0.5, cy:0.5, scale:256*Math.pow(2,13)};
let mapW = 900, mapH = 700;

function toScreen(lat,lng){
  return { x:(lngToWorldX(lng)-view.cx)*view.scale + mapW/2,
           y:(latToWorldY(lat)-view.cy)*view.scale + mapH/2 };
}
function toLatLng(sx,sy){
  const wx=(sx-mapW/2)/view.scale+view.cx, wy=(sy-mapH/2)/view.scale+view.cy;
  return { lat:worldYToLat(wy), lng:worldXToLng(wx) };
}
function measureMap(){
  const r = mapEl.getBoundingClientRect();
  if(r.width>0)  mapW = r.width;
  if(r.height>0) mapH = r.height;
}
function currentZoom(){ return Math.log(view.scale/256)/Math.LN2; }

/* --- Mapas base disponíveis ---
   Trocar de provedor é só acrescentar uma entrada aqui. O Google exige
   chave de API e contrato próprio, por isso fica registrado mas desativado. */
const BASEMAPS = {
  none:   {label:'Grade técnica (sem mapa)', url:null, attrib:'Protótipo — dados fictícios', dark:true},
  osm:    {label:'OpenStreetMap (ruas)',
           url:(z,x,y)=>`https://tile.openstreetmap.org/${z}/${x}/${y}.png`,
           attrib:'© OpenStreetMap contributors', maxNativeZoom:19, dim:0.72},
  dark:   {label:'Mapa escuro (OSM, filtro)',
           url:(z,x,y)=>`https://tile.openstreetmap.org/${z}/${x}/${y}.png`,
           attrib:'© OpenStreetMap contributors', maxNativeZoom:19, dim:1, dark:true,
           filter:'invert(1) hue-rotate(180deg) brightness(.9) contrast(.9)'},   // Carto passou a exigir chave de API
  sat:    {label:'Satélite (Esri)',
           url:(z,x,y)=>`https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${z}/${y}/${x}`,
           attrib:'© Esri, Maxar, Earthstar Geographics', maxNativeZoom:17, dim:0.85},
  satStreets: {label:'Satélite + ruas',
           url:(z,x,y)=>`https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${z}/${y}/${x}`,
           attrib:'© Esri, Maxar, Earthstar Geographics; referências © Esri, HERE, Garmin, OpenStreetMap contributors',
           maxNativeZoom:17, dim:0.85,
           // Coimbra/MG: referências com conteúdo até z19 (ruas) e z17 (localidades); acima, PNG vazio.
           overlays:[
             {url:(z,x,y)=>`https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/${z}/${y}/${x}`, maxNativeZoom:19},
             {url:(z,x,y)=>`https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/${z}/${y}/${x}`, maxNativeZoom:17}
           ]}
};
/* maxNativeZoom = último zoom em que a camada tem imagem real. Acima dele o mesmo tile do zoom máximo é ampliado
   (overzoom), em vez de pedir tiles que não existem. Esri: z18 é "Map data not yet available" em áreas rurais do
   Brasil (testado em MG, GO, MT, BA e AM; só cidades grandes têm z18); z17 existe em todos os pontos testados. OSM: z19; z20 dá HTTP 400. */
let basemap = 'osm';
let tileErrors = 0, tileTried = 0;

function renderTiles(parts){
  const bm = BASEMAPS[basemap];
  if(!bm || !bm.url) return;
  [bm, ...(bm.overlays||[])].forEach(layer=>renderTileLayer(parts, layer));
}

function renderTileLayer(parts, bm){
  let z = Math.round(currentZoom());
  z = Math.max(0, Math.min(bm.maxNativeZoom||19, z));   // acima do zoom nativo: overzoom (tile ampliado)
  const n = Math.pow(2,z);
  const tileScreen = view.scale/n;                       // tamanho do tile na tela
  const x0 = Math.floor((view.cx - (mapW/2)/view.scale)*n);
  const x1 = Math.floor((view.cx + (mapW/2)/view.scale)*n);
  const y0 = Math.floor((view.cy - (mapH/2)/view.scale)*n);
  const y1 = Math.floor((view.cy + (mapH/2)/view.scale)*n);
  if((x1-x0+1)*(y1-y0+1) > 400) return;                  // proteção contra excesso
  parts.push(`<g opacity="${bm.dim||1}"${bm.filter?` style="filter:${bm.filter}"`:''}>`);
  for(let ty=y0; ty<=y1; ty++){
    if(ty<0||ty>=n) continue;
    for(let tx=x0; tx<=x1; tx++){
      const wx = ((tx%n)+n)%n;
      const sx = (tx/n - view.cx)*view.scale + mapW/2;
      const sy = (ty/n - view.cy)*view.scale + mapH/2;
      tileTried++;
      parts.push(`<image class="mtile" href="${bm.url(z,wx,ty)}" x="${sx}" y="${sy}" width="${tileScreen+1}" height="${tileScreen+1}" preserveAspectRatio="none" onerror="window.__tileFail&&window.__tileFail()"/>`);
    }
  }
  parts.push('</g>');
}

function setBasemap(key){
  basemap = key;
  tileErrors = 0; tileTried = 0;
  const bm = BASEMAPS[key];
  mapEl.classList.toggle('has-tiles', !!bm.url);
  const at = document.querySelector('.map-attrib');
  if(at) at.textContent = bm.url ? bm.attrib : 'Protótipo — dados fictícios';
  renderAll();
}

let searchPin = null;   // marcador temporário da busca por coordenada {lat,lng}
let selectedNodeId = null;
let selectedLinkId = null;
let linkPoint = null;   // {linkId, lat, lng} — marcador deixado por um clique esquerdo na fibra
let pathHighlight = null;
let activeTypeFilters = new Set(TYPE_ORDER);
let activeLinkFilters = new Set(Object.keys(LINK_TYPE_LABEL));
let activeLifecycleFilters = new Set(['projeto','ativo','desativado']);
let alertsOnly = false;
const LIFECYCLE_LABEL = {projeto:'Projeto', ativo:'Ativo', desativado:'Desativado'};
const lifecycleOf = x => (x && x.lifecycle) || 'ativo';

/* ---- estado de edição/criação ---- */
let reserveMode = null;   // {linkId, idx|null}: esperando o clique no cabo para marcar/posicionar uma reserva
let trace = null;       // edição do traçado de um cabo (ver bloco TRAÇADO DO CABO)
let mode = 'idle';     // idle | placing | linking-dest
let placingType = null;
let linkOrigin = null;

function nodeById(id){ return nodes.find(n=>n.id===id); }
function linkById(id){ return links.find(l=>l.id===id); }
function portsOf(nodeId){ return ports.filter(p=>p.nodeId===nodeId); }
function linksOfNode(nodeId){ return links.filter(l=>l.from===nodeId || l.to===nodeId); }

function nodeVisible(n){
  if(!activeLifecycleFilters.has(lifecycleOf(n))) return false;
  if(!activeTypeFilters.has(n.type)) return false;
  if(alertsOnly && !(n.status==='alerta'||n.status==='critico'||n.status==='offline')) return false;
  return true;
}
function linkVisible(l){
  if(!activeLifecycleFilters.has(lifecycleOf(l))) return false;
  if(!activeLinkFilters.has(l.type)) return false;
  const a=nodeById(l.from), b=nodeById(l.to);
  if(!a||!b) return false;
  if(!activeTypeFilters.has(a.type) || !activeTypeFilters.has(b.type)) return false;
  if(alertsOnly && !(l.status==='alerta'||l.status==='critico'||l.status==='offline')) return false;
  return true;
}

function fitToNetwork(){
  measureMap();
  let pts = nodes.filter(n=> n.type!=='client' && nodeVisible(n));
  if(!pts.length) pts = nodes.filter(nodeVisible);
  if(!pts.length) return;
  const xs = pts.map(n=>lngToWorldX(n.lng)), ys = pts.map(n=>latToWorldY(n.lat));
  const minX=Math.min.apply(null,xs), maxX=Math.max.apply(null,xs);
  const minY=Math.min.apply(null,ys), maxY=Math.max.apply(null,ys);
  view.cx=(minX+maxX)/2; view.cy=(minY+maxY)/2;
  const pad=70;
  const sx=(mapW-pad*2)/Math.max(1e-9,maxX-minX);
  const sy=(mapH-pad*2)/Math.max(1e-9,maxY-minY);
  let s=Math.min(sx,sy);
  if(!isFinite(s)||s<=0) s=256*Math.pow(2,13);
  view.scale=Math.max(MIN_SCALE, Math.min(MAX_SCALE, s));
  renderAll();
}
function zoomBy(factor, ax, ay){
  measureMap();
  if(ax===undefined) ax=mapW/2;
  if(ay===undefined) ay=mapH/2;
  const before = toLatLng(ax,ay);
  view.scale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, view.scale*factor));
  const after = toLatLng(ax,ay);
  view.cx += lngToWorldX(before.lng)-lngToWorldX(after.lng);
  view.cy += latToWorldY(before.lat)-latToWorldY(after.lat);
  renderAll();
}

/* ---- render ---- */
function renderAll(){
  measureMap();
  nodes.forEach(n=>{ if(n._inherit && (n.siteId || n.boxId)){ const st = nodeById(n.siteId || n.boxId); if(st){ n.lat = st.lat; n.lng = st.lng; } } });
  const parts = [];
  parts.push(`<svg id="map-svg" width="${mapW}" height="${mapH}" viewBox="0 0 ${mapW} ${mapH}">`);
  renderTiles(parts);

  // links (abaixo dos nós)
  links.forEach(l=>{
    if(!linkVisible(l)) return;
    if(isInternalLink(l)) return;                 // interna ao site: só aparece no painel do site
    const a=nodeById(l.from), b=nodeById(l.to);   // equipamento já está na posição do site
    const st = LINK_TYPE_STYLE[l.type];
    let color=st.color, opacity=.85, weight=st.weight;
    if(l.status==='offline') color=STATUS_COLOR.offline;
    if(l.status==='critico') color=STATUS_COLOR.critico;
    const lcl = lifecycleOf(l);
    if(pathHighlight){
      if(pathHighlight.linkIds.has(l.id)){ opacity=1; weight=st.weight+1.5; color='#4fd1c5'; }
      else opacity=.08;
    } else if(selectedLinkId){
      if(l.id===selectedLinkId){ opacity=1; weight=st.weight+1.5; color='#4fd1c5'; }
      else opacity=.12;
    }
    const p1=toScreen(a.lat,a.lng), p2=toScreen(b.lat,b.lng);
    if(lcl==='projeto') opacity *= .6; else if(lcl==='desativado') opacity *= .45;
    const dash = lcl==='projeto' ? 'stroke-dasharray="3,4"' : (st.dash ? `stroke-dasharray="${st.dash}"` : '');
    const tracing = trace && trace.linkId===l.id;
    const mid = tracing ? trace.pts : (l.pathPts||[]);
    if(!mid.length){   // cabo antigo / sem traçado: linha reta, exatamente como antes
      parts.push(`<line class="mlink-hit" data-link="${l.id}" x1="${p1.x}" y1="${p1.y}" x2="${p2.x}" y2="${p2.y}"/>`);
      parts.push(`<line class="mlink" data-link="${l.id}" x1="${p1.x}" y1="${p1.y}" x2="${p2.x}" y2="${p2.y}" stroke="${color}" stroke-width="${weight}" opacity="${opacity}" ${dash}/>`);
    } else {
      const pts = [p1].concat(mid.map(q=>toScreen(q[0],q[1])), [p2]).map(q=>q.x.toFixed(1)+','+q.y.toFixed(1)).join(' ');
      parts.push(`<polyline class="mlink-hit" data-link="${l.id}" points="${pts}"/>`);
      parts.push(`<polyline class="mlink" data-link="${l.id}" points="${pts}" fill="none" stroke-linejoin="round" stroke="${color}" stroke-width="${weight}" opacity="${opacity}" ${dash}/>`);
    }
  });
  if(trace) renderTraceUnder(parts);

  // nós
  nodes.forEach(n=>{
    if(!nodeVisible(n)) return;
    if(isEquipment(n) || isPassive(n)) return;    // equipamento é desenhado pelo site (selo com a contagem); passivo não vira ícone
    const p = toScreen(n.lat,n.lng);
    if(p.x<-120||p.x>mapW+120||p.y<-120||p.y>mapH+120) return;   // fora da tela: não desenha
    const dim = pathHighlight && !pathHighlight.nodeIds.has(n.id);
    const size = ICON_SIZE[n.type]||18;
    const r = size/2+5;
    const color = STATUS_COLOR[n.status]||'#8a92a3';
    const lc = lifecycleOf(n);
    const op = dim ? .18 : (lc==='projeto' ? .6 : (lc==='desativado' ? .45 : 1));
    parts.push(`<g class="mnode" data-node="${n.id}" transform="translate(${p.x},${p.y})" opacity="${op}">`);
    parts.push(`<circle class="mnode-hit" r="${r+8}"/>`);
    if(n.id===selectedNodeId) parts.push(`<circle r="${r+4}" fill="none" stroke="#4fd1c5" stroke-width="2.5" opacity=".75"/>`);
    parts.push(`<circle r="${r}" fill="#11151c" stroke="${color}" stroke-width="2"${lc==='projeto'?' stroke-dasharray="4,3"':''}/>`);
    parts.push(nodeIconSVG(n.type, color, size*0.62));
    if(isContainer(n)){
      const qtd = equipmentOf(n).length;
      if(qtd) parts.push(`<g class="msite-badge" transform="translate(${r-1},${-r+1})"><circle r="7.5" fill="#4fd1c5" stroke="#0a0d12" stroke-width="1.5"/><text text-anchor="middle" y="3.2" font-size="9" font-weight="700" fill="#04211f">${qtd}</text></g>`);
    }
    parts.push(`</g>`);
    if(['pop','olt','switch','tower','cto','ceo'].includes(n.type)){
      parts.push(`<text class="mlabel${dim?' dim':''}" x="${p.x+r+6}" y="${p.y+4}">${escapeHtml(n.name)}</text>`);
    }
  });

  // reservas técnicas com posição: ícone próprio sobre o cabo
  links.forEach(l=>{
    if(!linkVisible(l) || isInternalLink(l) || !l.reservas) return;
    l.reservas.forEach((r,i)=>{
      if(!r.pos) return;
      const q = toScreen(r.pos[0], r.pos[1]);
      if(q.x<-30||q.x>mapW+30||q.y<-30||q.y>mapH+30) return;
      const sel = selectedLinkId===l.id;
      parts.push(`<g class="mreserve${sel?' sel':''}" data-link="${l.id}" data-ri="${i}" transform="translate(${q.x.toFixed(1)},${q.y.toFixed(1)})"><title>${escapeHtml('Reserva técnica: '+(r.local||'sem local')+' · '+fmtLength(+r.m))}</title><circle class="rs-bg" r="9"/><path class="rs-ic" d="M-4,2 a4,4 0 1,1 4,3 a3,3 0 1,1 3,-3"/></g>`);
    });
  });


  // marcador temporário da busca por coordenada
  if(searchPin){
    const q = toScreen(searchPin.lat, searchPin.lng);
    parts.push(`<g class="search-pin" transform="translate(${q.x},${q.y})" pointer-events="none">
      <circle r="11" fill="none" stroke="#4fd1c5" stroke-width="2.5"/><circle r="3" fill="#4fd1c5"/>
      <line x1="-17" y1="0" x2="-7" y2="0" stroke="#4fd1c5" stroke-width="2"/><line x1="7" y1="0" x2="17" y2="0" stroke="#4fd1c5" stroke-width="2"/>
      <line x1="0" y1="-17" x2="0" y2="-7" stroke="#4fd1c5" stroke-width="2"/><line x1="0" y1="7" x2="0" y2="17" stroke="#4fd1c5" stroke-width="2"/></g>`);
  }

  // conectores visuais do nó selecionado (arrastar para criar link)
  if(mode==='idle' && selectedNodeId){
    const n = nodeById(selectedNodeId);
    if(n && nodeVisible(n)){
      const p = toScreen(n.lat,n.lng);
      [[0,-32],[32,0],[0,32],[-32,0]].forEach(o=>{
        parts.push(`<circle class="mhandle" data-handle="${n.id}" cx="${p.x+o[0]}" cy="${p.y+o[1]}" r="6"><title>Arraste até outro elemento para conectar</title></circle>`);
      });
    }
  }
  if(linkPoint){
    const lpL = linkById(linkPoint.linkId);
    if(lpL && linkVisible(lpL)){
      const pm = toScreen(linkPoint.lat, linkPoint.lng);
      parts.push(`<circle class="mlinkpoint" cx="${pm.x}" cy="${pm.y}" r="6" fill="#4fd1c5" stroke="#0b0e13" stroke-width="2"/>`);
    }
  }
  if(trace) renderTraceOver(parts);
  parts.push(`<g id="overlay-temp"></g>`);
  parts.push('</svg>');
  mapEl.innerHTML = parts.join('');
  updateKPIs();
  renderSidebar();
  // comprimento calculado acompanha o arraste dos pontos
  document.querySelectorAll('[data-link-len]').forEach(el=>{ const x = linkById(el.getAttribute('data-link-len')); if(x) el.textContent = linkLengthText(x); });
  document.querySelectorAll('[data-link-detail]').forEach(el=>{ const x = linkById(el.getAttribute('data-link-detail')); if(x) el.innerHTML = linkLengthDetailHtml(x); });
}

/* ---- interação (pointer events: funciona com mouse e toque) ---- */
let ptr = null;
function localPt(e){
  const r = mapEl.getBoundingClientRect();
  return {x:e.clientX-r.left, y:e.clientY-r.top};
}
function snapTargetAt(x,y,excludeId){
  let best=null, bestD=34;
  nodes.forEach(n=>{
    if(n.id===excludeId || !nodeVisible(n) || isEquipment(n)) return;
    const p=toScreen(n.lat,n.lng);
    const d=Math.hypot(p.x-x,p.y-y);
    if(d<bestD){ bestD=d; best=n.id; }
  });
  return best;
}
function drawTemp(html){
  const g = document.getElementById('overlay-temp');
  if(g) g.innerHTML = html;
}

mapEl.addEventListener('pointerdown', (e)=>{
  if(e.button===2 || e.button===1) return;   // direito/meio: não inicia pan, arraste nem seleção
  const t = e.target;
  const handle = t.closest ? t.closest('.mhandle') : null;
  const nodeG  = t.closest ? t.closest('.mnode') : null;
  const linkEl = t.closest ? t.closest('.mlink-hit, .mlink') : null;
  const p = localPt(e);
  const vtx = trace && t.closest ? t.closest('.mvertex') : null;
  const midH = trace && t.closest ? t.closest('.mmid') : null;
  const resG = !trace && t.closest ? t.closest('.mreserve') : null;
  if(resG && mode!=='reserving'){
    const rl = resG.getAttribute('data-link');
    ptr = {kind:'reserve', link:rl, idx:+resG.getAttribute('data-ri'), x0:p.x, y0:p.y, moved:false, wasSel:selectedLinkId===rl};
  } else if(vtx){
    ptr = {kind:'vertex', idx:+vtx.getAttribute('data-vi'), x0:p.x, y0:p.y, moved:false};
  } else if(midH){
    ptr = {kind:'mid', idx:+midH.getAttribute('data-mi'), x0:p.x, y0:p.y, moved:false};
  } else if(trace){
    ptr = {kind:'pan', x0:p.x, y0:p.y, cx0:view.cx, cy0:view.cy, moved:false};   // em edição de traçado, nó/cabo não reagem
  } else if(handle){
    ptr = {kind:'connect', originId:handle.getAttribute('data-handle'), x0:p.x, y0:p.y, moved:false, snap:null};
  } else if(nodeG){
    ptr = {kind:'node', id:nodeG.getAttribute('data-node'), x0:p.x, y0:p.y, moved:false};
  } else if(linkEl){
    ptr = {kind:'link', id:linkEl.getAttribute('data-link'), x0:p.x, y0:p.y, moved:false, ll:toLatLng(p.x,p.y)};
  } else {
    ptr = {kind:'pan', x0:p.x, y0:p.y, cx0:view.cx, cy0:view.cy, moved:false};
  }
  try{ mapEl.setPointerCapture(e.pointerId); }catch(err){}
});

mapEl.addEventListener('pointermove', (e)=>{
  if(!ptr) return;
  const p = localPt(e);
  const dist = Math.hypot(p.x-ptr.x0, p.y-ptr.y0);
  if(dist>4) ptr.moved = true;
  if(ptr.kind==='reserve' && ptr.moved && ptr.wasSel){   // arrastar só vale com o cabo já selecionado (evita mover sem querer)
    const rl = linkById(ptr.link), rr = rl && rl.reservas && rl.reservas[ptr.idx];
    if(rr){ const sp = snapToLine(rl, toLatLng(p.x,p.y)); rr.pos = [sp.lat, sp.lng]; ptr.dragged = true; renderAll(); }
  } else if(ptr.kind==='mid' && ptr.moved && trace){   // arrastar o "+" cria um ponto novo e passa a arrastá-lo
    const ll0 = toLatLng(p.x,p.y);
    trace.pts.splice(ptr.idx, 0, [ll0.lat, ll0.lng]);
    trace.sel = ptr.idx; trace.dirty = true;
    ptr = {kind:'vertex', idx:ptr.idx, x0:p.x, y0:p.y, moved:true, fresh:true};
    renderAll(); renderTracePanel();
  } else if(ptr.kind==='vertex' && ptr.moved && trace){
    const ll1 = toLatLng(p.x,p.y);
    trace.pts[ptr.idx] = [ll1.lat, ll1.lng]; trace.dirty = true; trace.sel = ptr.idx;
    renderAll();
  } else if(ptr.kind==='pan' && ptr.moved){
    mapEl.classList.add('panning');
    view.cx = ptr.cx0 - (p.x-ptr.x0)/view.scale;
    view.cy = ptr.cy0 - (p.y-ptr.y0)/view.scale;
    renderAll();
  } else if(ptr.kind==='node' && ptr.moved && ptr.id===selectedNodeId){
    const ll = toLatLng(p.x,p.y);
    const n = nodeById(ptr.id);
    n.lat = ll.lat; n.lng = ll.lng;
    renderAll();
  } else if(ptr.kind==='connect'){
    const origin = nodeById(ptr.originId);
    const o = toScreen(origin.lat, origin.lng);
    ptr.snap = snapTargetAt(p.x, p.y, ptr.originId);
    let html = `<line class="mtemp" x1="${o.x}" y1="${o.y}" x2="${p.x}" y2="${p.y}"/>`;
    if(ptr.snap){
      const sn = nodeById(ptr.snap), sp = toScreen(sn.lat,sn.lng);
      const rr = (ICON_SIZE[sn.type]||18)/2+11;
      html += `<circle class="msnap" cx="${sp.x}" cy="${sp.y}" r="${rr}"/>`;
    }
    drawTemp(html);
    connectHint.classList.toggle('show', !!ptr.snap);
  }
});

mapEl.addEventListener('pointerup', (e)=>{
  if(!ptr) return;
  const p = localPt(e);
  const st = ptr; ptr = null;
  mapEl.classList.remove('panning');
  connectHint.classList.remove('show');
  try{ mapEl.releasePointerCapture(e.pointerId); }catch(err){}

  if(st.kind==='connect'){
    drawTemp('');
    if(st.snap) openLinkTypeModal(nodeById(st.originId), nodeById(st.snap));
    else renderAll();
    return;
  }
  if(st.kind==='reserve'){
    const rl = linkById(st.link);
    if(!rl) { renderAll(); return; }
    if(st.dragged){ saveReserves(rl, 'Reserva movida.'); return; }
    const rr = rl.reservas[st.idx];
    onLinkClick(rl.id);
    toast('Reserva técnica «'+(rr.local||'sem local')+'»: '+fmtLength(+rr.m)+' (cabo '+(rl.label||'')+')', 5000);
    return;
  }
  if(mode==='reserving' && reserveMode){
    if(st.moved) return;
    const rl = linkById(reserveMode.linkId);
    if(st.kind!=='link' || st.id!==reserveMode.linkId){ toast('Clique sobre o cabo selecionado para marcar a reserva.'); return; }
    const sp = snapToLine(rl, toLatLng(p.x,p.y));
    if(reserveMode.idx!==null){ rl.reservas[reserveMode.idx].pos = [sp.lat, sp.lng]; const keep = reserveMode; clearMode(); saveReserves(rl, 'Reserva posicionada.'); return; }
    clearMode(); openReserveModal(rl, sp, null);
    return;
  }
  if(trace && (st.kind==='vertex' || st.kind==='mid' || st.kind==='pan')){
    if(st.kind==='vertex'){
      if(!st.moved){
        // duplo toque num ponto remove (o navegador não entrega dblclick porque a tela é redesenhada entre os cliques)
        const now = Date.now();
        if(trace.lastTap && trace.lastTap.idx===st.idx && now-trace.lastTap.t<450){ trace.lastTap = null; traceRemove(st.idx); return; }
        trace.lastTap = {idx:st.idx, t:now};
        trace.sel = (trace.sel===st.idx ? null : st.idx);
      }
      renderAll(); renderTracePanel();
    } else if(st.kind==='mid' && !st.moved){
      const m = traceMidpoint(st.idx); trace.pts.splice(st.idx, 0, m); trace.sel = st.idx; trace.dirty = true;
      renderAll(); renderTracePanel();
    } else if(st.kind==='pan' && !st.moved){
      traceAddAt(toLatLng(p.x,p.y));
    } else { renderAll(); }
    return;
  }
  if(st.moved){
    if(st.kind==='node'){
      const mv = nodeById(st.id);
      if(mv && mv.dbId){
        mapPost('/nos/editar', {id:mv.dbId, lat:mv.lat, lng:mv.lng})
          .then(()=>{ toast('Posição salva.'); })
          .catch(err=>{ toast(err.message); loadNetwork(); });   // recarrega para desfazer o arrasto
      }
    }
    return;
  }

  // clique simples
  clearSearchPin(true);
  if(mode==='placing'){
    openCreateModal(placingType, toLatLng(p.x,p.y));
    return;
  }
  if(st.kind==='node'){ onNodeClick(st.id); return; }
  if(mode==='linking-dest') return;
  if(st.kind==='link'){ onLinkPointClick(st.id, st.ll); return; }
  if(selectedNodeId||selectedLinkId||pathHighlight) closePanel();
});

/* ============================================================
   PAINEL DIREITO — detalhes por tipo
   ============================================================ */
function lifecyclePill(x){
  const lc = lifecycleOf(x);
  return `<span class="status-pill lc-${lc}" style="margin-left:6px;opacity:.85"><span class="d"></span>Situação: ${LIFECYCLE_LABEL[lc]||escapeHtml(lc)}</span>`;
}
function statusPill(status){
  return `<span class="status-pill st-${status}"><span class="d"></span>${STATUS_LABEL[status]||status}</span>`;
}

function onNodeClick(nodeId, opts){
  if(mode==='placing') return; // ignora cliques em nós durante posicionamento
  const target = nodeById(nodeId);
  if(mode==='linking-dest'){
    if(nodeId===linkOrigin.id){ toast('Selecione um nó diferente da origem.'); return; }
    if(!(opts && opts.pick) && isContainer(target) && equipmentOf(target).concat(passivesOf(target)).some(e=>e.id!==linkOrigin.id)){
      openNodePanel(target.id, {picking:true});   // escolher o equipamento de destino (ou o próprio site)
      return;
    }
    openLinkTypeModal(linkOrigin, target);
    return;
  }
  if(isEquipment(target) && target.siteId){
    selectedLinkId = null; selectedNodeId = target.siteId; pathHighlight = null;
    renderAll();
    openNodePanel(target.siteId, {highlight:target.id});
    return;
  }
  if(isPassive(target) && target.boxId){      // passivo não tem painel próprio: abre o do site/caixa pai
    selectedLinkId = null; selectedNodeId = target.boxId; pathHighlight = null;
    renderAll();
    openNodePanel(target.boxId, {highlight:target.id});
    return;
  }
  selectedLinkId = null;
  selectedNodeId = nodeId;
  pathHighlight = null;
  renderAll();
  openNodePanel(nodeId);
}
function onLinkClick(linkId){
  if(mode!=='idle') return;
  selectedNodeId = null;
  selectedLinkId = linkId;
  pathHighlight = null;
  linkPoint = null;
  renderAll();
  openLinkPanel(linkId);
}

/* Clique esquerdo NUM PONTO da fibra: marca o ponto exato e mostra, no
   painel, a fibra e as distâncias até as duas pontas a partir dali — sem
   abrir modal. "Inserir caixa aqui" usa a mesma coordenada, sem perguntar
   posição. */
function onLinkPointClick(linkId, ll){
  if(mode!=='idle') return;
  const l = linkById(linkId); if(!l) return;
  selectedNodeId = null;
  selectedLinkId = linkId;
  pathHighlight = null;
  linkPoint = {linkId, lat:ll.lat, lng:ll.lng};
  renderAll();
  openLinkPointPanel(l, linkPoint);
}

function openLinkPointPanel(l, pt){
  const a = nodeById(l.from), b = nodeById(l.to);
  const cab = cables.find(x=>x.linkId===l.id);
  const al = (l.pathPts && l.pathPts.length) ? alongPath(l, pt) : null;   // cabo com traçado: distância ao longo do traçado
  const dA = al ? al.fromA/1000 : distanciaKm(a, {lat:pt.lat,lng:pt.lng});
  const dB = al ? al.toB/1000 : distanciaKm({lat:pt.lat,lng:pt.lng}, b);
  const panel = document.getElementById('panel-right');
  panel.classList.add('show');
  panel.innerHTML = `
    <div class="panel-head">
      <div class="panel-head-top">
        <div>
          <div class="panel-type-tag">Ponto na fibra</div>
          <div class="panel-title">${escapeHtml(l.label||'Trecho')}</div>
        </div>
        <button class="panel-close" id="panel-close-btn">✕</button>
      </div>
      ${statusPill(l.status)}
    </div>
    <div class="panel-body">
      ${fieldsHtml([
        {label:'Cabo', value: cab ? escapeHtml(cab.nome)+' · '+cab.tipo+' ('+cab.totalFibras+' fibras)' : 'sem cabo documentado', full:true},
        {label:'Até '+escapeHtml(a.name), value: dA.toFixed(3)+' km'},
        {label:'Até '+escapeHtml(b.name), value: dB.toFixed(3)+' km'}
      ])}
      <div class="cable-meta">Distância acumulada até a OLT de origem: ainda não calculada (pendente).</div>
      <div class="action-row">
        <button class="btn" id="btn-sangria-ponto" style="flex:1 1 100%;" disabled title="Disponível em breve">Inserir caixa aqui (sangria) — disponível em breve</button>
        <button class="btn" id="btn-ver-trecho" style="flex:1 1 100%;">Ver detalhes do trecho inteiro</button>
      </div>
    </div>
  `;
  document.getElementById('panel-close-btn').addEventListener('click', closePanel);
  document.getElementById('btn-ver-trecho').addEventListener('click', ()=> onLinkClick(l.id));
}

function closePanel(){
  selectedNodeId=null; selectedLinkId=null; pathHighlight=null; linkPoint=null;
  document.getElementById('panel-right').classList.remove('show');
  document.getElementById('panel-right').innerHTML='';
  renderAll();
}

function openNodePanel(nodeId, opts){
  const n = nodeById(nodeId);
  const panel = document.getElementById('panel-right');
  panel.classList.add('show');

  let body = '';
  if(n.type==='cto') body = renderCTOBody(n);
  else if(n.type==='ceo') body = renderCeoBody(n);
  else if(n.type==='olt') body = renderOLTBody(n);
  else if(n.type==='switch') body = renderSwitchBody(n);
  else if(isContainer(n)) body = renderSiteBody(n, opts||{});
  else if(n.type==='radio') body = renderRadioBody(n);
  else if(n.type==='splitter') body = renderSplitterBody(n);
  else if(n.type==='client') body = renderClientBody(n);

  panel.innerHTML = `
    <div class="panel-head">
      <div class="panel-head-top">
        <div>
          <div class="panel-type-tag">${TYPE_LABEL[n.type]}</div>
          <div class="panel-title">${escapeHtml(n.name)}</div>
        </div>
        <button class="panel-close" id="panel-close-btn">✕</button>
      </div>
      ${statusPill(n.status)}${lifecyclePill(n)}
    </div>
    <div class="panel-body">${body}</div>
  `;
  document.getElementById('panel-close-btn').addEventListener('click', closePanel);
  bindPanelActions(n);
  if(isContainer(n)) bindSitePanel(n, opts||{});
  if(isBox(n)) bindPassives(n, opts||{});
  panel.querySelectorAll('[data-port]').forEach(el=> el.addEventListener('click', ()=> openPortModal(portById(el.getAttribute('data-port')))));
}

function fieldsHtml(fields){

    if(!f) return '';
    return `<div class="field${f.full?' full':''}"><label>${f.label}</label><div class="val${f.big?' big':''}">${f.value}</div></div>`;
  }).join('') + '</div>';
}

function renderOLTBody(n){

      {label:'PONs ativas', value:n.pons.filter(p=>p.onus>0).length+' / '+n.pons.length}

    <div class="section-title">Portas PON</div>

        </div>

function renderSwitchBody(n){
  const children = links.filter(l=>l.from===n.id);

/* ---- passivos (fase 2C): splitter e DIO dentro de um site (POP/torre) ou de uma caixa (CEO/CTO) ---- */
function splitterKind(r){ return SPLITTER_BALANCED.includes(r) ? 'balanceado' : 'desbalanceado'; }
/* "1x8 · balanceado · 1 entrada + 8 saídas" | "10/90 · desbalanceado · 2 saídas (10% e 90%)" | "DIO · 12 portas" */
function passiveSummary(e){
  if(e.type==='dio') return 'DIO · '+(e.capacidade||portsOf(e.id).length)+' portas de fibra';
  const r = e.razao || '—';
  if(!SPLITTER_BALANCED.includes(r) && !SPLITTER_UNBALANCED.includes(r)) return 'Razão não informada';
  return r+' · '+splitterKind(r)+' · '+(SPLITTER_BALANCED.includes(r) ? '1 entrada + '+r.split('x')[1]+' saídas' : '1 entrada + 2 saídas ('+r.split('/').join('% e ')+'%)');
}
function passivePortText(pt){ return pt.label+(pt.role==='spl_out' && pt.percentual!=null ? ' · '+pt.percentual+'%' : ''); }
/* Um splitter/DIO: razão/capacidade, portas (clicáveis) e ações. picking = escolhendo o destino de uma ligação. */
function passiveItemHtml(e, opts){
  opts = opts || {};
  const pts = portsOf(e.id);
  return `<div class="site-eq${opts.highlight===e.id?' hl':''}" data-eq="${e.id}" data-passive="${e.id}">
    <div class="site-eq-head"><b>${escapeHtml(e.name)}</b>${statusPill(e.status)}${lifecyclePill(e)}</div>
    <div class="site-eq-meta">${escapeHtml(passiveSummary(e))}</div>
    ${pts.length ? `<div class="eq-ports">${pts.map(pt=>{
      const tgt = portTarget(pt);
      return `<button class="eq-port${tgt?' occ':''} st-${pt.status}" ${opts.picking?'disabled':`data-port="${pt.id}"`} title="${escapeHtml(passivePortText(pt))} · ${PORT_MEDIA_LABEL[pt.media]||''} · ${pt.external?'externa':'interna'} · ${PORT_STATUS_LABEL[pt.status]||pt.status}">${escapeHtml(passivePortText(pt))} <span class="m">${pt.external?'ext':'int'}</span> ${tgt?'→ '+escapeHtml(tgt.name):'livre'}</button>`;
    }).join('')}</div>` : ''}
    <div class="action-row">${opts.picking
      ? (e.id!==linkOrigin.id ? `<button class="btn btn-sm btn-accent" data-eq-pick="${e.id}">Ligar a este</button>` : '<span class="muted">origem</span>')
      : `<button class="btn btn-sm" data-pas-edit="${e.id}">Editar</button><button class="btn btn-sm" data-pas-link="${e.id}">Conectar</button><button class="btn btn-sm btn-danger" data-pas-del="${e.id}">Excluir</button>`}</div>
  </div>`;
}
/* Seção "Splitters nesta caixa" (CEO/CTO). */
function splittersSectionHtml(box){
  const list = passivesOf(box).filter(x=>x.type==='splitter');
  return `<div class="section-title">Splitters nesta caixa (${list.length})</div>`
    + (list.map(e=>passiveItemHtml(e)).join('') || '<div class="empty-state">Nenhum splitter nesta caixa.</div>')
    + `<div class="site-add"><button class="btn btn-accent btn-sm" id="btn-spl-add">Adicionar splitter</button></div>`;
}
/* Seção de passivos de um POP/torre (splitters e DIOs). */
function sitePassivesHtml(site, opts){
  const list = passivesOf(site);
  if(!list.length) return '';
  return `<div class="section-title">Splitters e DIOs (${list.length})</div>` + list.map(e=>passiveItemHtml(e, opts)).join('');
}
function bindPassives(box, opts){
  const panel = document.getElementById('panel-right');
  const on = (sel, fn)=> panel.querySelectorAll(sel).forEach(el=> el.addEventListener('click', ()=> fn(el)));
  on('[data-pas-edit]', el=> openEditModal(nodeById(el.getAttribute('data-pas-edit'))));
  on('[data-pas-link]', el=> startLinking(nodeById(el.getAttribute('data-pas-link'))));
  on('[data-pas-del]', el=>{
    const e = nodeById(el.getAttribute('data-pas-del'));
    if(e && confirm('Excluir "'+e.name+'"? Só é possível se não tiver ligações.')) deleteNode(e.id);
  });
  const add = document.getElementById('btn-spl-add');
  if(add) add.addEventListener('click', ()=> openCreateModal('splitter', null, {parent:box}));
  if(opts && opts.highlight){
    const el = panel.querySelector(`[data-passive="${opts.highlight}"]`);
    if(el && el.scrollIntoView) el.scrollIntoView({block:'nearest'});
  }
}
/* Campo razão (splitter) ou capacidade (DIO) dos modais; n = nó existente ou null. */
function passiveFieldHtml(type, n){
  if(type==='dio') return `<div class="form-field"><label>Capacidade (portas)</label><select id="f-dio-cap">${DIO_CAPACITIES.map(c=>`<option value="${c}" ${n&&+n.capacidade===c?'selected':''}>${c}</option>`).join('')}</select>
    <div class="cable-meta">Gera DIO 1…n (fibra, internas). Reduzir só remove portas livres.</div></div>`;
  const opt = r=>`<option value="${r}" ${n&&n.razao===r?'selected':''}>${r}</option>`;
  return `<div class="form-field"><label>Razão</label><select id="f-razao"><optgroup label="Balanceado">${SPLITTER_BALANCED.map(opt).join('')}</optgroup><optgroup label="Desbalanceado">${SPLITTER_UNBALANCED.map(opt).join('')}</optgroup></select>
    <div class="cable-meta">Gera 1 entrada + as saídas (no desbalanceado, 2 saídas com o percentual). Trocar a razão regera as portas e só é possível com todas livres.</div></div>`;
}
function passiveAttrs(type){
  return type==='dio' ? {capacidade:parseInt(document.getElementById('f-dio-cap').value,10)} : {razao:document.getElementById('f-razao').value};
}

/* ---- visão do site (POP/Torre): equipamentos agrupados por tipo, com as ligações de cada um ---- */
function renderSiteBody(n, opts){
  const eqs = equipmentOf(n);
  const towers = nodes.filter(x=>x.type==='tower' && x.parentDbId===n.dbId);
  const picking = !!opts.picking;
  let h = fieldsHtml([
    n.type==='pop' ? {label:'IP de gerência', value:escapeHtml(n.ip||'—')} : {label:'Altura', value:escapeHtml(n.altura||'—')},
    {label:'Equipamentos', value:eqs.length},
    {label:'Observação', value:escapeHtml(n.desc||'—'), full:true}
  ]);
  if(picking) h += `<div class="site-pick">Destino da ligação a partir de <b>${escapeHtml(linkOrigin.name)}</b>: escolha um equipamento abaixo ou
      <button class="btn btn-sm" id="btn-pick-site">o próprio ${TYPE_LABEL[n.type]}</button></div>`;
  h += `<div class="section-title">Equipamentos (${eqs.length})</div>`;

  if(!grupos.length) h += '<div class="empty-state">Nenhum equipamento cadastrado neste site.</div>';
  grupos.forEach(([t, lista])=>{
    h += `<div class="site-group"><div class="site-group-title">${TYPE_LABEL[t]} (${lista.length})</div>`;
    lista.forEach(e=>{
      const ls = links.filter(l=>l.from===e.id || l.to===e.id);

      h += `<div class="site-eq${opts.highlight===e.id?' hl':''}" data-eq="${e.id}">

        ${e.type==='olt' ? `<div class="olt-sum" data-olt-sum="${e.id}">${escapeHtml(oltSummaryText(e))}</div>` : ''}
        ${portsOf(e.id).some(pt=>pt.role==='pon') ? `<div class="eq-pons">${portsOf(e.id).filter(pt=>pt.role==='pon').map(pt=>`<div data-pon="${pt.id}"><b>${escapeHtml(pt.label)}</b> · ${ponSummaryHtml(pt)}</div>`).join('')}</div>` : ''}
        ${portsOf(e.id).length ? `<div class="eq-ports">${portsOf(e.id).map(pt=>{
          const tgt = portTarget(pt);
          return `<button class="eq-port${tgt?' occ':''} st-${pt.status}" ${picking?'disabled':`data-port="${pt.id}"`} title="${escapeHtml(pt.label)} · ${PORT_MEDIA_LABEL[pt.media]||''} · ${pt.external?'externa':'interna'} · ${PORT_STATUS_LABEL[pt.status]||pt.status}">${escapeHtml(pt.label)} <span class="m">${PORT_MEDIA_LABEL[pt.media]||''}·${pt.external?'ext':'int'}</span> ${tgt?'→ '+escapeHtml(tgt.name):'livre'}</button>`;

          ? (e.id!==linkOrigin.id ? `<button class="btn btn-sm btn-accent" data-eq-pick="${e.id}">Ligar a este</button>` : '<span class="muted">origem</span>')
          : `<button class="btn btn-sm" data-eq-edit="${e.id}">Editar</button><button class="btn btn-sm" data-eq-link="${e.id}">Conectar</button><button class="btn btn-sm btn-danger" data-eq-del="${e.id}">Excluir</button>`}</div>
      </div>`;
    });
    h += '</div>';
  });
  h += sitePassivesHtml(n, {picking, highlight:opts.highlight});
  if(towers.length){
    h += `<div class="section-title">Torres neste POP</div><div class="port-list">${towers.map(t=>
      `<div class="port-row" data-open-node="${t.id}" style="cursor:pointer"><span class="pd" style="background:${STATUS_COLOR[t.status]||'#8a92a3'}"></span><span class="pl">${escapeHtml(t.name)}</span><span class="pf">${equipmentOf(t).length} equip.</span></div>`).join('')}</div>`;
  }
  if(!picking){
    const tipos = EQUIPMENT_TYPES.concat(PASSIVE_TYPES, n.type==='pop' ? ['tower'] : []);

      <button class="btn btn-accent btn-sm" id="btn-site-add">Adicionar equipamento aqui dentro</button></div>`;

  }
  return h;
}
function bindSitePanel(n, opts){

/* ---- SANGRIA: inserir uma caixa no meio de um trecho existente ----
   O cabo é cortado em dois segmentos no ponto da caixa. Por padrão TODAS as
   fibras ficam passantes (o cabo apenas atravessa a caixa, sem ser tocado).
   Depois, no diagrama, o admin escolhe quais fibras sangrar. */
/* ll (lat/lng do clique) é opcional: quando vem do botão direito na linha, o ponto
   é o do próprio clique. Sem ll (ex.: botão do painel lateral), cai no meio do trecho. */
function abrirSangria(link, ll){
  const a=nodeById(link.from), b=nodeById(link.to);
  const cab = cables.find(x=>x.linkId===link.id);
  const pos = ll || {lat:(a.lat+b.lat)/2, lng:(a.lng+b.lng)/2};
  modalEl.innerHTML = `
    <div class="modal-head"><h3>Inserir caixa no trecho</h3><button class="panel-close" id="modal-x">✕</button></div>
    <div class="modal-body">
      ${fieldsHtml([
        {label:'Trecho', value:escapeHtml(a.name)+' → '+escapeHtml(b.name), full:true},
        {label:'Cabo', value: cab ? escapeHtml(cab.nome)+' · '+cab.tipo : 'sem cabo documentado', full:true},
        {label:'Posição', value: ll ? 'ponto clicado no mapa' : 'meio do trecho (sem ponto exato)', full:true}
      ])}
      <div class="form-field"><label>Tipo de caixa</label>
        <select id="f-sg-tipo"><option value="ceo">CEO (caixa de emenda)</option><option value="cto">CTO</option></select>
      </div>
      <div class="form-field"><label>Nome</label><input id="f-sg-nome" type="text" placeholder="CEO-SANGRIA"></div>
      <div class="form-field" id="f-sg-cap-wrap" style="display:none;"><label>Número de portas</label><input id="f-sg-cap" type="number" min="1" max="144" value="16"></div>
      <div class="form-field"><label>Como entram as fibras</label>
        <select id="f-sg-modo">
          <option value="passante">Passante — cabo só descascado, perda zero (padrão)</option>
          <option value="fusao_massa">Fusão em massa — simula rompimento, todas emendadas já</option>
        </select>
      </div>
      <div class="cable-meta" id="f-sg-modo-hint">Todas as fibras entram como <b>passantes</b>. No diagrama você escolhe quais sangrar — as demais seguem intactas.</div>
    </div>
    <div class="modal-foot"><button class="btn" id="modal-cancel">Cancelar</button>
      <button class="btn btn-accent" id="modal-save">Inserir caixa</button></div>`;
  overlay.classList.add('show');
  const capWrap = document.getElementById('f-sg-cap-wrap');
  const tipoSel = document.getElementById('f-sg-tipo');
  const syncCapField = ()=> capWrap.style.display = (tipoSel.value==='cto') ? '' : 'none';
  syncCapField();
  tipoSel.addEventListener('change', syncCapField);
  const modoSel = document.getElementById('f-sg-modo');
  const hint = document.getElementById('f-sg-modo-hint');
  modoSel.addEventListener('change', ()=>{
    hint.innerHTML = modoSel.value==='fusao_massa'
      ? 'Todas as fibras entram <b>já fusionadas</b> (perda de fusão em cada uma) — use pra registrar um reparo/rompimento já emendado.'
      : 'Todas as fibras entram como <b>passantes</b>. No diagrama você escolhe quais sangrar — as demais seguem intactas.';
  });
  document.getElementById('modal-x').addEventListener('click', closeModal);
  document.getElementById('modal-cancel').addEventListener('click', closeModal);
  document.getElementById('modal-save').addEventListener('click', ()=>{
    const tipo=tipoSel.value;
    const nome=document.getElementById('f-sg-nome').value.trim() ||
      (tipo==='ceo'?'CEO-SANGRIA-':'CTO-SANGRIA-')+(nodes.filter(n=>n.type===tipo).length+1);
    const cap = tipo==='cto' ? Math.max(1, Math.min(144, parseInt(document.getElementById('f-sg-cap').value,10)||16)) : null;
    executarSangria(link, tipo, nome, pos, cap, modoSel.value);
    closeModal();
  });
}

function executarSangria(link, tipoCaixa, nome, pos, capacidade, modoFibra){
  const a=nodeById(link.from), b=nodeById(link.to);
  const cabOrig = cables.find(x=>x.linkId===link.id);
  const lat = pos.lat, lng = pos.lng;

  const caixa = addNode(tipoCaixa, nome, lat, lng, 'normal', {desc:'Inserida por sangria no trecho '+a.name+' → '+b.name});
  if(tipoCaixa==='cto'){
    const cap = capacidade || 16;
    caixa.capacity=cap; caixa.powerIn=-20;
    for(let i=1;i<=cap;i++) addPort(caixa.id,'Porta '+i,'livre');
  }

  const fo = cabOrig ? cabOrig.totalFibras : 12;
  const meta = (sufixo)=> ({nome:(cabOrig?cabOrig.nome:'CABO')+' '+sufixo, tipo:fo+'FO', totalFibras:fo,
                            construtivo: cabOrig?cabOrig.construtivo:undefined});
  const km1 = distanciaKm(a,caixa), km2 = distanciaKm(caixa,b);

  const l1 = addLink(link.type, a, caixa, link.status, {label:a.name+' → '+nome, km:+km1.toFixed(3), cableMeta:meta('(trecho 1)')});
  const l2 = addLink(link.type, caixa, b, link.status, {label:nome+' → '+b.name, km:+km2.toFixed(3), cableMeta:meta('(trecho 2)')});
  const c1 = cables.find(x=>x.linkId===l1.id), c2 = cables.find(x=>x.linkId===l2.id);
  if(c1){ c1.km=+km1.toFixed(3); if(cabOrig) c1.construtivo=cabOrig.construtivo; }
  if(c2){ c2.km=+km2.toFixed(3); if(cabOrig) c2.construtivo=cabOrig.construtivo; }

  // 'passante' (padrão): fibra atravessa sem ser tocada, perda zero — você
  // escolhe depois quais sangrar. 'fusao_massa': simula rompimento — TODAS as
  // fibras já entram fusionadas (perda de fusão em cada uma), como um técnico
  // faria emendando o cabo inteiro de uma vez no reparo.
  const emendaMassa = modoFibra==='fusao_massa' ? 'fusao' : null;
  if(c1&&c2){
    for(let i=1;i<=fo;i++){
      const f1=fiberIn(c1,i), f2=fiberIn(c2,i);
      if(!f1||!f2) continue;
      const cn = addConnection(caixa.id,'passante',{type:'fiber',id:f1.id},{type:'fiber',id:f2.id});
      cn.emenda = emendaMassa;
      const orig = cabOrig ? fiberIn(cabOrig,i) : null;
      const st = orig ? orig.status : 'livre';
      f1.status = st; f2.status = st;
    }
  }

  // o trecho original deixa de existir; as fibras dele também
  if(cabOrig){
    const fids = fiberStrands.filter(f=>f.cableId===cabOrig.id).map(f=>f.id);
    connections = connections.filter(cn=>
      !(cn.origem.type==='fiber'&&fids.includes(cn.origem.id)) &&
      !(cn.destino.type==='fiber'&&fids.includes(cn.destino.id)));
    fiberStrands = fiberStrands.filter(f=>f.cableId!==cabOrig.id);
    cables = cables.filter(x=>x.id!==cabOrig.id);
  }
  links = links.filter(x=>x.id!==link.id);
  if(b.parentLink===link.id){ b.parent=caixa.id; b.parentLink=l2.id; }

  closePanel();
  renderAll();
  toast(nome+' inserida: '+fo+' fibras passantes. Abra o diagrama para sangrar as que precisar.');
  onNodeClick(caixa.id);
}

/* ---- caminho do cliente até a origem ---- */
function showPathForClient(clientNode){
  const nodeIds = new Set(); const linkIds = new Set();
  let cur = clientNode;
  nodeIds.add(cur.id);
  let guard=0;
  while(cur.parent && guard<30){
    linkIds.add(cur.parentLink);
    const parent = nodeById(cur.parent);
    if(!parent) break;
    nodeIds.add(parent.id);
    if(parent.type==='pop') break; // origem alcançada
    cur = parent;
    guard++;
  }
  pathHighlight = {nodeIds, linkIds};
  selectedLinkId = null;
  renderAll();
  toast('Caminho até a origem destacado no mapa.');
}

function deleteNode(nodeId){

    links = links.filter(l=> l.from!==nodeId && l.to!==nodeId);

    .catch(err=> toast(err.message));
}

/* ---- coordenadas na busca: decimal, graus/minutos/segundos e link do Google Maps ---- */
function coordInRange(lat, lng){
  return isFinite(lat) && isFinite(lng) && Math.abs(lat)<=90 && Math.abs(lng)<=180 ? {lat, lng} : null;
}
function parseCoords(raw){
  const q = String(raw||'').trim();
  if(!q) return null;
  // 1) link do Google Maps (ou texto com URL)
  if(/^https?:\/\//i.test(q) || /(google\.[a-z.]+\/maps|goo\.gl|maps\.app)/i.test(q)){
    let u = q; try{ u = decodeURIComponent(q); }catch(e){}
    const N = '(-?\\d{1,3}(?:\\.\\d+)?)';
    const pats = [new RegExp('!3d'+N+'!4d'+N), new RegExp('@'+N+',\\s*'+N), new RegExp('[?&](?:q|ll|query|center|destination)='+'\\+?'+N+',\\s*\\+?'+N)];
    for(const re of pats){ const m = u.match(re); if(m) return coordInRange(parseFloat(m[1]), parseFloat(m[2])); }
    return null;
  }
  // 2) graus/minutos/segundos com hemisfério (N/S/E/W; L = leste, O = oeste)
  const hasHemi = /[NSEWLO]\s*$/i.test(q) || /\d\s*[NSEWLO]\b/i.test(q);
  if(/[°º'′’"″”]/.test(q) || hasHemi){
    const comp = /(\d{1,3}(?:[.,]\d+)?)\s*[°º]?\s*(?:(\d{1,2}(?:[.,]\d+)?)\s*['′’]?\s*(?:(\d{1,2}(?:[.,]\d+)?)\s*(?:''|"|″|”|′′)?)?)?\s*([NSEWLO])(?![A-Za-z])/gi;
    const found = []; let m;
    while((m = comp.exec(q))) found.push(m);
    if(found.length!==2) return null;
    // o que sobra (fora dos dois componentes) só pode ser separador
    const rest = q.replace(comp,'').replace(/[\s,;]+/g,'');
    if(rest) return null;
    const vals = {};
    for(const f of found){
      const num = x=> x===undefined ? 0 : parseFloat(String(x).replace(',','.'));
      const d=num(f[1]), mi=num(f[2]), se=num(f[3]);
      if(mi>=60 || se>=60 || (f[2]!==undefined && /[.,]/.test(f[1]))) return null;
      let v = d + mi/60 + se/3600;
      const h = f[4].toUpperCase();
      const axis = (h==='N'||h==='S') ? 'lat' : 'lng';
      if(axis in vals) return null;
      if(h==='S' || h==='W' || h==='O') v = -v;
      vals[axis] = v;
    }
    return ('lat' in vals && 'lng' in vals) ? coordInRange(vals.lat, vals.lng) : null;
  }
  // 3) decimal
  const n = '[+-]?\\d+(?:[.,]\\d+)?', nd = '[+-]?\\d+(?:\\.\\d+)?';
  let m = q.match(new RegExp('^('+n+')\\s*;\\s*('+n+')$'))                // ponto e vírgula: vírgula decimal ok
       || q.match(new RegExp('^('+n+')\\s+('+n+')$'));                     // espaço: vírgula decimal ok
  if(!m){
    m = q.match(new RegExp('^('+nd+')\\s*,\\s*('+nd+')$'));               // vírgula separadora, ponto decimal
    if(m && !(/\./.test(q) || /,\s/.test(q))) m = null;                    // "-21,5" não é um par
    if(!m){
      m = q.match(/^([+-]?\d+,\d+)\s*,\s+([+-]?\d+,\d+)$/);               // "-21,0025, -42,8375" (decimal brasileiro)
    }
  }
  if(!m) return null;
  return coordInRange(parseFloat(m[1].replace(',','.')), parseFloat(m[2].replace(',','.')));
}
function fmtCoord(v){ return v.toFixed(5); }
function showSearchPin(ll){
  searchPin = {lat:ll.lat, lng:ll.lng};
  document.getElementById('pin-coords').textContent = fmtCoord(ll.lat)+', '+fmtCoord(ll.lng);
  document.getElementById('pin-bar').classList.add('show');
  centerOn(searchPin, Math.max(view.scale, 256*Math.pow(2,17)));

  let htmlOut = '';
  if(coord) htmlOut += `<div class="search-item" data-coord="1"><span>Ir para ${fmtCoord(coord.lat)}, ${fmtCoord(coord.lng)}</span><small>coordenada</small></div>`;
  htmlOut += matches.map(n=>`<div class="search-item" data-id="${n.id}"><span>${escapeHtml(n.name)}</span><small>${TYPE_LABEL[n.type]}${(n.siteId || n.boxId) ? ' · '+escapeHtml(siteOf(n).name) : ''}</small></div>`).join('');
  if(!htmlOut) htmlOut = '<div class="search-item">Nenhum resultado</div>';
  searchResults.innerHTML = htmlOut;
  searchResults.classList.add('show');
  const goItem = searchResults.querySelector('.search-item[data-coord]');

/* Próximo nome da sequência do tipo: PREFIXO-NNN, maior número existente + 1 (001 se não houver). */
function nextNodeName(type){
  const prefix = NAME_PREFIX[type] || String(type).toUpperCase();
  const re = new RegExp('^'+prefix+'-(\\d+)$', 'i');
  let max = 0;
  nodes.forEach(n=>{ if(n.type!==type) return; const m = String(n.name||'').match(re); if(m) max = Math.max(max, parseInt(m[1],10)); });
  return prefix+'-'+String(max+1).padStart(3,'0');
}

/* Distância em linha reta entre dois nós (km) — base para a perda por km.
   Quando existir rota com pontos intermediários, o comprimento vem da rota. */
function distanciaKm(a,b){
  const R=6371, rad=Math.PI/180;
  const dLat=(b.lat-a.lat)*rad, dLng=(b.lng-a.lng)*rad;
  const la1=a.lat*rad, la2=b.lat*rad;
  const h=Math.sin(dLat/2)**2 + Math.cos(la1)*Math.cos(la2)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}

/* ============================================================
   TRAÇADO DO CABO e DISTÂNCIA
   Dados: map_links.path_json = {pontos:[[lat,lng]…], reservas:[{local,m}], folga_pct}. Os pontos são só os
   INTERMEDIÁRIOS: as pontas vêm dos nós (mover uma CTO leva a ponta junto). Sem pontos = linha reta (cabo antigo).
   Fórmula (a mesma de backend/Infrastructure/Map/MapPath.php):
     traçado = soma haversine de [ponta A, …pontos, ponta B];  folga = traçado × folga% (não incide nas reservas);
     total calculado = traçado + folga + reservas;  length_m preenchido = comprimento MANUAL e prevalece.
   ============================================================ */
const EARTH_M = 6371000;
function normalizePath(raw){
  let o = raw;
  if(Array.isArray(o)) o = {pontos:o};
  if(!o || typeof o!=='object') return {pontos:[], reservas:[], folga_pct:null};
  const pontos = (Array.isArray(o.pontos)?o.pontos:[]).filter(q=>Array.isArray(q) && isFinite(+q[0]) && isFinite(+q[1])).map(q=>[+q[0], +q[1]]);
  const reservas = (Array.isArray(o.reservas)?o.reservas:[]).filter(r=>r && isFinite(+r.m)).map(r=>{
    const it = {local:String(r.local||''), m:+r.m};
    if(Array.isArray(r.pos) && r.pos.length===2 && isFinite(+r.pos[0]) && isFinite(+r.pos[1])) it.pos = [+r.pos[0], +r.pos[1]];   // ponto no traçado; sem pos = reserva antiga
    return it;
  });
  const f = o.folga_pct;
  return {pontos, reservas, folga_pct: (f===null||f===undefined||f==='') ? null : +f};
}
function havM(a, b){   // a, b: {lat,lng}
  const rad=Math.PI/180, dLat=(b.lat-a.lat)*rad, dLng=(b.lng-a.lng)*rad;
  const h=Math.sin(dLat/2)**2 + Math.cos(a.lat*rad)*Math.cos(b.lat*rad)*Math.sin(dLng/2)**2;
  return 2*EARTH_M*Math.asin(Math.min(1, Math.sqrt(h)));
}
function slackDefaultPct(){ const v = +mapDefaults['map.cable.slack_pct']; return isFinite(v) ? v : 0; }
/* Comprimento de um cabo hipotético: a, b = nós; d = {pts, reservas, folgaPct, lengthM}. */
function cableLengthOf(a, b, d){
  if(!a || !b || a.lat==null || b.lat==null) return null;
  const pts = d.pts || [];
  const line = [{lat:a.lat,lng:a.lng}].concat(pts.map(q=>({lat:q[0],lng:q[1]})), [{lat:b.lat,lng:b.lng}]);
  let traceM = 0; for(let i=1;i<line.length;i++) traceM += havM(line[i-1], line[i]);
  const slackPct = (d.folgaPct===null || d.folgaPct===undefined) ? slackDefaultPct() : +d.folgaPct;
  const slackM = traceM*slackPct/100;
  const reservesM = (d.reservas||[]).reduce((t,r)=>t+(+r.m||0), 0);
  const calcM = traceM+slackM+reservesM;
  const manual = d.lengthM!==null && d.lengthM!==undefined && d.lengthM!=='';
  return {traceM, slackPct, slackM, reservesM, calcM, manual, totalM: manual ? +d.lengthM : calcM, hasPath: pts.length>0, line};
}
function cableLength(l, ptsOverride){
  return cableLengthOf(nodeById(l.from), nodeById(l.to), {pts: ptsOverride || l.pathPts, reservas:l.reservas, folgaPct:l.folgaPct, lengthM:l.lengthM});
}
function fmtLength(m){ return m>=1000 ? (m/1000).toFixed(2).replace('.',',')+' km' : Math.round(m)+' m'; }
function linkLengthText(l){
  const c = cableLength(l); if(!c) return '—';
  if(c.manual) return fmtLength(c.totalM)+' (manual)';
  if(c.hasPath || c.reservesM>0 || c.slackPct>0) return fmtLength(c.totalM)+' (traçado + folga + reservas)';
  return '≈ '+fmtLength(c.traceM)+', linha reta';
}
/* Traçado, folga, reservas e total em separado (painel do trecho e do editor de traçado). */
function lengthDetailHtml(c){
  if(!c) return '—';
  const rows = [
    [c.hasPath ? 'Traçado' : 'Linha reta (sem traçado)', fmtLength(c.traceM)],
    ['Folga '+String(c.slackPct).replace('.',',')+' %', '+ '+fmtLength(c.slackM)],
    ['Reservas técnicas', '+ '+fmtLength(c.reservesM)],
    [c.manual ? 'Total calculado' : 'Total', fmtLength(c.calcM)]
  ];
  let html = '<table class="len-detail" style="width:100%;border-collapse:collapse;font-size:12px">'+rows.map((r,i)=>
    `<tr${i===3?' style="font-weight:700;border-top:1px solid var(--border,#2a3140)"':''}><td>${r[0]}</td><td style="text-align:right">${r[1]}</td></tr>`).join('')+'</table>';
  if(c.manual) html += `<div style="margin-top:6px;font-weight:700">Comprimento: ${fmtLength(c.totalM)} <span class="lk-detail">manual</span></div><div class="cable-meta">O valor informado à mão prevalece sobre o calculado. Apague-o no editor do trecho para voltar ao calculado.</div>`;
  return html;
}
function linkLengthDetailHtml(l){ return lengthDetailHtml(cableLength(l)); }
function buildPathString(pts, reservas, folgaPct){
  const hasF = folgaPct!==null && folgaPct!==undefined && folgaPct!=='' && isFinite(+folgaPct);
  if(!(pts||[]).length && !(reservas||[]).length && !hasF) return '';
  const o = {pontos:(pts||[]).map(q=>[+(+q[0]).toFixed(6), +(+q[1]).toFixed(6)]), reservas:(reservas||[]).map(r=>{ const it = {local:r.local, m:+r.m}; if(r.pos) it.pos = [+(+r.pos[0]).toFixed(6), +(+r.pos[1]).toFixed(6)]; return it; })};
  if(hasF) o.folga_pct = +folgaPct;
  return JSON.stringify(o);
}
/* Distância ao longo do traçado de um ponto clicado até as pontas (projeção local em metros). */
function alongPath(l, ll){
  const c = cableLength(l); if(!c) return null;
  const kx = 111320*Math.cos(ll.lat*Math.PI/180), ky = 110540;
  let best = {d:Infinity, along:0}, acc = 0;
  for(let i=1;i<c.line.length;i++){
    const A=c.line[i-1], B=c.line[i], segM = havM(A,B);
    const ax=A.lng*kx, ay=A.lat*ky, bx=B.lng*kx, by=B.lat*ky, px=ll.lng*kx, py=ll.lat*ky;
    const dx=bx-ax, dy=by-ay, len2=dx*dx+dy*dy;
    const t = len2>0 ? Math.max(0, Math.min(1, ((px-ax)*dx+(py-ay)*dy)/len2)) : 0;
    const dist = Math.hypot(px-(ax+t*dx), py-(ay+t*dy));
    if(dist<best.d) best = {d:dist, along:acc+segM*t};
    acc += segM;
  }
  return {fromA:best.along, toB:c.traceM-best.along};
}

/* ---- reservas técnicas como pontos no mapa ----
   Cada reserva (path_json.reservas[i]) pode ter pos=[lat,lng], sempre encaixada no traçado do cabo. Sem pos (reservas antigas) ela
   continua somando no total e aparece como "sem posição" no painel, com o botão Posicionar. */
function snapToLine(l, ll){
  const c = cableLength(l); if(!c) return {lat:ll.lat, lng:ll.lng};
  const kx = 111320*Math.cos(ll.lat*Math.PI/180), ky = 110540;
  let best = null;
  for(let i=1;i<c.line.length;i++){
    const A=c.line[i-1], B=c.line[i];
    const ax=A.lng*kx, ay=A.lat*ky, bx=B.lng*kx, by=B.lat*ky, px=ll.lng*kx, py=ll.lat*ky;
    const dx=bx-ax, dy=by-ay, len2=dx*dx+dy*dy;
    const t = len2>0 ? Math.max(0, Math.min(1, ((px-ax)*dx+(py-ay)*dy)/len2)) : 0;
    const d = Math.hypot(px-(ax+t*dx), py-(ay+t*dy));
    if(!best || d<best.d) best = {d, lat:A.lat+(B.lat-A.lat)*t, lng:A.lng+(B.lng-A.lng)*t};
  }
  return best ? {lat:+best.lat.toFixed(6), lng:+best.lng.toFixed(6)} : {lat:ll.lat, lng:ll.lng};
}

/* ---- edição do traçado: arrastar, adicionar, remover pontos; desenhar clicando pela rota ----
   trace = {linkId|null, from, to (ids dos nós), pts, sel, dirty, snap, routing, reservas, folgaPct, lengthM, title, onSave, onCancel}.
   Enquanto a edição está aberta nada é gravado; "Salvar traçado" grava (cabo existente) ou devolve os pontos ao modal de novo trecho. */
function startTrace(cfg){
  closeModal();
  selectedNodeId = null; pathHighlight = null; linkPoint = null;
  trace = Object.assign({linkId:null, pts:[], sel:null, dirty:false, snap:false, routing:false, reservas:[], folgaPct:null, lengthM:null}, cfg);
  trace.pts = trace.pts.map(q=>[q[0], q[1]]);
  mode = 'tracing';
  mapEl.classList.add('crosshair');
  setModeBanner('Editando o traçado: clique no mapa para acrescentar pontos · arraste para mover · Esc cancela');
  if(trace.linkId) selectedLinkId = trace.linkId;
  renderAll(); renderTracePanel();
}
function endTrace(){   // sem chamar onCancel
  trace = null; mode = 'idle';
  document.getElementById('mode-banner').classList.remove('show');
  mapEl.classList.remove('crosshair');
}
function traceEnds(){ return [nodeById(trace.from), nodeById(trace.to)]; }
function traceLine(){ const [a,b] = traceEnds(); return [a].concat(trace.pts.map(q=>({lat:q[0],lng:q[1]})), [b]); }
function traceMidpoint(i){   // ponto médio do segmento i (entre line[i] e line[i+1])
  const L = traceLine(); return [(L[i].lat+L[i+1].lat)/2, (L[i].lng+L[i+1].lng)/2];
}
function traceAddAt(ll){
  if(!trace) return;
  if(trace.snap){ traceFollowStreet(ll); return; }
  trace.pts.push([ll.lat, ll.lng]); trace.sel = trace.pts.length-1; trace.dirty = true;
  renderAll(); renderTracePanel();
}
function traceRemove(i){
  if(!trace || i==null || i<0 || i>=trace.pts.length) return;
  trace.pts.splice(i,1); trace.sel = null; trace.dirty = true;
  renderAll(); renderTracePanel();
}
function renderTraceUnder(parts){
  if(trace.linkId) return;   // cabo existente: o próprio cabo já é desenhado com trace.pts
  const pts = traceLine().map(q=>{ const sp = toScreen(q.lat,q.lng); return sp.x.toFixed(1)+','+sp.y.toFixed(1); }).join(' ');
  parts.push(`<polyline class="mtrace" points="${pts}"/>`);
}
function renderTraceOver(parts){
  const L = traceLine(), S = L.map(q=>toScreen(q.lat,q.lng));
  for(let i=0;i<S.length-1;i++){
    if(Math.hypot(S[i+1].x-S[i].x, S[i+1].y-S[i].y) < 28) continue;
    parts.push(`<circle class="mmid" data-mi="${i}" cx="${((S[i].x+S[i+1].x)/2).toFixed(1)}" cy="${((S[i].y+S[i+1].y)/2).toFixed(1)}" r="5"><title>Clique ou arraste para criar um ponto aqui</title></circle>`);
  }
  trace.pts.forEach((q,i)=>{ const sp = toScreen(q[0],q[1]);
    parts.push(`<circle class="mvertex${trace.sel===i?' sel':''}" data-vi="${i}" cx="${sp.x.toFixed(1)}" cy="${sp.y.toFixed(1)}" r="7"><title>Arraste para mover · duplo clique ou botão direito remove</title></circle>`); });
}
function renderTracePanel(){
  if(!trace) return;
  const [a,b] = traceEnds();
  const c = cableLengthOf(a, b, {pts:trace.pts, reservas:trace.reservas, folgaPct:trace.folgaPct, lengthM:trace.lengthM});
  const panel = document.getElementById('panel-right');
  panel.classList.add('show');
  panel.innerHTML = `
    <div class="panel-head"><div class="panel-head-top"><div><div class="panel-type-tag">Traçado do cabo</div>
      <div class="panel-title">${escapeHtml(trace.title||((a?a.name:'?')+' → '+(b?b.name:'?')))}</div></div></div></div>
    <div class="panel-body trace-panel">
      <div class="cable-meta">${trace.pts.length} ponto(s) intermediário(s). Clique no mapa para acrescentar ao fim; arraste um ponto para movê-lo; clique ou arraste o "+" de um segmento para criar um ponto no meio; duplo clique ou botão direito num ponto o remove.</div>
      <div id="trace-len" data-trace-len>${lengthDetailHtml(c)}</div>
      <div class="action-row">
        <button class="btn${trace.snap?' btn-accent':''}" id="tr-snap">Seguir rua ao clicar: ${trace.snap?'ligado':'desligado'}</button>
        <button class="btn" id="tr-route-end">Seguir rua até o destino</button>
        <button class="btn" id="tr-remove" ${trace.sel==null?'disabled':''}>Remover ponto selecionado</button>
        <button class="btn" id="tr-undo" ${trace.pts.length?'':'disabled'}>Desfazer último ponto</button>
        <button class="btn" id="tr-clear" ${trace.pts.length?'':'disabled'}>Limpar traçado (linha reta)</button>
        <button class="btn btn-accent" id="tr-save">${trace.linkId?'Salvar traçado':'Concluir traçado'}</button>
        <button class="btn" id="tr-cancel">Cancelar</button>
      </div>
      <div class="cable-meta" id="tr-msg"></div>
    </div>`;
  document.getElementById('tr-snap').addEventListener('click', ()=>{ trace.snap = !trace.snap; renderTracePanel(); });
  document.getElementById('tr-route-end').addEventListener('click', ()=>{ const [, bb] = traceEnds(); traceFollowStreet({lat:bb.lat, lng:bb.lng}, true); });
  document.getElementById('tr-remove').addEventListener('click', ()=> traceRemove(trace.sel));
  document.getElementById('tr-undo').addEventListener('click', ()=>{ trace.pts.pop(); trace.sel = null; trace.dirty = true; renderAll(); renderTracePanel(); });
  document.getElementById('tr-clear').addEventListener('click', ()=>{ trace.pts = []; trace.sel = null; trace.dirty = true; renderAll(); renderTracePanel(); });
  document.getElementById('tr-cancel').addEventListener('click', ()=> clearMode());
  document.getElementById('tr-save').addEventListener('click', ()=>{ const t = trace; if(typeof t.onSave==='function') t.onSave(t.pts.map(q=>[q[0],q[1]]), t); });
}
/* "Seguir rua": pede ao servidor (proxy do OSRM configurado) a rota entre o último ponto e o clique; o resultado
   vira pontos comuns, editáveis. Sem serviço configurado ou com falha, a tela segue no modo manual (ponto simples). */
let routeBusy = false;
function traceFollowStreet(ll, toDestination){
  const [a] = traceEnds();
  const last = trace.pts.length ? {lat:trace.pts[trace.pts.length-1][0], lng:trace.pts[trace.pts.length-1][1]} : {lat:a.lat, lng:a.lng};
  const manual = (why)=>{
    if(!toDestination){ trace.pts.push([ll.lat, ll.lng]); trace.sel = trace.pts.length-1; trace.dirty = true; }
    renderAll(); renderTracePanel();
    const m = document.getElementById('tr-msg'); if(m && why) m.textContent = why;
    if(why) toast(why, 4500);
  };
  if(routeBusy){ toast('Aguarde a rota anterior terminar.'); return; }
  routeBusy = true;
  const t0 = trace;
  mapPost('/rota', {from_lat:last.lat, from_lng:last.lng, to_lat:ll.lat, to_lng:ll.lng}).then(data=>{
    routeBusy = false;
    if(trace!==t0) return;
    let pts = (data.pontos||[]).map(q=>[+q[0], +q[1]]).filter(q=>isFinite(q[0])&&isFinite(q[1]));
    if(toDestination) pts = pts.slice(0, -1);   // o destino é o próprio nó
    if(!pts.length){ manual('A rota não trouxe pontos: use o modo manual.'); return; }
    pts.forEach(q=>trace.pts.push(q)); trace.sel = null; trace.dirty = true;
    renderAll(); renderTracePanel();
    const m = document.getElementById('tr-msg'); if(m) m.textContent = pts.length+' ponto(s) seguindo a rua. Ajuste o que precisar: são pontos comuns.';
  }).catch(err=>{
    routeBusy = false;
    if(trace!==t0) return;
    manual((err && err.message ? err.message : 'Serviço de rotas indisponível.') + (toDestination ? '' : ' Ponto adicionado em linha reta.'));
  });
}
function openTraceForLink(l){
  if(!l.dbId){ toast('Trecho ainda não salvo. Recarregue o mapa.'); return; }
  startTrace({linkId:l.id, from:l.from, to:l.to, pts:l.pathPts||[], reservas:l.reservas||[], folgaPct:l.folgaPct, lengthM:l.lengthM, title:l.label||'Trecho',
    onSave:(pts)=>{
      mapPost('/links/editar', {id:l.dbId, path:buildPathString(pts, l.reservas, l.folgaPct)}).then(data=>{
        endTrace();
        loadNetwork(()=>{
          const again = links.find(x=>x.dbId===l.dbId);
          if(again) onLinkClick(again.id);
          toastResult(pts.length ? 'Traçado salvo ('+pts.length+' ponto(s)).' : 'Traçado removido: o cabo voltou a ser linha reta.', data);
        });
      }).catch(err=> toast(err.message));
    },
    onCancel:()=>{ closePanel(); toast('Edição do traçado cancelada.'); }});
}

/* ---- editor de reservas técnicas + folga (usado no novo trecho e na edição) ---- */
function reservaRowHtml(r){
  return `<div class="rs-row"${r.pos?` data-pos="${escapeHtml(r.pos[0]+','+r.pos[1])}"`:''}><input class="rs-local" type="text" maxlength="60" placeholder="Local (ex.: CTO-A, poste 12)" value="${escapeHtml(r.local||'')}"><input class="rs-m" type="number" min="0" max="10000" step="0.1" placeholder="m" value="${r.m!=null?escapeHtml(r.m):''}"><button type="button" class="btn btn-sm rs-del" title="Remover reserva">✕</button></div>`;
}
function reservasEditorHtml(reservas, folgaPct){
  return `<div class="form-field"><label>Reservas técnicas (local e metros)</label>
      <div id="f-rs-rows">${(reservas||[]).map(reservaRowHtml).join('')}</div>
      <button type="button" class="btn btn-sm" id="f-rs-add">+ Reserva</button>
      <div class="cable-meta">As reservas somam ao comprimento (laços/sobras de cabo) e ficam separadas do traçado.</div></div>
    <div class="form-field"><label>Folga sobre o traçado (%)</label>
      <input id="f-folga" type="number" min="0" max="100" step="0.1" value="${folgaPct!=null?escapeHtml(folgaPct):''}" placeholder="vazio = padrão da rede (${String(slackDefaultPct()).replace('.',',')} %)">
      <div class="cable-meta">Cobre curvas e flechas que o traçado não mostra. Não incide sobre as reservas.</div></div>`;
}
function bindReservasEditor(){
  const rows = document.getElementById('f-rs-rows');
  document.getElementById('f-rs-add').addEventListener('click', ()=>{ rows.insertAdjacentHTML('beforeend', reservaRowHtml({local:'', m:null})); });
  rows.addEventListener('click', (e)=>{ const b = e.target.closest ? e.target.closest('.rs-del') : null; if(b) b.parentNode.remove(); });
}
/* Lê o editor: {reservas, folgaPct} ou {error}. Linha vazia é ignorada. */
function readReservasEditor(){
  const reservas = [];
  const rows = document.querySelectorAll('#f-rs-rows .rs-row');
  for(const r of rows){
    const local = r.querySelector('.rs-local').value.trim(), raw = r.querySelector('.rs-m').value.trim();
    if(!local && raw==='') continue;
    const m = Number(raw.replace(',','.'));
    if(raw==='' || !isFinite(m) || m<0 || m>10000) return {error:'Reserva técnica: informe metros entre 0 e 10000'+(local?' ('+local+')':'')+'.'};
    const it = {local, m:Math.round(m*100)/100};
    const ps = (r.getAttribute('data-pos')||'').split(',').map(Number);
    if(ps.length===2 && isFinite(ps[0]) && isFinite(ps[1])) it.pos = ps;   // a posição no mapa sobrevive à edição dos metros/local
    reservas.push(it);
  }
  const fr = document.getElementById('f-folga').value.trim().replace(',','.');
  let folgaPct = null;
  if(fr!==''){ folgaPct = Number(fr); if(!isFinite(folgaPct) || folgaPct<0 || folgaPct>100) return {error:'Folga: informe um valor entre 0 e 100 %.'}; }
  return {reservas, folgaPct};
}

  traceInfo();
  bindReservasEditor();

  function atualizaCampos(){

/* ---- editar / excluir trecho (grava no servidor; tipo, origem e destino não mudam) ---- */
function openLinkEditModal(l){
  const fibra = l.medium==='fibra' || ['backbone','distribuicao','drop'].includes(l.type);
  const construtivos = ['AS (auto-sustentado)','Drop','Espinado','Subterrâneo'];

    <div class="modal-head"><h3>Editar trecho</h3><button class="panel-close" id="modal-x">✕</button></div>
    <div class="modal-body">
      <div class="cable-meta">${escapeHtml(LINK_TYPE_LABEL[l.type]||l.type)} · o tipo não muda; cada ponta só pode ir para outro elemento do mesmo site.</div>
      <div class="form-field"><label>Origem (envia)</label><select id="f-lk-from"></select></div>
      <div class="form-field"><label>Destino (recebe)</label><select id="f-lk-to"></select></div>

  function fillPorts(){
    const a2 = nodeById(ends.from.sel), b2 = nodeById(ends.to.sel), internal = sameSiteNodes(a2, b2);
    document.getElementById('f-lk-ports').innerHTML =
      portSelectHtml('f-lk-port-from', a2, l.type, internal, ends.from.port, l.id) + portSelectHtml('f-lk-port-to', b2, l.type, internal, ends.to.port, l.id);
    [['f-lk-port-from', ends.from], ['f-lk-port-to', ends.to]].forEach(([id, e])=>{
      const el = document.getElementById(id); if(el) el.addEventListener('change', ()=>{ e.port = el.value || null; });
    });

  function fillEnds(){

  selFrom.addEventListener('change', ()=>{ ends.from.sel = selFrom.value; ends.from.port = null; fillPorts(); });

    if(rs.error){ toast(rs.error); return; }
    const fields = {id:l.dbId, from_node_id:nodeById(ends.from.sel).dbId, to_node_id:nodeById(ends.to.sel).dbId,
