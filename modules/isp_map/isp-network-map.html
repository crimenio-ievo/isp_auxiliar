<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ISP MAP — Gerenciamento de Rede</title>
<style>
:root{
  --bg-app:#0a0d12;
  --bg-panel:#11151c;
  --bg-panel-alt:#161b23;
  --bg-input:#0d1117;
  --border:#232a35;
  --border-soft:#1a1f28;
  --text:#c7d1dc;
  --text-dim:#7c8798;
  --text-faint:#4d5666;
  --accent:#4fd1c5;
  --accent-dim:#2a6e68;
  --green:#3fb950;
  --yellow:#d29922;
  --red:#f85149;
  --gray:#6e7681;
  --font-ui: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-mono: "SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;background:var(--bg-app);color:var(--text);font-family:var(--font-ui);font-size:12.5px;overflow:hidden;}
button{font-family:inherit;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#2a3140;border-radius:4px;}

#app{display:grid;grid-template-rows:40px 1fr;height:100vh;width:100vw;}

/* ===== TOPBAR ===== */
#topbar{
  display:flex;align-items:center;gap:14px;
  background:var(--bg-panel);border-bottom:1px solid var(--border);
  padding:0 12px;position:relative;z-index:1200;
}
.brand{display:flex;align-items:center;gap:7px;font-weight:700;letter-spacing:.4px;font-size:13px;color:#e6edf3;white-space:nowrap;}
.brand .dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green);}
.kpis{display:flex;gap:2px;align-items:center;}
.kpi{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:2px 10px;border-right:1px solid var(--border-soft);min-width:52px;cursor:default;
}
.kpi:last-child{border-right:none;}
.kpi b{font-size:13px;font-weight:700;color:#e6edf3;line-height:1.1;font-family:var(--font-mono);}
.kpi span{font-size:9px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.5px;}
.kpi.alert b{color:var(--yellow);}
.topbar-search{position:relative;flex:1;max-width:320px;margin-left:auto;}
.topbar-search input{
  width:100%;background:var(--bg-input);border:1px solid var(--border);color:var(--text);
  padding:6px 10px 6px 26px;border-radius:4px;font-size:12px;outline:none;
}
.topbar-search input:focus{border-color:var(--accent-dim);}
.topbar-search svg{position:absolute;left:7px;top:50%;transform:translateY(-50%);width:13px;height:13px;stroke:var(--text-dim);pointer-events:none;}
.search-results{
  position:absolute;top:32px;left:0;right:0;background:var(--bg-panel-alt);border:1px solid var(--border);
  border-radius:4px;max-height:260px;overflow-y:auto;display:none;box-shadow:0 8px 24px rgba(0,0,0,.5);
}
.search-results.show{display:block;}
.search-item{padding:7px 10px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--border-soft);}
.search-item:hover{background:#1c232e;}
.search-item small{color:var(--text-dim);font-family:var(--font-mono);}

.btn{
  background:var(--bg-input);border:1px solid var(--border);color:var(--text);
  padding:6px 11px;border-radius:4px;cursor:pointer;font-size:11.5px;font-weight:600;
  display:flex;align-items:center;gap:6px;white-space:nowrap;transition:border-color .1s;
}
.btn:hover{border-color:#3a4354;}
.btn-accent{background:var(--accent);border-color:var(--accent);color:#04211f;}
.btn-accent:hover{background:#66d9cf;}
.btn-danger{color:var(--red);}
.btn-ghost{background:transparent;border-color:transparent;}
.btn-ghost:hover{background:var(--bg-panel-alt);}
.btn-sm{padding:4px 8px;font-size:10.5px;}
.btn:disabled{opacity:.4;cursor:not-allowed;}

/* ===== BODY LAYOUT ===== */
#body{display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:1fr;height:100%;min-height:0;position:relative;}

/* ===== LEFT SIDEBAR ===== */
#sidebar-left{
  width:190px;background:var(--bg-panel);border-right:1px solid var(--border);
  display:flex;flex-direction:column;transition:width .15s;overflow:hidden;
}
#sidebar-left.collapsed{width:34px;}
.sb-header{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-bottom:1px solid var(--border-soft);flex-shrink:0;}
.sb-header span{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--text-dim);font-weight:700;}
#sidebar-left.collapsed .sb-header span,
#sidebar-left.collapsed .sb-section{display:none;}
.sb-toggle{cursor:pointer;color:var(--text-dim);background:none;border:none;padding:4px;display:flex;}
.sb-toggle:hover{color:var(--text);}
.sb-content{overflow-y:auto;flex:1;padding:6px 0;}
.sb-section{padding:4px 10px 12px;border-bottom:1px solid var(--border-soft);}
.sb-section h4{margin:2px 0 6px;font-size:9.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--text-faint);font-weight:700;}
.layer-row{display:flex;align-items:center;gap:7px;padding:4px 2px;border-radius:3px;cursor:pointer;user-select:none;}
.layer-row:hover{background:var(--bg-panel-alt);}
.layer-row input{accent-color:var(--accent);width:12px;height:12px;}
.layer-row .swatch{width:9px;height:9px;border-radius:2px;flex-shrink:0;}
.layer-row label{flex:1;cursor:pointer;font-size:11.5px;color:var(--text);}
.layer-row .count{font-family:var(--font-mono);color:var(--text-faint);font-size:10px;}

/* ===== MAP ===== */
#map-wrap{position:relative;min-width:0;height:100%;min-height:0;}
#map{width:100%;height:100%;background:#0b0e13;}
#map{position:relative;overflow:hidden;cursor:grab;
  background:
    linear-gradient(rgba(79,209,197,.045) 1px,transparent 1px) 0 0/34px 34px,
    linear-gradient(90deg,rgba(79,209,197,.045) 1px,transparent 1px) 0 0/34px 34px,
    #0b0e13;
}
#map.panning{cursor:grabbing;}
#map.crosshair{cursor:crosshair;}
#map svg{display:block;user-select:none;}
.mlink{stroke-linecap:round;cursor:pointer;}
.mlink-hit{stroke:transparent;stroke-width:14;fill:none;cursor:pointer;}
.mnode{cursor:pointer;}
.mnode-hit{fill:transparent;}
.mlabel{fill:#dbe4ee;font-size:9.5px;font-family:var(--font-mono);pointer-events:none;}
.mlabel.dim{opacity:.15;}
.mhandle{fill:#4fd1c5;stroke:#04211f;stroke-width:2;cursor:crosshair;}
.mhandle:hover{fill:#8be9e0;}
.msnap{fill:none;stroke:#4fd1c5;stroke-width:3;}
.mtemp{stroke:#4fd1c5;stroke-width:2.5;stroke-dasharray:5,4;fill:none;pointer-events:none;}
.mtrace{fill:none;stroke:#4fd1c5;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;pointer-events:none;}
.mvertex{fill:#fff;stroke:#0b6b63;stroke-width:2.5;cursor:grab;}
.mvertex.sel{fill:#4fd1c5;stroke:#04211f;}
.mmid{fill:#4fd1c5;fill-opacity:.55;stroke:#04211f;stroke-width:1.5;cursor:copy;}
.mmid:hover{fill-opacity:1;}
.trace-panel .action-row .btn{flex:1 1 100%;white-space:normal;}
.mreserve{cursor:pointer;}
.mreserve .rs-bg{fill:#f5b942;stroke:#2b1d00;stroke-width:2;}
.mreserve .rs-ic{fill:none;stroke:#2b1d00;stroke-width:1.8;stroke-linecap:round;pointer-events:none;}
.mreserve.sel .rs-bg{fill:#ffd978;stroke:#fff;}
.mreserve.drag{cursor:grabbing;}
.rs-row{display:flex;gap:6px;margin-bottom:6px;}
.rs-row .rs-local{flex:1 1 auto;min-width:0;}
.rs-row .rs-m{flex:0 0 84px;}
.map-zoom{position:absolute;right:10px;bottom:36px;z-index:700;display:flex;flex-direction:column;gap:4px;}
.map-zoom button{
  width:30px;height:30px;border-radius:5px;border:1px solid var(--border);
  background:rgba(17,21,28,.94);color:var(--text);font-size:16px;font-weight:700;cursor:pointer;line-height:1;
}
.map-zoom button:hover{border-color:var(--accent-dim);color:#fff;}

#mode-banner{
  position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:900;
  background:var(--accent);color:#04211f;padding:6px 14px;border-radius:5px;font-weight:700;font-size:11.5px;
  display:none;align-items:center;gap:10px;box-shadow:0 4px 14px rgba(0,0,0,.4);
}
#mode-banner.show{display:flex;}
#mode-banner button{background:rgba(0,0,0,.15);border:none;color:#04211f;border-radius:3px;padding:2px 8px;cursor:pointer;font-weight:700;font-size:10.5px;}

.map-legend{
  position:absolute;bottom:10px;left:10px;z-index:600;background:rgba(17,21,28,.92);border:1px solid var(--border);
  border-radius:5px;padding:8px 10px;font-size:10.5px;color:var(--text-dim);display:flex;gap:12px;
}
.map-legend .lg-item{display:flex;align-items:center;gap:5px;}
.map-legend .lg-dot{width:8px;height:8px;border-radius:50%;}

.map-attrib{position:absolute;bottom:10px;right:10px;z-index:600;font-size:9.5px;color:var(--text-faint);background:rgba(17,21,28,.7);padding:2px 6px;border-radius:3px;}
.map-fit-btn{position:absolute;top:10px;right:10px;z-index:700;background:rgba(17,21,28,.94);}
.map-basemap{position:absolute;top:10px;right:150px;z-index:700;}
.map-basemap select{
  background:rgba(17,21,28,.94);border:1px solid var(--border);color:var(--text);
  border-radius:4px;padding:6px 8px;font-size:11.5px;font-family:inherit;outline:none;cursor:pointer;
}
.map-basemap select:focus{border-color:var(--accent-dim);}
.mtile{image-rendering:auto;}
#map.has-tiles{background:#0b0e13;}
.tile-warning{
  position:absolute;bottom:34px;left:50%;transform:translateX(-50%);z-index:700;
  background:rgba(210,153,34,.14);border:1px solid rgba(210,153,34,.35);color:#e8c874;
  padding:6px 12px;border-radius:5px;font-size:11px;display:none;max-width:420px;text-align:center;line-height:1.45;
}
.tile-warning.show{display:block;}

/* custom leaflet icon wrapper */
.node-icon{display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--bg-panel);cursor:pointer;transition:transform .1s;}
.node-icon:hover{transform:scale(1.12);}
.node-icon.dimmed{opacity:.18;}
.node-icon.selected{box-shadow:0 0 0 3px rgba(79,209,197,.55);}
.node-icon svg{width:62%;height:62%;}
.node-label{
  font-size:9.5px;color:#dbe4ee;background:rgba(10,13,18,.72);padding:0 4px;border-radius:2px;
  white-space:nowrap;font-family:var(--font-mono);pointer-events:none;
}
.node-label.dimmed{opacity:.15;}

/* ===== CONNECTOR HANDLES (drag-to-link) ===== */
.connector-handle{
  position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;
  background:var(--accent);border:2px solid #04211f;cursor:crosshair;z-index:750;
  box-shadow:0 0 0 3px rgba(79,209,197,.25);pointer-events:auto;
}
.connector-handle:hover{background:#8be9e0;transform:scale(1.15);}
#connector-drag-svg{position:absolute;inset:0;pointer-events:none;z-index:740;display:none;}
#connector-drag-svg.active{display:block;}
#connector-drag-svg line{stroke:var(--accent);stroke-width:2.5;stroke-dasharray:5,4;}
.node-icon.snap-target{box-shadow:0 0 0 4px rgba(79,209,197,.85),0 0 16px 4px rgba(79,209,197,.6)!important;transform:scale(1.2);}
.connect-hint{
  position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:900;
  background:#04211f;color:var(--accent);border:1px solid var(--accent-dim);padding:4px 12px;
  border-radius:5px;font-size:10.5px;font-weight:600;display:none;pointer-events:none;
}
.connect-hint.show{display:block;}

/* ===== DIAGRAMA UNIFILAR (nível 2) ===== */
.diagram-overlay{position:fixed;inset:0;background:var(--bg-app);z-index:2500;display:none;flex-direction:column;}
.diagram-overlay.show{display:flex;}
.diagram-head{
  display:flex;align-items:center;justify-content:space-between;padding:10px 16px;
  border-bottom:1px solid var(--border);background:var(--bg-panel);flex-shrink:0;
}
.diagram-eyebrow{font-size:9.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--accent);font-weight:700;}
.diagram-title{font-size:15px;font-weight:700;color:#eef2f6;}
.diagram-grid{flex:1;display:grid;grid-template-columns:220px 1fr 260px;min-height:0;}
.diagram-col{overflow-y:auto;padding:12px;}
.diagram-col-cables{border-right:1px solid var(--border-soft);background:var(--bg-panel);}
.diagram-col-info{border-left:1px solid var(--border-soft);background:var(--bg-panel);}
.diagram-col-canvas{padding:0;background:
  linear-gradient(var(--border-soft) 1px,transparent 1px) 0 0/100% 28px,
  linear-gradient(90deg,var(--border-soft) 1px,transparent 1px) 0 0/28px 100%,
  var(--bg-app);display:flex;align-items:center;justify-content:center;}
.diagram-col-canvas svg{width:100%;height:100%;}
.cable-block{margin-bottom:14px;}
.cable-block h5{margin:0 0 2px;font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--text-faint);font-weight:700;}
.cable-meta{font-size:9.5px;color:var(--text-faint);font-family:var(--font-mono);margin-bottom:6px;}
.tube-head{display:flex;align-items:center;gap:6px;margin:7px 0 3px;font-size:9.5px;text-transform:uppercase;
  letter-spacing:.4px;color:var(--text-dim);font-weight:700;border-top:1px solid var(--border-soft);padding-top:6px;}
.fiber-row{display:flex;align-items:center;gap:7px;padding:3px 5px;border-radius:3px;cursor:pointer;font-size:11px;}
.fiber-row:hover{background:var(--bg-panel-alt);}
.fiber-row.selected{background:rgba(79,209,197,.14);}
.fiber-swatch{width:10px;height:10px;border-radius:50%;border:1px solid rgba(255,255,255,.25);flex-shrink:0;}
.fiber-row .fn{font-family:var(--font-mono);color:var(--text-faint);width:16px;}
.fiber-row .fs{margin-left:auto;font-size:9px;color:var(--text-faint);text-transform:uppercase;}
.diagram-empty{padding:40px 16px;text-align:center;color:var(--text-faint);font-size:11.5px;line-height:1.6;}
.diagram-tools{display:flex;align-items:center;gap:6px;}
.dg-joinsel{display:flex;align-items:center;gap:4px;margin-right:6px;}
.dg-joinsel label{font-size:9.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--text-faint);font-weight:700;}
.dg-joinsel .btn.active{background:var(--accent);border-color:var(--accent);color:#04211f;}
.diagram-hint{
  padding:5px 16px;font-size:11px;border-bottom:1px solid var(--border-soft);
  background:var(--bg-panel-alt);color:var(--text-dim);display:none;
}
.diagram-hint.show{display:block;}
.diagram-hint b{color:var(--accent);}
.diagram-hint.locked{color:var(--yellow);background:rgba(210,153,34,.08);}
.diagram-col-canvas{overflow:auto;align-items:flex-start;}
/* ---- editor: blocos de cabo, pinos de fibra, splitters ---- */
.cbox{fill:var(--bg-panel-alt);stroke:var(--border);stroke-width:1.5;}
.cbox-title{fill:#eef2f6;font-size:11.5px;font-weight:700;font-family:var(--font-ui);}
.cbox-sub{fill:var(--text-faint);font-size:9.5px;font-family:var(--font-mono);}
.fpin{cursor:pointer;}
.fpin-ring{stroke-width:2;}
.fpin-num{font-size:8.5px;font-weight:700;font-family:var(--font-mono);pointer-events:none;}
.fpin.sel .fpin-ring{stroke:#4fd1c5;stroke-width:3.5;}
.fpin-label{fill:var(--text-dim);font-size:9px;font-family:var(--font-mono);pointer-events:none;}
.dconn{fill:none;stroke-width:2.2;cursor:pointer;}
.dconn:hover{stroke-width:4;}
.dconn.sel{stroke:#4fd1c5!important;stroke-width:4;}
.dconn.dim{opacity:.12;}
.dconn.hl{stroke-width:4;filter:drop-shadow(0 0 3px rgba(79,209,197,.7));}
.spl{cursor:pointer;}
.spl-body{fill:#1b2430;stroke:#4fd1c5;stroke-width:1.6;}
.spl.sel .spl-body{stroke-width:3;}
.spl-label{font-size:10px;font-weight:700;font-family:var(--font-mono);pointer-events:none;}
.spl-kind{font-size:8px;font-weight:700;letter-spacing:.5px;font-family:var(--font-ui);pointer-events:none;opacity:.8;}
.emenda-lbl{fill:#c7d1dc;font-size:8.5px;font-family:var(--font-mono);pointer-events:none;}
.emenda-lbl.conn{fill:#e8c874;}
.emenda-lbl.pass{fill:#6e7681;font-style:italic;}
.fpin-label.nofeed{fill:#4d5666;font-style:italic;}
.dblock{cursor:grab;}
.dblock:active{cursor:grabbing;}
.diagram-col-canvas{position:relative;}
.dg-zoom{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:4px;z-index:5;}
.dg-zoom button{
  width:28px;height:28px;border-radius:5px;border:1px solid var(--border);
  background:rgba(17,21,28,.95);color:var(--text);font-size:14px;cursor:pointer;line-height:1;
}
.dg-zoom button:hover{border-color:var(--accent-dim);color:#fff;}
.pwr{fill:#7fd6cd;font-size:9px;font-family:var(--font-mono);pointer-events:none;}
.pwr.bad{fill:var(--yellow);}
.pwr.nosig{fill:#6e7681;font-style:italic;}
.legend-chip{display:inline-flex;align-items:center;gap:4px;margin-right:9px;font-size:10px;color:var(--text-dim);}
.legend-chip i{width:9px;height:9px;border-radius:50%;display:inline-block;}
.spl-preview{margin-top:8px;background:var(--bg-input);border:1px solid var(--border-soft);border-radius:5px;padding:8px 9px;}
.spl-preview .prev-title{font-size:9.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--text-faint);font-weight:700;margin-bottom:5px;}
.spl-preview .prev-row{display:flex;justify-content:space-between;font-size:11px;font-family:var(--font-mono);padding:1.5px 0;}
.spl-preview .prev-row b{color:#7fd6cd;}
.spl-preview .prev-row b.bad{color:var(--yellow);}
.spl-preview .prev-warn{margin-top:5px;font-size:10.5px;color:var(--yellow);}
.spl-preview .muted{font-size:10.5px;color:var(--text-faint);}
.diag-line{cursor:pointer;transition:opacity .15s;}
.diag-line.dim{opacity:.12;}
.diag-line.hl{stroke-width:4.5!important;filter:drop-shadow(0 0 3px rgba(79,209,197,.7));}
.diag-node-box{fill:var(--bg-panel-alt);stroke:var(--border);stroke-width:1.5;}
.diag-label{fill:#c7d1dc;font-size:10px;font-family:var(--font-ui);}
.diag-label-bold{fill:#eef2f6;font-size:11px;font-weight:700;font-family:var(--font-ui);}
.diag-plug{cursor:pointer;}
.diag-plug.selected{filter:drop-shadow(0 0 4px rgba(79,209,197,.9));}
@media (max-width:760px){
  .diagram-grid{grid-template-columns:1fr;grid-template-rows:auto 1fr auto;}
  .diagram-col-cables{border-right:none;border-bottom:1px solid var(--border-soft);max-height:120px;}
  .diagram-col-info{border-left:none;border-top:1px solid var(--border-soft);max-height:160px;}
  #panel-right{position:fixed;right:0;top:40px;bottom:0;z-index:1300;}
  #sidebar-left{position:fixed;left:0;top:40px;bottom:0;z-index:1300;}
}

/* ===== RIGHT PANEL ===== */
#panel-right{
  width:300px;background:var(--bg-panel);border-left:1px solid var(--border);
  display:none;flex-direction:column;overflow:hidden;
}
#panel-right.show{display:flex;}
.panel-head{padding:11px 12px 9px;border-bottom:1px solid var(--border-soft);flex-shrink:0;}
.panel-head-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.panel-type-tag{font-size:9.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--accent);font-weight:700;margin-bottom:3px;}
.panel-title{font-size:15px;font-weight:700;color:#eef2f6;line-height:1.25;}
.panel-close{background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:16px;padding:0 2px;line-height:1;}
.panel-close:hover{color:var(--text);}
.status-pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:20px;margin-top:7px;text-transform:uppercase;letter-spacing:.3px;}
.status-pill .d{width:6px;height:6px;border-radius:50%;}
.st-normal{background:rgba(63,185,80,.13);color:var(--green);}
.st-normal .d{background:var(--green);}
.st-alerta{background:rgba(210,153,34,.14);color:var(--yellow);}
.st-alerta .d{background:var(--yellow);}
.st-critico{background:rgba(248,81,73,.14);color:var(--red);}
.st-critico .d{background:var(--red);}
.st-offline{background:rgba(110,118,129,.16);color:var(--gray);}
.st-offline .d{background:var(--gray);}

.panel-body{flex:1;overflow-y:auto;padding:10px 12px 16px;}
.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px;margin-bottom:12px;}
.field{display:flex;flex-direction:column;gap:2px;}
.field.full{grid-column:1/-1;}
.field label{font-size:9px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-faint);font-weight:700;}
.field .val{font-size:12.5px;color:var(--text);font-family:var(--font-mono);}
.field .val.big{font-size:15px;font-weight:700;color:#eef2f6;}

.section-title{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-faint);font-weight:700;margin:14px 0 6px;padding-top:10px;border-top:1px solid var(--border-soft);}
.section-title:first-child{margin-top:0;padding-top:0;border-top:none;}

.port-list{display:flex;flex-direction:column;gap:3px;}
.port-row{
  display:flex;align-items:center;gap:8px;padding:5px 8px;background:var(--bg-input);border-radius:3px;border:1px solid var(--border-soft);
  cursor:default;
}
.port-row .pn{width:16px;text-align:center;font-family:var(--font-mono);color:var(--text-faint);font-size:10.5px;flex-shrink:0;}
.port-row .pd{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.port-row .pl{flex:1;font-size:11.5px;color:var(--text);}
.port-row .pf{font-size:9.5px;color:var(--text-faint);}
.port-row.occ .pd{background:var(--green);}
.port-row.free .pd{background:var(--text-faint);}
.port-row.free .pl{color:var(--text-faint);font-style:italic;}
.port-row.alerta .pd{background:var(--yellow);}
.port-row[data-port]{cursor:pointer;}
.port-row.defeito .pd{background:var(--red,#f85149);}
.eq-ports{display:flex;flex-wrap:wrap;gap:3px;margin:4px 0;}
.eq-port{font:inherit;font-size:9.5px;font-family:var(--font-mono);background:transparent;color:var(--text-dim);border:1px solid var(--border-soft);border-radius:4px;padding:1px 5px;cursor:pointer;}
.eq-port.occ{color:var(--text);border-color:var(--green);}
.eq-port.st-reservada{border-style:dashed;}
.eq-port.st-defeito{border-color:var(--red,#f85149);color:var(--red,#f85149);}
.eq-port .m{color:var(--text-faint);}
.eq-pons{font-size:10.5px;color:var(--text-dim);margin:4px 0;line-height:1.6;}
.eq-pons b{color:var(--text);font-weight:600;}
.src{font-size:9px;padding:0 5px;border-radius:8px;border:1px solid var(--border-soft);color:var(--text-faint);white-space:nowrap;}
.src-porta{color:var(--green);border-color:var(--green);}
.src-none{color:var(--yellow);border-color:var(--yellow);}
.olt-sum{font-size:10.5px;color:var(--text-dim);font-family:var(--font-mono);margin:3px 0;}

.pon-card{background:var(--bg-input);border:1px solid var(--border-soft);border-radius:5px;padding:8px 9px;margin-bottom:6px;}
.pon-card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;}
.pon-card-head b{font-size:11.5px;font-family:var(--font-mono);color:#eef2f6;}
.usage-bar{height:5px;border-radius:3px;background:#1c232e;overflow:hidden;margin-top:5px;}
.usage-bar > div{height:100%;border-radius:3px;}

.action-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;}
.action-row .btn{flex:1;min-width:80px;justify-content:center;}

.alert-box{display:flex;gap:8px;align-items:flex-start;padding:8px 9px;border-radius:5px;font-size:11.5px;line-height:1.4;}
.alert-box.none{background:rgba(63,185,80,.08);color:var(--text-dim);}
.alert-box.has{background:rgba(210,153,34,.1);color:#e8c874;border:1px solid rgba(210,153,34,.25);}

.empty-state{padding:30px 14px;text-align:center;color:var(--text-faint);font-size:11.5px;}

/* form fields (edit / add) */
.form-field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;}
.form-field label{font-size:9.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-faint);font-weight:700;}
.form-field input,.form-field select,.form-field textarea{
  background:var(--bg-input);border:1px solid var(--border);color:var(--text);border-radius:4px;
  padding:7px 8px;font-size:12px;font-family:inherit;outline:none;resize:vertical;
}
.form-field input:focus,.form-field select:focus,.form-field textarea:focus{border-color:var(--accent-dim);}
.port-counts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
.port-counts label{display:flex;flex-direction:column;gap:3px;}
.port-counts input{width:100%;min-width:0;}

/* ===== MODAL ===== */
.modal-overlay{
  position:fixed;inset:0;background:rgba(4,6,9,.6);z-index:3200;display:none;align-items:center;justify-content:center;
}
.modal-overlay.show{display:flex;}
.modal{width:340px;max-height:82vh;overflow-y:auto;background:var(--bg-panel-alt);border:1px solid var(--border);border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,.55);}
.modal-head{padding:13px 15px;border-bottom:1px solid var(--border-soft);display:flex;justify-content:space-between;align-items:center;}
.modal-head h3{margin:0;font-size:13.5px;color:#eef2f6;}
.modal-body{padding:14px 15px;}
.modal-foot{padding:11px 15px;border-top:1px solid var(--border-soft);display:flex;justify-content:flex-end;gap:8px;}
.type-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;}
.type-opt{
  display:flex;flex-direction:column;align-items:center;gap:5px;padding:11px 4px;border:1px solid var(--border);
  border-radius:6px;background:var(--bg-input);cursor:pointer;color:var(--text-dim);
}
.type-opt:hover{border-color:var(--accent-dim);color:var(--text);}
.type-opt svg{width:20px;height:20px;}
.type-opt span{font-size:9.5px;text-transform:uppercase;letter-spacing:.3px;font-weight:700;}

/* toast */
.ctxmenu{
  position:fixed;z-index:3600;min-width:200px;max-width:280px;background:var(--bg-panel-alt);
  border:1px solid var(--border);border-radius:6px;padding:5px;display:none;
  box-shadow:0 12px 34px rgba(0,0,0,.6);
  max-height:min(70vh,520px);overflow-y:auto;overscroll-behavior:contain;
}
.ctxmenu.show{display:block;}
.ctxmenu-item svg{width:14px;height:14px;flex-shrink:0;opacity:.85;}
.ctxmenu-item span{overflow:hidden;text-overflow:ellipsis;}
.ctxmenu-head{position:sticky;top:-5px;background:var(--bg-panel-alt);z-index:1;}
.ctxmenu-head{
  padding:5px 9px 6px;font-size:9.5px;text-transform:uppercase;letter-spacing:.5px;
  color:var(--text-faint);font-weight:700;border-bottom:1px solid var(--border-soft);margin-bottom:4px;
}
.ctxmenu-item{
  display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:4px;
  cursor:pointer;font-size:11.5px;color:var(--text);white-space:nowrap;
}
.ctxmenu-item:hover{background:#1e2530;}
.ctxmenu-item.danger{color:var(--red);}
.ctxmenu-item.disabled{color:var(--text-faint);cursor:default;}
.ctxmenu-item.disabled:hover{background:transparent;}
.ctxmenu-sep{height:1px;background:var(--border-soft);margin:4px 0;}
.ctxmenu-item kbd{margin-left:auto;font-size:9px;color:var(--text-faint);font-family:var(--font-mono);}

#toast{
  position:fixed;bottom:16px;left:50%;transform:translateX(-50%) translateY(20px);z-index:3400;
  background:#1c232e;border:1px solid var(--border);color:var(--text);padding:9px 16px;border-radius:6px;font-size:12px;
  opacity:0;transition:all .2s;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.4);
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

.add-menu{position:absolute;top:38px;right:12px;z-index:1500;background:var(--bg-panel-alt);border:1px solid var(--border);border-radius:6px;box-shadow:0 12px 30px rgba(0,0,0,.5);display:none;padding:6px;min-width:170px;}
.add-menu.show{display:block;}
.add-menu-item,.add-menu-extra{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:4px;cursor:pointer;font-size:11.5px;color:var(--text);}
.add-menu-item:hover,.add-menu-extra:hover{background:#1e2530;}
.add-menu-item svg,.add-menu-extra svg{width:15px;height:15px;flex-shrink:0;opacity:.8;}
/* ---- fase 1B: estado da carga e avisos de "não salvo" ---- */
.map-status{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:900;pointer-events:none;
  color:var(--text-faint);font-size:13px;text-align:center;padding:24px;}
.map-status.show{display:flex;}
.map-status.error{color:var(--yellow);pointer-events:auto;}
.map-unsaved{position:absolute;left:10px;bottom:10px;z-index:901;font-size:10.5px;color:var(--yellow);
  background:rgba(210,153,34,.1);border:1px solid rgba(210,153,34,.35);border-radius:4px;padding:3px 8px;pointer-events:none;}
.diagram-unsaved{font-size:10px;color:var(--yellow);margin-top:2px;}
.pin-bar{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:902;display:none;align-items:center;gap:6px;
  background:var(--bg-panel);border:1px solid var(--border);border-radius:6px;padding:5px 8px;font-size:11px;color:var(--text-dim);}
.pin-bar.show{display:flex;}
.pin-bar select{background:var(--bg-panel-alt);color:inherit;border:1px solid var(--border);border-radius:4px;padding:3px 4px;font-size:11px;}
.status-pill.lc-projeto{background:rgba(88,166,255,.12);color:#58a6ff;}.status-pill.lc-projeto .d{background:#58a6ff;}
.status-pill.lc-ativo{background:rgba(139,148,158,.12);color:#9aa4b2;}.status-pill.lc-ativo .d{background:#9aa4b2;}
.status-pill.lc-desativado{background:rgba(110,118,129,.12);color:#6e7681;}.status-pill.lc-desativado .d{background:#6e7681;}
.site-pick{background:rgba(79,209,197,.08);border:1px solid rgba(79,209,197,.35);border-radius:6px;padding:8px;margin:8px 0;font-size:11.5px;line-height:1.6;}
.site-group{margin-bottom:10px;}
.site-group-title{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-dim);margin:6px 0 4px;}
.site-eq{border:1px solid var(--border-soft);border-radius:6px;padding:7px 8px;margin-bottom:6px;}
.site-eq.hl{border-color:#4fd1c5;box-shadow:0 0 0 1px #4fd1c5 inset;}
.site-eq-head{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-size:12px;}
.site-eq-head .status-pill{margin-top:0;}
.site-eq-meta{font-size:10.5px;color:var(--text-dim);margin-top:3px;}
.lk-detail{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:9px;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--yellow);border:1px solid var(--yellow);}
.site-eq-links{font-size:10.5px;color:var(--text-dim);margin:4px 0;line-height:1.5;}
.site-eq .action-row{margin-top:4px;}
.site-add{display:flex;gap:6px;align-items:center;margin:10px 0;}
.site-add select{background:var(--bg-panel-alt);color:inherit;border:1px solid var(--border);border-radius:4px;padding:4px;font-size:11px;}
</style>
</head>
<body>
<div id="app">

  <!-- ===== TOPBAR ===== -->
  <div id="topbar">
    <div class="brand"><span class="dot" id="net-status-dot"></span> ISP MAP</div>
    <div class="kpis">
      <div class="kpi"><b id="kpi-pop">–</b><span>POPs</span></div>
      <div class="kpi"><b id="kpi-cto">–</b><span>CTOs</span></div>
      <div class="kpi"><b id="kpi-clients">–</b><span>Clientes</span></div>
      <div class="kpi"><b id="kpi-links">–</b><span>Links</span></div>
      <div class="kpi alert"><b id="kpi-alerts">–</b><span>Alertas</span></div>
    </div>
    <div class="topbar-search">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.6" y2="16.6"/></svg>
      <input id="search-input" type="text" placeholder="Buscar elemento, cliente, ID..." autocomplete="off">
      <div class="search-results" id="search-results"></div>
    </div>
    <button class="btn" id="btn-filters-toggle" title="Alternar painel de filtros">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="6" x2="20" y2="6"/><line x1="7" y1="12" x2="17" y2="12"/><line x1="10" y1="18" x2="14" y2="18"/></svg>
      Filtros
    </button>
    <button class="btn btn-accent" id="btn-add">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Adicionar
    </button>
  </div>

  <div id="add-menu" class="add-menu"></div>

  <!-- ===== BODY ===== -->
  <div id="body">

    <!-- LEFT SIDEBAR -->
    <div id="sidebar-left">
      <div class="sb-header">
        <span>Camadas &amp; Filtros</span>
        <button class="sb-toggle" id="sb-collapse-btn" title="Recolher">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
      </div>
      <div class="sb-content" id="sb-content"></div>
    </div>

    <!-- MAP -->
    <div id="map-wrap">
      <div id="map"></div>
      <div class="map-status" id="map-status" role="status"></div>
      <div class="pin-bar" id="pin-bar"><span id="pin-coords"></span><select id="pin-type" title="Tipo do elemento"></select><button class="btn btn-accent btn-sm" id="pin-add">Adicionar elemento aqui</button><button class="btn btn-sm" id="pin-clear" title="Limpar marcador">✕</button></div>
      <div class="map-unsaved" id="map-unsaved">Nós e ligações são salvos; diagrama ainda não</div>
      <div id="mode-banner"><span id="mode-banner-text"></span><button id="mode-banner-cancel">CANCELAR (ESC)</button></div>
      <div class="map-legend">
        <div class="lg-item"><div class="lg-dot" style="background:var(--green)"></div>Normal</div>
        <div class="lg-item"><div class="lg-dot" style="background:var(--yellow)"></div>Atenção</div>
        <div class="lg-item"><div class="lg-dot" style="background:var(--red)"></div>Crítico</div>
        <div class="lg-item"><div class="lg-dot" style="background:var(--gray)"></div>Offline</div>
      </div>
      <div class="map-attrib">Protótipo — dados fictícios</div>
      <div class="map-basemap">
        <select id="sel-basemap" title="Mapa base"></select>
      </div>
      <button class="btn map-fit-btn" id="btn-fit" title="Enquadrar toda a rede">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9V4h5M21 9V4h-5M3 15v5h5M21 15v5h-5"/></svg>
        Enquadrar rede
      </button>
      <div class="connect-hint" id="connect-hint">Solte sobre o elemento destacado para conectar</div>
      <div class="tile-warning" id="tile-warning"></div>
      <div class="map-zoom">
        <button id="btn-zoom-in" title="Aproximar">+</button>
        <button id="btn-zoom-out" title="Afastar">−</button>
      </div>
    </div>

    <!-- RIGHT PANEL -->
    <div id="panel-right"></div>
  </div>
</div>

<!-- ===== DIAGRAMA UNIFILAR (nível 2) ===== -->
<div class="diagram-overlay" id="diagram-overlay">
  <div class="diagram-head">
    <div>
      <div class="diagram-eyebrow">Diagrama unifilar</div>
      <div class="diagram-title" id="diagram-title">—</div>
      <div class="diagram-unsaved">Diagrama ainda não é salvo</div>
    </div>
    <div class="diagram-tools">
      <span class="dg-joinsel" id="dg-joinsel">
        <label>Emenda:</label>
        <button class="btn btn-sm active" data-join="fusao">Fusão</button>
        <button class="btn btn-sm" data-join="conector">Conector</button>
      </span>
      <button class="btn btn-sm" id="dg-add-cable">+ Cabo</button>
      <button class="btn btn-sm" id="dg-add-splitter">+ Splitter</button>
      <button class="btn btn-sm" id="dg-role" title="Alternar perfil">Admin</button>
      <button class="btn" id="diagram-back">← Voltar ao mapa</button>
    </div>
  </div>
  <div class="diagram-hint" id="diagram-hint"></div>
  <div class="diagram-grid">
    <div class="diagram-col diagram-col-cables" id="diagram-cables"></div>
    <div class="diagram-col diagram-col-canvas">
      <svg id="diagram-svg" viewBox="0 0 960 560" preserveAspectRatio="xMidYMid meet"></svg>
      <div class="dg-zoom">
        <button id="dg-zoom-in" title="Aproximar">+</button>
        <button id="dg-zoom-out" title="Afastar">−</button>
        <button id="dg-fit" title="Enquadrar">⤢</button>
        <button id="dg-reset-pos" title="Restaurar posições dos blocos">⟲</button>
      </div>
    </div>
    <div class="diagram-col diagram-col-info" id="diagram-info"></div>
  </div>
</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal" id="modal-el"></div>
</div>

<div id="ctxmenu" class="ctxmenu"></div>

<div id="toast"></div>

<script src="/mapa/diagram.js"></script>
<script>
(function(){
"use strict";

/* ============================================================
   ICONS (SVG paths por tipo de elemento)
   ============================================================ */
const ICON_PATHS = {
  pop:      '<rect x="3" y="3" width="18" height="18" rx="1.5"/><rect x="6.5" y="6.5" width="4" height="4"/><rect x="13.5" y="6.5" width="4" height="4"/><rect x="6.5" y="13.5" width="4" height="4"/><rect x="13.5" y="13.5" width="4" height="4"/>',
  olt:      '<rect x="2" y="7" width="20" height="10" rx="1.5"/><circle cx="6.3" cy="12" r="1.3"/><circle cx="10.4" cy="12" r="1.3"/><circle cx="14.5" cy="12" r="1.3"/><circle cx="18.6" cy="12" r="1.3"/>',
  switch:   '<rect x="2" y="9" width="20" height="8" rx="1.5"/><line x1="5.5" y1="9" x2="5.5" y2="4"/><line x1="10" y1="9" x2="10" y2="4"/><line x1="14.5" y1="9" x2="14.5" y2="4"/><line x1="19" y1="9" x2="19" y2="4"/>',
  tower:    '<line x1="12" y1="1.5" x2="12" y2="22.5"/><line x1="6" y1="22.5" x2="12" y2="3.5"/><line x1="18" y1="22.5" x2="12" y2="3.5"/><line x1="8.3" y1="14.5" x2="15.7" y2="14.5"/><line x1="9.4" y1="9" x2="14.6" y2="9"/>',
  radio:    '<circle cx="12" cy="17" r="1.8"/><line x1="12" y1="15.2" x2="12" y2="7"/><path d="M8 10.3a5.6 5.6 0 0 1 8 0"/><path d="M5 6.6a10 10 0 0 1 14 0"/>',
  cto:      '<rect x="3.5" y="6" width="17" height="13" rx="1.5"/><line x1="3.5" y1="11" x2="20.5" y2="11"/><line x1="8" y1="11" x2="8" y2="19"/><line x1="12" y1="11" x2="12" y2="19"/><line x1="16" y1="11" x2="16" y2="19"/>',
  splitter: '<path d="M3 12h5.5L15 5.5"/><path d="M8.5 12L15 18.5"/><path d="M15 5.5h6"/><path d="M15 18.5h6"/>',
  client:   '<path d="M12 3 L21 10.5 V21 H3 V10.5 Z"/><rect x="9.7" y="13.5" width="4.6" height="7.5"/>',
  ceo:      '<rect x="2.5" y="8.5" width="19" height="7" rx="3.5"/><circle cx="7" cy="12" r="1.15"/><circle cx="12" cy="12" r="1.15"/><circle cx="17" cy="12" r="1.15"/>',
  router:   '<circle cx="12" cy="12" r="8.5"/><path d="M8 9h8M13.5 6.5L16 9l-2.5 2.5M16 15H8M10.5 12.5L8 15l2.5 2.5"/>',
  server:   '<rect x="4" y="3.5" width="16" height="7" rx="1.2"/><rect x="4" y="13.5" width="16" height="7" rx="1.2"/><circle cx="8" cy="7" r="1"/><circle cx="8" cy="17" r="1"/>',
  other:    '<rect x="4" y="6" width="16" height="12" rx="1.5"/><line x1="8" y1="12" x2="16" y2="12"/>'
};
const TYPE_LABEL = {pop:'POP',olt:'OLT',switch:'Switch',router:'Roteador',server:'Servidor',other:'Outro',tower:'Torre',radio:'Rádio/AP',cto:'CTO',splitter:'Splitter',dio:'DIO',client:'Cliente',ceo:'CEO'};
const TYPE_ORDER = ['pop','tower','olt','switch','router','radio','server','other','ceo','cto','splitter','dio','client'];
/* Categorias (mesmas regras do servidor):
   contêiner (site) — pop, tower: ícone no mapa, coordenada própria; tower pode ficar dentro de um pop.
   equipamento — fica dentro de um contêiner, sem coordenada própria (usa a do site) e sem ícone próprio no mapa.
                 É onde as portas da fase 1G vão se pendurar (tipo rj45/sfp/pon/fibra, externa/interna).
   campo — ceo, cto: coordenada própria, sem pai. */
const CONTAINER_TYPES = ['pop','tower'];
const EQUIPMENT_TYPES = ['olt','switch','router','radio','server','other'];
const FIELD_TYPES = ['ceo','cto'];
/* Passivos (fase 2C): splitter (pai POP, torre, CEO ou CTO) e dio (pai POP ou torre). Sem coordenada própria (herdam a
   do pai) e sem ícone no mapa. CEO/CTO são a "caixa" dos splitters e aceitam SOMENTE splitter como filho. */
const PASSIVE_TYPES = ['splitter','dio'];
const PASSIVE_PARENTS = {splitter:['pop','tower','ceo','cto'], dio:['pop','tower']};
/* Razões do splitter: mesmo catálogo de diagram.js (subconjunto aprovado na 2A). Desbalanceado A/B = 2 saídas (A% e B%). */
const SPLITTER_BALANCED = ['1x2','1x4','1x8','1x16','1x32','1x64'];
const SPLITTER_UNBALANCED = ['5/95','10/90','15/85','20/80','30/70','40/60','50/50'];
const DIO_CAPACITIES = [12,24,36,48,72,96,144];
/* Portas (fase 1G): port_role = família/numeração; a mídia é DERIVADA dela no servidor (não editável):
   eth → rj45, sfp → sfp, pon → pon, fo → fibra. Padrão: PON e portas da CTO externas; demais internas.
   Fase 2C: spl_in, spl_out (splitter) e dio → fibra. Manter igual ao PORT_MEDIA do MapController. */
const PORT_FAMILIES = ['eth','sfp','pon','fo'];   // famílias por quantidade em equipamento (passivos têm geração própria)
const PORT_MEDIA = {eth:'rj45', sfp:'sfp', pon:'pon', fo:'fibra', spl_in:'fibra', spl_out:'fibra', dio:'fibra'};
const PORT_MEDIA_LABEL = {rj45:'RJ45', sfp:'SFP', pon:'PON', fibra:'Fibra'};
const isContainer = n => !!n && CONTAINER_TYPES.includes(n.type);
const isEquipment = n => !!n && EQUIPMENT_TYPES.includes(n.type);
const isPassive = n => !!n && PASSIVE_TYPES.includes(n.type);
/* "Caixa": POP/torre (site) ou CEO/CTO — onde equipamentos/passivos ficam dentro. */
const isBox = n => !!n && (CONTAINER_TYPES.includes(n.type) || FIELD_TYPES.includes(n.type));
/* Nó que representa x no mapa: o próprio site para equipamentos; o pai (site ou caixa) para passivos. */
function siteOf(x){ const k = x && (x.siteId || x.boxId); return k ? (nodeById(k) || x) : x; }
function equipmentOf(site){ return nodes.filter(x=>x.siteId===site.id); }
function passivesOf(box){ return nodes.filter(x=>x.boxId===box.id); }
/* Ligação interna: as duas pontas no mesmo site (equipamento↔equipamento ou site↔equipamento dele). */
function isInternalLink(l){
  const a = siteOf(nodeById(l.from)), b = siteOf(nodeById(l.to));
  return !!a && !!b && a.id===b.id;
}
/* Ligação "a detalhar": alguma ponta é o próprio POP/torre, sem o equipamento definido (continua permitida). */
function isPendingDetail(l){ return isContainer(nodeById(l.from)) || isContainer(nodeById(l.to)); }
function portById(id){ return id ? ports.find(p=>p.id===id) || null : null; }
function linkOfPort(portId){ return links.find(l=>l.fromPort===portId || l.toPort===portId) || null; }
/* Pontas possíveis ao refinar um trecho: o site da ponta atual e os equipamentos dele (o servidor confere). CTO/CEO: só ela mesma. */
function endpointChoices(n){ const st = siteOf(n); return isContainer(st) ? [st].concat(equipmentOf(st), passivesOf(st)) : (isBox(st) ? [st].concat(passivesOf(st)) : [n]); }
/* Compatibilidade porta × ligação (mesmas regras do servidor): mídia × meio do tipo, externa se sair do site, sem defeito. */
const LINK_MEDIUM = {backbone:'fibra', distribuicao:'fibra', drop:'fibra', ethernet:'cabo', wireless:'radio'};
const PORT_MEDIA_BY_MEDIUM = {fibra:['pon','fibra','sfp'], cabo:['rj45','sfp'], radio:[]};
/* Potência da PON (fase 2B). É POR PORTA (cada porta pode ter módulo diferente): tx_dbm / max_clientes nos attrs da porta.
   A OLT guarda tx_padrao_dbm / max_clientes_padrao, que só preenchem PONs sem valor próprio. Valor efetivo = da porta
   (src 'porta') || padrão da OLT (src 'olt') || vazio (src null). */
function ponEffective(p){
  const olt = nodeById(p.nodeId) || {};
  const pick = (own, dflt)=> own!=null && own!=='' ? {v:+own, src:'porta'} : (dflt!=null && dflt!=='' ? {v:+dflt, src:'olt'} : {v:null, src:null});
  return {tx:pick(p.tx_dbm, olt.tx_padrao_dbm), max:pick(p.max_clientes, olt.max_clientes_padrao)};
}
function fmtTx(v){ return (v>0?'+':'')+String(Math.round(v*100)/100).replace('.',',')+' dBm'; }
const SRC_LABEL = {porta:'da porta', olt:'padrão da OLT'};
/* "Tx +4,25 dBm (da porta) · clientes — / 64 (padrão da OLT)"; sem valor: "Tx não informado" */
function ponSummaryHtml(p){
  const e = ponEffective(p);
  const tx = e.tx.v!=null ? `Tx ${fmtTx(e.tx.v)} <span class="src src-${e.tx.src}">${SRC_LABEL[e.tx.src]}</span>` : '<span class="src src-none">Tx não informado</span>';
  const mx = e.max.v!=null ? `clientes — / ${e.max.v} <span class="src src-${e.max.src}">${SRC_LABEL[e.max.src]}</span>` : 'clientes — / máx não informado';
  return tx+' · '+mx;
}
/* Resumo da OLT: "PONs: N · Tx padrão: X dBm · máx/porta: Y" */
function oltSummaryText(n){
  const pons = portsOf(n.id).filter(p=>p.role==='pon');
  return 'PONs: '+pons.length+' · Tx padrão: '+(n.tx_padrao_dbm!=null && n.tx_padrao_dbm!=='' ? fmtTx(+n.tx_padrao_dbm) : '—')
    +' · máx/porta: '+(n.max_clientes_padrao!=null && n.max_clientes_padrao!=='' ? n.max_clientes_padrao : '—');
}
const PORT_STATUS_LABEL = {livre:'normal', reservada:'reservada', defeito:'com defeito'};
function sameSiteNodes(a, b){ const x = siteOf(a), y = siteOf(b); return isBox(x) && !!y && x.id===y.id; }
function portFits(p, linkType, internal){
  return p.status!=='defeito' && (PORT_MEDIA_BY_MEDIUM[LINK_MEDIUM[linkType]]||[]).includes(p.media) && (internal || p.external);
}
/* Select de porta para uma ponta (equipamento/CTO): só as compatíveis e livres; "sem porta" sempre disponível.
   editingLinkId: a porta já usada por este trecho conta como livre. */
function portSelectHtml(id, node, linkType, internal, currentPortId, editingLinkId){
  if(!node || !(isEquipment(node) || isPassive(node) || node.type==='cto')) return '';
  const opts = portsOf(node.id).filter(p=>{
    const lk = linkOfPort(p.id);
    return portFits(p, linkType, internal) && (!lk || lk.id===editingLinkId);
  });
  const sel = opts.some(p=>p.id===currentPortId) ? currentPortId : '';
  return `<div class="form-field"><label>Porta em ${escapeHtml(node.name)}</label><select id="${id}">
    <option value="">sem porta</option>${opts.map(p=>`<option value="${p.id}" ${p.id===sel?'selected':''}>${escapeHtml(p.label)} · ${PORT_MEDIA_LABEL[p.media]||p.media} · ${p.external?'ext':'int'}${p.status==='reservada'?' (reservada)':''}</option>`).join('')}
  </select></div>`;
}
function portFieldValue(id){ const el = document.getElementById(id); if(!el) return ''; const p = portById(el.value); return p ? String(p.dbId) : ''; }
/* Destino de uma porta ocupada: o outro nó da ligação dela. */
function portTarget(p){ const lk = linkOfPort(p.id); return lk ? nodeById(lk.from===p.nodeId ? lk.to : lk.from) : null; }
/* "OLT-001 · PON 1 (POP-001)" */
function endpointLabel(n, portId){
  if(!n) return '?';
  const pt = portById(portId);
  return escapeHtml(n.name) + (pt ? ' · '+escapeHtml(pt.label) : '') + ((n.siteId || n.boxId) ? ' <span class="muted">('+escapeHtml(siteOf(n).name)+')</span>' : '');
}
const STATUS_COLOR = {normal:'#3fb950',alerta:'#d29922',critico:'#f85149',offline:'#6e7681',livre:'#3a4353'};
const STATUS_LABEL = {normal:'Online / Normal',alerta:'Atenção',critico:'Crítico',offline:'Offline',livre:'Livre'};
const ICON_SIZE = {pop:30,tower:30,olt:26,switch:24,router:24,radio:22,server:24,other:22,ceo:22,cto:20,splitter:16,client:17};
const FIBER_COLOR_HEX = {'Azul':'#3b82f6','Laranja':'#f97316','Verde':'#22c55e','Marrom':'#92400e','Cinza':'#9ca3af','Violeta':'#a855f7','Branco':'#f1f5f9','Vermelho':'#ef4444','Preto':'#111827','Amarelo':'#eab308','Rosa':'#ec4899','Aqua':'#06b6d4'};
// Sequência de cores padrão ABNT (usada no Brasil). A fibra 6 = Violeta bate com o
// exemplo que você descreveu, o que indica que sua rede segue esta sequência.
const FIBER_COLOR_ORDER = ['Verde','Amarelo','Branco','Azul','Vermelho','Violeta','Marrom','Rosa','Preto','Cinza','Laranja','Aqua'];
const FIBERS_PER_TUBE = 12;
function tubeOf(numero){ return Math.floor((numero-1)/FIBERS_PER_TUBE)+1; }
function tubeColor(numero){ return FIBER_COLOR_ORDER[(tubeOf(numero)-1)%FIBER_COLOR_ORDER.length]; }
function isCoarsePointer(){ return window.matchMedia && window.matchMedia('(pointer: coarse)').matches; }

const LINK_TYPE_LABEL = {backbone:'Backbone (fibra)',distribuicao:'Distribuição (fibra)',drop:'Drop (fibra)',ethernet:'Ethernet',wireless:'Enlace rádio'};
const LINK_TYPE_STYLE = {

  drop:        {weight:1.6, dash:null,  color:'#7c8798'},
  ethernet:    {weight:2,   dash:'2,4', color:'#8a92a3'},
  wireless:    {weight:2,   dash:'6,5', color:'#c58cf2'}
};
