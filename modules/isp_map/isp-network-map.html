    // o servidor substitui o traçado inteiro: reenvia os pontos atuais junto com reservas e folga editadas
    const nf = nodeById(ends.from.sel), of = nodeById(l.from), ot = nodeById(l.to);
    const invertedEnds = nf && of && ot && nf.lat===ot.lat && nf.lng===ot.lng && !(of.lat===ot.lat && of.lng===ot.lng);
    const keepPts = invertedEnds && (l.pathPts||[]).length ? l.pathPts.slice().reverse() : (l.pathPts||[]);
    fields.path = buildPathString(keepPts, rs.reservas, rs.folgaPct);

      });
    }).catch(err=>{ saveBtn.disabled = false; toast(err.message); });

  const owner = nodeById(p.nodeId), tgt = portTarget(p), lk = linkOfPort(p.id);
  modalEl.innerHTML = `
    <div class="modal-head"><h3>Porta — ${escapeHtml(p.label)}</h3><button class="panel-close" id="modal-x">✕</button></div>
    <div class="modal-body">
      <div class="cable-meta">${escapeHtml(owner ? owner.name : '')} · mídia ${PORT_MEDIA_LABEL[p.media]||escapeHtml(p.media||'—')} (definida pelo tipo da porta) · ${tgt ? 'em uso → '+escapeHtml(tgt.name)+(lk && lk.label ? ' ('+escapeHtml(lk.label)+')' : '') : 'livre'}</div>
      <div class="form-field"><label>Rótulo</label><input id="f-pt-label" type="text" maxlength="60" value="${escapeHtml(p.label)}"></div>
      <div class="form-field"><label>Uso</label><select id="f-pt-ext"><option value="0" ${p.external?'':'selected'}>Interna (só dentro do site)</option><option value="1" ${p.external?'selected':''}>Externa (pode sair do site)</option></select></div>
      ${p.role==='pon' ? (()=>{ const e = ponEffective(p), olt = owner||{};
        return `<div class="form-field"><label>Potência de saída (dBm)</label><input id="f-pt-tx" type="text" inputmode="decimal" placeholder="${olt.tx_padrao_dbm!=null&&olt.tx_padrao_dbm!==''?'padrão da OLT: '+escapeHtml(fmtTx(+olt.tx_padrao_dbm)):'ex.: 4,5'}" value="${p.tx_dbm!=null?escapeHtml(String(p.tx_dbm).replace('.',',')):''}">
          <div class="cable-meta">${e.tx.src==='porta' ? 'Valor desta porta.' : e.tx.src==='olt' ? 'Vazio: herda o padrão da OLT ('+escapeHtml(fmtTx(e.tx.v))+').' : 'Não informado (−10 a +10 dBm).'}</div></div>
        <div class="form-field"><label>Máximo de clientes</label><input id="f-pt-max" type="number" min="1" max="256" placeholder="${olt.max_clientes_padrao!=null&&olt.max_clientes_padrao!==''?'padrão da OLT: '+escapeHtml(olt.max_clientes_padrao):''}" value="${p.max_clientes!=null?escapeHtml(p.max_clientes):''}">
          <div class="cable-meta">${e.max.src==='porta' ? 'Valor desta porta.' : e.max.src==='olt' ? 'Vazio: herda o padrão da OLT ('+escapeHtml(e.max.v)+').' : 'Não informado (1 a 256).'}</div></div>`; })() : ''}
      <div class="form-field"><label>Status</label><select id="f-pt-status">${Object.keys(PORT_STATUS_LABEL).map(k=>`<option value="${k}" ${p.status===k?'selected':''}>${PORT_STATUS_LABEL[k]}</option>`).join('')}</select></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-danger" id="f-pt-del" ${tgt?'disabled title="Porta em uso"':''}>Excluir porta</button>
      <button class="btn" id="modal-cancel">Cancelar</button>
      <button class="btn btn-accent" id="modal-save">Salvar porta</button>
    </div>`;
  overlay.classList.add('show');
  const reopen = msg=> loadNetwork(()=>{ const again = nodes.find(x=>owner && x.dbId===owner.dbId); if(again) onNodeClick(again.id); toast(msg); });
  document.getElementById('modal-x').addEventListener('click', closeModal);
  document.getElementById('modal-cancel').addEventListener('click', closeModal);
  document.getElementById('modal-save').addEventListener('click', ()=>{
    const label = document.getElementById('f-pt-label').value.trim();
    if(!label){ toast('Informe o rótulo da porta.'); return; }
    const btn = document.getElementById('modal-save'); btn.disabled = true;
    const body = {id:p.dbId, label, is_external:document.getElementById('f-pt-ext').value, status:document.getElementById('f-pt-status').value};
    if(p.role==='pon'){ body.tx_dbm = document.getElementById('f-pt-tx').value.trim(); body.max_clientes = document.getElementById('f-pt-max').value.trim(); }
    mapPost('/portas/editar', body)
      .then(()=>{ closeModal(); reopen('Porta salva.'); })
      .catch(err=>{ btn.disabled = false; toast(err.message); });
  });
  document.getElementById('f-pt-del').addEventListener('click', ()=>{
    if(!confirm('Excluir a porta "'+p.label+'"?')) return;
    mapPost('/portas/excluir', {id:p.dbId}).then(()=>{ closeModal(); reopen('Porta excluída.'); }).catch(err=> toast(err.message));
  });
}
/* Toast com os avisos do servidor (warnings[]: ethernet > 100 m, porta reservada…), por mais tempo. */
function toastResult(msg, data){
  const w = (data && Array.isArray(data.warnings)) ? data.warnings : [];
  toast(w.length ? msg+' Aviso: '+w.join(' ') : msg, w.length ? 7000 : undefined);
}
/* Troca origem e destino (as portas acompanham os nós no servidor). Auditado como update. */
function invertLink(l){
  const a = nodeById(l.from), b = nodeById(l.to);
  if(!l.dbId || !a || !b){ toast('Trecho ainda não salvo. Recarregue o mapa.'); return; }
  const inv = {id:l.dbId, from_node_id:b.dbId, to_node_id:a.dbId};
  if((l.pathPts||[]).length) inv.path = buildPathString(l.pathPts.slice().reverse(), l.reservas, l.folgaPct);   // o traçado acompanha o sentido
  mapPost('/links/editar', inv).then(data=>{
    loadNetwork(()=>{
      const again = links.find(x=>x.dbId===l.dbId);
      if(again) onLinkClick(again.id);
      toastResult('Sentido invertido: '+b.name+' → '+a.name+'.', data);
    });
  }).catch(err=> toast(err.message));
}
function deleteLinkRemote(l){
  if(!l.dbId){ toast('Trecho ainda não salvo. Recarregue o mapa.'); return; }
  mapPost('/links/excluir', {id:l.dbId})
    .then(()=>{ loadNetwork(()=> toast('Trecho excluído.')); })
    .catch(err=> toast(err.message));
}

/* ============================================================
   MENU DE CONTEXTO (botão direito) — mapa e diagrama
   Um único menu (#ctxmenu) reaproveitado por todos os alvos. Cada handler
   apenas monta a lista de itens; as ações chamam as funções que já existem,
   para o comportamento ficar idêntico ao dos painéis laterais.
   ============================================================ */
const ctxEl = document.getElementById('ctxmenu');
let ctxOpen = false;

function closeCtxMenu(){
  if(!ctxOpen) return;
  ctxOpen = false;
  ctxEl.classList.remove('show');
  ctxEl.innerHTML = '';
}

function ctxIcon(type){
  return ICON_PATHS[type]
    ? `<svg viewBox="0 0 24 24" fill="none" stroke="${STATUS_COLOR.normal}" stroke-width="1.8">${ICON_PATHS[type]}</svg>`
    : '';
}

/* items: {label, icon, kbd, danger, disabled, sep, onClick} — nulos são ignorados */
function openCtxMenu(e, head, items){
  const list = (items||[]).filter(Boolean);
  if(!list.length) return;
  e.preventDefault();
  e.stopPropagation();
  closeCtxMenu();

  const parts = [];
  if(head) parts.push(`<div class="ctxmenu-head">${escapeHtml(head)}</div>`);
  list.forEach((it,i)=>{
    if(it.sep){ parts.push('<div class="ctxmenu-sep"></div>'); return; }
    const cls = 'ctxmenu-item'+(it.danger?' danger':'')+(it.disabled?' disabled':'');
    parts.push(`<div class="${cls}" data-ci="${i}">${it.icon||''}<span>${escapeHtml(it.label)}</span>${
      it.kbd?`<kbd>${escapeHtml(it.kbd)}</kbd>`:''}</div>`);
  });
  ctxEl.innerHTML = parts.join('');
  ctxEl.querySelectorAll('[data-ci]').forEach(el=>{
    const it = list[parseInt(el.getAttribute('data-ci'),10)];
    if(!it || it.disabled || !it.onClick) return;
    el.addEventListener('click',(ev)=>{
      ev.stopPropagation();
      closeCtxMenu();
      it.onClick();
    });
  });

  // abre invisível no canto para medir, depois posiciona sem sair da janela
  ctxEl.style.left='0px'; ctxEl.style.top='0px';
  ctxEl.classList.add('show');
  ctxOpen = true;
  const r = ctxEl.getBoundingClientRect(), m = 6;
  let x = e.clientX, y = e.clientY;
  if(x + r.width  > window.innerWidth  - m) x = Math.max(m, window.innerWidth  - r.width  - m);
  if(y + r.height > window.innerHeight - m) y = Math.max(m, window.innerHeight - r.height - m);
  ctxEl.style.left = x+'px';
  ctxEl.style.top  = y+'px';
}

/* ---- fechamento ---- */
document.addEventListener('pointerdown',(e)=>{ if(!ctxEl.contains(e.target)) closeCtxMenu(); }, true);
document.addEventListener('wheel',(e)=>{ if(!ctxEl.contains(e.target)) closeCtxMenu(); }, true);
document.addEventListener('keydown',(e)=>{ if(e.key==='Escape') closeCtxMenu(); });
window.addEventListener('resize', closeCtxMenu);
window.addEventListener('blur', closeCtxMenu);
ctxEl.addEventListener('contextmenu',(e)=> e.preventDefault());

/* ============ MAPA ============ */
function ctxItemsNode(n){
  const items = [];
  if(['ceo','cto'].includes(n.type))
    items.push({label:'Abrir diagrama unifilar', icon:ctxIcon(n.type), onClick:()=> openDiagram(n.id)});
  if(n.type==='client')
    items.push({label:'Destacar caminho até a origem', onClick:()=>{ selectedNodeId=n.id; showPathForClient(n); }});
  items.push({label:'Centralizar no mapa', onClick:()=>{ centerOn(n); }});
  items.push({sep:true});
  items.push({label:'Editar', onClick:()=>{ onNodeClick(n.id); openEditModal(n); }});
  items.push({label:'Conectar a partir daqui', onClick:()=>{ onNodeClick(n.id); startLinking(n); }});
  items.push({sep:true});
  items.push({label:'Excluir elemento', danger:true, onClick:()=>{
    if(confirm('Excluir "'+n.name+'"? Só é possível se não tiver ligações nem elementos filhos.')) deleteNode(n.id);
  }});
  return items;
}

function ctxItemsLink(l, ll){
  const a = nodeById(l.from), b = nodeById(l.to);
  const items = [
    {label:'Inserir caixa aqui (sangria) — disponível em breve', disabled:true}
  ];
  [a,b].forEach(p=>{
    if(p && ['ceo','cto'].includes(p.type))
      items.push({label:'Abrir diagrama de '+p.name, icon:ctxIcon(p.type), onClick:()=> openDiagram(p.id)});
  });
  items.push({sep:true});
  items.push({label:'Editar trecho', onClick:()=> openLinkEditModal(l)});
  if(l.type!=='wireless') items.push({label:'Editar traçado', onClick:()=> openTraceForLink(l)});
  if(l.type!=='wireless' && ll) items.push({label:'Marcar reserva técnica aqui', onClick:()=> openReserveModal(l, snapToLine(l, ll), null)});
  items.push({label:'Excluir trecho', danger:true, onClick:()=>{
    if(confirm('Excluir este trecho?')) deleteLinkRemote(l);
  }});
  return items;
}

function ctxItemsMapVazio(latlng){
  const items = ADDABLE.map(t=>({
    label:'Adicionar '+TYPE_LABEL[t]+' aqui',
    icon:ctxIcon(t),
    onClick:()=> openCreateModal(t, latlng)
  }));
  items.push({sep:true});
  items.push({label:'Enquadrar rede', onClick:fitToNetwork});
  return items;
}

mapEl.addEventListener('contextmenu',(e)=>{
  e.preventDefault();   // nunca deixa o menu nativo aparecer sobre o mapa
  if(trace){   // em edição de traçado: botão direito num ponto o remove; fora disso, não faz nada
    const v = e.target.closest ? e.target.closest('.mvertex') : null;
    if(v) traceRemove(+v.getAttribute('data-vi'));
    return;
  }
  // em modo de posicionamento/ligação, o botão direito cancela (padrão de editor)
  if(mode!=='idle'){ clearMode(); toast('Operação cancelada.'); return; }

  const t = e.target;
  const nodeG  = t.closest ? t.closest('.mnode') : null;
  const linkEl = t.closest ? t.closest('.mlink-hit, .mlink') : null;

  if(nodeG){
    const n = nodeById(nodeG.getAttribute('data-node'));
    if(n) openCtxMenu(e, TYPE_LABEL[n.type]+' — '+n.name, ctxItemsNode(n));
    return;
  }
  if(linkEl){
    const l = linkById(linkEl.getAttribute('data-link'));
    if(l){
      const a=nodeById(l.from), b=nodeById(l.to);
      const ll = toLatLng(localPt(e).x, localPt(e).y);
      openCtxMenu(e, (a?a.name:'?')+' → '+(b?b.name:'?'), ctxItemsLink(l, ll));
    }
    return;
  }
  const p = localPt(e);
  openCtxMenu(e, 'Neste ponto do mapa', ctxItemsMapVazio(toLatLng(p.x,p.y)));
});

/* ============================================================
   UTIL
   ============================================================ */
function escapeHtml(s){
  if(s===undefined||s===null) return '';
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
let toastTimer=null;
function toast(msg, ms){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.classList.remove('show'), ms || 2600);
}

/* Se os tiles forem bloqueados (o ambiente de prévia não carrega imagens
   externas), avisa e oferece a grade técnica em vez de deixar a tela vazia. */
const tileWarnEl = document.getElementById('tile-warning');
window.__tileFail = function(){
  tileErrors++;
  if(basemap!=='none' && tileErrors>=3){
    tileWarnEl.innerHTML = 'Este ambiente bloqueou as imagens do mapa base. A rede continua correta e georreferenciada — no servidor de vocês os tiles carregam normalmente. <b>Use "Grade técnica" para trabalhar aqui.</b>';
    tileWarnEl.classList.add('show');
    setTimeout(()=> tileWarnEl.classList.remove('show'), 9000);
    tileErrors = -999; // avisa uma vez só
  }
};
})();
